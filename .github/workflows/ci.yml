name: CI

# **`pull_request`에 `branches` 필터를 두지 않는다.** base로 거르면 스택 PR(base가 main이
# 아닌 PR — CLAUDE.md §4.3이 정면으로 다루는 그것)이 이 잡을 **아예 못 받는다.** 체크가
# 실패하는 것이 아니라 존재하지 않으므로 PR 화면에서 통과와 구별되지 않는다.
#
# 실측(2026-09-09): 전체 PR 107건 중 base ≠ main이 5건(#29·#30·#42·#43·#161)이고 그중
# 스택 상태에서 `check`를 받은 것은 **0건**, CI 없이 머지된 것이 **3건**이다.
# `tests/test_repo_hygiene.py::test_pull_request_workflows_do_not_limit_the_base_branch`가
# 이 규칙을 지킨다.
#
# `push`는 `main`만 둔다 — 브랜치 푸시마다 도는 것은 PR 이벤트와 중복이고, 지금도
# push run 103건이 전부 main이라 동작이 안 바뀐다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff

      # 모듈 형태로 부른다. pip가 설치한 실행 파일이 PATH에 안 잡히는 경우가 흔하고
      # (GitHub Actions에서 실제로 겪었다), `python -m`은 그 문제가 구조적으로 없다.
      - name: Lint
        run: python -m ruff check .

      - name: Import check
        run: python -m compileall -q .

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest

      # evaluation.md §4: 누출이 한 건이라도 있으면 그 run의 비교 결과는 무효다.
      # 코드 리뷰로는 보장할 수 없으므로 CI에서 막는다. prompts/ 가 기본 검사 대상이다.
      - name: Leakage check
        run: python -m eval.leakage