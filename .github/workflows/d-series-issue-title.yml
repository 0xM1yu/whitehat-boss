name: D-series 이슈 제목 검사

# `D-series` 라벨이 붙은 이슈의 제목이 `[Dn] 요약` 형식인지 확인한다.
# open-questions.md 「이 목록 관리 방식」 2단계가 그 형식을 요구하는데, 최근 이슈 몇 건이
# 등재(D 본문 파일) 없이 이슈부터 열려 그 규약을 벗어났다(#114·#121·#124).
#
# **이것은 제목 형식만 본다 — 등재 여부는 검사하지 않는다.** `if`가 이미 `D-series` 라벨이
# 붙은 이슈에서만 발화하고 제목 문자열만 읽으므로, 번호가 실제로 인덱스에 등재됐는지는
# 구조적으로 알 수 없다. 등재 강제는 ADR 0008 미결 #3의 몫이다. 그래서 제목이 `[Dn]`이면
# 등재가 안 됐어도 이 검사는 침묵한다(예: 제목만 `[Dn]`으로 바꾸고 본문은 안 만든 경우).
#
# **코멘트만 남기고 아무것도 막지 않는다.** 등재 없이 이슈부터 여는 것을 허용할지는
# ADR 0008(결함 소스 오브 트루스)이 결정 중이므로, 여기서 차단하면 그 결정을 앞선다.

on:
  issues:
    types: [opened, edited, labeled]

# 템플릿이 생성 시점에 라벨을 붙이므로 opened와 labeled가 거의 동시에 올 수 있다. 둘이
# 서로의 코멘트를 못 본 채 중복 안내를 남기지 않도록 이슈별로 직렬화한다(#129 리뷰 LOW).
concurrency:
  group: d-series-title-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  check-title:
    if: contains(github.event.issue.labels.*.name, 'D-series')
    runs-on: ubuntu-latest
    steps:
      - name: "[Dn] 제목 규약 확인"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^\[D[0-9]+\]'; then
            echo "OK: 제목이 [Dn] 형식이다."
            exit 0
          fi
          # 같은 안내를 이미 남겼으면 중복하지 않는다. 사람이 규약을 인용한 코멘트에 걸리지
          # 않도록 봇 전용 HTML 마커로 좁힌다(#129 1차 리뷰 LOW).
          #
          # gh 출력을 파이프로 grep에 바로 흘리지 않고 변수로 먼저 받는다. GHA 기본 셸은
          # `bash -e`이고 pipefail이 없어, gh가 403·타임아웃으로 실패해도 파이프 종료코드는
          # grep 것이 된다 — grep이 빈 입력에 1을 내면 if가 거짓이 되어 **중복 코멘트가
          # 달린다(fail-open)**. 변수 대입으로 받으면 gh 실패가 스텝 실패로 드러난다(#129 2차 LOW-2).
          COMMENTS=$(gh issue view "$NUM" --repo "$REPO" --json comments --jq '.comments[].body')
          if printf '%s' "$COMMENTS" | grep -q 'd-series-title-guard'; then
            echo "이미 안내 코멘트가 있다 — 건너뛴다."
            exit 0
          fi
          BODY=$(printf '%s\n' \
            '<!-- d-series-title-guard -->' \
            '🤖 **D-series 제목 규약** — 이 이슈에 `D-series` 라벨이 붙었는데 제목이 `[Dn] 요약` 형식이 아닙니다.' \
            '' \
            '`open-questions.md` 「이 목록 관리 방식」 순서:' \
            '1. **등재** — `docs/open-questions/D/D<n>.md` 본문 + 인덱스 §2에 한 줄(다음 번호 = 인덱스 §2 최대 + 1, 단 열린 이슈 제목이 이미 선점한 번호는 건너뛴다).' \
            '2. **이슈화** — 제목 `[Dn] 요약`, 라벨 `D-series`.' \
            '' \
            '등재 없이 이슈부터 여는 것이 맞는지는 **ADR 0008(결함 소스 오브 트루스)** 이 결정 중입니다.' \
            '- 등재를 강제한다면: 위 순서대로 등재 후 이 제목을 `[Dn] …`로 바꿔 주세요.' \
            '- "본문 없는 이슈"를 허용한다면: 이 안내는 무시해도 됩니다(ADR 확정 시 이 검사도 조정).' \
            '' \
            '_자동 안내이고 비차단입니다 — 이 코멘트만 남기고 아무것도 막지 않습니다._')
          gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
          echo "안내 코멘트를 남겼다."
