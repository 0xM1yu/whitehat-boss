<text x="448" y="112" font-size="21" font-weight="700" fill="#1f2328">Auditor</text>
<text x="448" y="148" font-size="14" fill="#59636e">Gathers evidence,</text>
<text x="448" y="169" font-size="14" fill="#59636e">writes a Finding</text>
