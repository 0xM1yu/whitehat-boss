<text x="610" y="112" font-size="21" font-weight="700" fill="#1f2328">Gate</text>
<text x="610" y="148" font-size="14" fill="#59636e">Grades evidence</text>
<text x="610" y="169" font-size="14" fill="#59636e">E0–E3, no model</text>
