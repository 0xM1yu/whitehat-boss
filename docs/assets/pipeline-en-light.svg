<text x="934" y="112" font-size="21" font-weight="700" fill="#1f2328">PoV</text>
<text x="934" y="148" font-size="14" fill="#59636e">Builds a crashing</text>
<text x="934" y="169" font-size="14" fill="#59636e">input (PoC)</text>
