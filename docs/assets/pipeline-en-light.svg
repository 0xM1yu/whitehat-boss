<text x="286" y="112" font-size="21" font-weight="700" fill="#1f2328">Scout</text>
<text x="286" y="148" font-size="14" fill="#59636e">Picks spots that</text>
<text x="286" y="169" font-size="14" fill="#59636e">look vulnerable</text>
