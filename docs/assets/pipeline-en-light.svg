<text x="1096" y="169" font-size="14" fill="#59636e">makes the call</text>
<text x="640.0" y="264" font-size="14" fill="#59636e" text-anchor="middle">Stages 0–3 (preprocess · index · signals · retrieval) prepare the input each role reads.</text>
