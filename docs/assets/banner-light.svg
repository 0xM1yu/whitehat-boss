<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">whitehat-boss</title>
  <desc id="d">A multi-agent harness that pairs small, role-specialized LLMs to find C/C++ vulnerabilities. Pipeline: Scout, Auditor, Gate, Critic, PoV, Oracle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2328" stroke-opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="90" y="112" font-size="68" font-weight="700" fill="#1f2328">whitehat<tspan fill="#cf222e">-</tspan>boss</text>
    <text x="92" y="152" font-size="22" fill="#59636e">small, role-specialized LLMs · evidence-graded findings · PoCs for CyberGym</text>
  </g>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <g stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)">
      <line x1="244" y1="238" x2="282" y2="238"/>
      <line x1="434" y1="238" x2="472" y2="238"/>
      <line x1="624" y1="238" x2="662" y2="238"/>
      <line x1="814" y1="238" x2="852" y2="238"/>
      <line x1="1004" y1="238" x2="1042" y2="238"/>
    </g>
    <rect x="92" y="210" width="150" height="56" rx="12" fill="#1f6feb" fill-opacity="0.10" stroke="#0969da"/>
    <text x="167" y="245" fill="#0969da">Scout</text>
    <rect x="284" y="210" width="150" height="56" rx="12" fill="#8957e5" fill-opacity="0.10" stroke="#8250df"/>
    <text x="359" y="245" fill="#8250df">Auditor</text>
    <rect x="474" y="210" width="150" height="56" rx="12" fill="#6e7681" fill-opacity="0.22" stroke="#8b949e"/>
    <text x="549" y="245" fill="#424a53">Gate E0–E3</text>
    <rect x="664" y="210" width="150" height="56" rx="12" fill="#da3633" fill-opacity="0.10" stroke="#cf222e"/>
    <text x="739" y="245" fill="#cf222e">Critic</text>
    <rect x="854" y="210" width="150" height="56" rx="12" fill="#d29922" fill-opacity="0.10" stroke="#bf8700"/>
    <text x="929" y="245" fill="#9a6700">PoV</text>
    <rect x="1044" y="210" width="150" height="56" rx="12" fill="#238636" fill-opacity="0.2" stroke="#1a7f37"/>
    <text x="1119" y="245" fill="#1a7f37">Oracle</text>
  </g>
</svg>
