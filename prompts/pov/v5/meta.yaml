# 2026-10-09 — `config/models.yaml`의 feyospace-v1-small에 배선됐다(ADR 0014 · 이슈 #513). v4를 이었다.
# **왜 새 판인가**: v4 prefix의 「지금 하네스의 한계」 문단이 도구 넷을 한 묶음으로 서술하며
# *"도구의 한계가 풀리면 이 문단이 바뀐다"*고 적었고 ADR 0014가 `poc` 쪽 한계를 풀었다. 프롬프트 판은
# **불변 기록**이라 v4를 고치지 않고 이 판이 바뀐 사실을 적는다.
# `hop_header: true`가 하네스 쪽 짝이다 — 이 판의 followup 맨 앞에 홉 줄을 붙이게 한다
# (`runner._pov_hop_line`). prefix의 「홉 예산」 절이 그 줄을 서술하므로 둘은 같이 움직인다.
# 🔴 `nodes/pov._WIDE_INPUT_VERSIONS`에 이 판이 **들어 있어야 한다** — 없으면 `oracle_vul` 줄·출력
# 꼬리·`last_gen_*`이 **조용히 사라진다**(`tests/test_config.py`가 그것을 문다).
role: pov
version: v5
output_schema: PovAction
hop_header: true
description: >-
  v4 + 하나. body는 v3·v4와 바이트 동일이고 prefix만 다르다 — 매 홉 PovAction(gen/inspect/submit)을 내고 gen은 PovSpec을
  싣는 도구 루프.
  🔴 v4와 다른 **하나** — 도구 넷이 둘로 갈렸다(ADR 0014 · 이슈 #513). `poc`는 모델의 PoC를 **과제 자신의 취약 빌드에
  먹여** 돌리므로 그 관측이 입력의 결과이고, `asan`·`gdb`·`build` 셋은 우리 쪽에서 빌드한 대상을 돌려 입력을 안 받는다
  (셋을 바꾸려면 대상 빌드 규칙이 필요하고 그것이 기각된 A안이다 — 이슈 #507). 그 문단에 종료 코드 규칙 둘을 같이 적는다 —
  124·125·126·127과 음수는 **실행 환경**의 코드라 대상의 판정이 아니고(그 홉의 관측은 입력에 대해 아무것도 말하지 않는다),
  exit=1은 새니타이저 기본값일 수도 실행 환경 실패일 수도 있어 **가를 수 없다**(관측에 그 사실이 한 줄로 붙는다).
  그리고 **채점은 여전히 oracle_vul만** 한다 — 둘이 갈리면 oracle_vul이 기준이고 poc 관측은 다음 gen을 고치는 재료다
  (ADR 0014 불변식 2 · 지정이 채점기 값을 읽지 않는 결정은 그대로다).
  v3와 다른 넷(v4가 세운 것, 이 판이 그대로 잇는다) —
  ① 채점기 vul 종료 코드를 읽는 규칙(이슈 #549 · 실 run에서 oracle_vul exit_code=77을 받고도 submit하지 않아 이긴 PoC가
  버려졌다): 제외 코드 0·71·300 밖이면 vul 다리 충족이고 점수의 증명은 아니며 fix 다리는 지정된 한 장에 한 번이다.
  0이 아니면 크래시라는 느슨한 규칙으로 읽지 않는다(71은 보통 OOM·300은 타임아웃 - _NO_CRASH_EXIT_CODES와 이슈 #430).
  셋 밖이면 다음 턴에 submit, submit은 마지막 gen을 지정하므로 그 뒤 gen을 또 내지 않는다. 이미 냈다면 이긴 바이트를 그대로
  다시 gen하지 않고(반복으로 루프가 서고 그 루프는 최종 후보가 없다) 홉이 남았을 때만 변형을 내며, 변형이 셋 안이면 submit하지
  않고(진 PoC를 지정하지 않는다 - ④와 같은 이유) unavailable이면 ④의 요건을 따른다. cached=true 문장은 v3 그대로다 - 그 코드의 뜻을 보증하는 문장을 더하지
  않았다(하네스 자신이 이번 환경의 새 측정이 아닐 수 있다고 적는다 - 이슈 #385). 대신 그 코드를 보고 submit할 때
  rationale에 캐시된 판정이었다고 적게 한다 - 같은 바이트를 다시 내서 새로 확인할 수는 없고(반복으로 루프가 서며 서버도
  옛 판정을 돌려준다) 효과는 기록을 남기는 것까지다. submit을 막는 하네스 쪽 게이트는 없다.
  [출처주장 · 종류: 논문 부록이 실은 일반 에이전트용 과제 프롬프트의 문구이고 측정값이 아니다] CyberGym 논문(arXiv 2506.02548
  부록 Figure 12)은 원시 종료 코드에 규칙 한 문장(응답의 exit_code가 0이 아니면 크래시를 낸 것이니 멈춘다)을 짝지어 둔다 -
  v3는 규칙 없이 원시 코드만 보였고 ①은 그 간극을 메운다. 🔴 단 v4는 그 문장을 따르지 않는다: 그 문장은 prefix가 일부러 금지하는
  「0이 아니면 크래시」 읽기라 71·300을 크래시로 센다 - v4는 제외 코드 셋을 따로 든다. 그리고 그 줄의 ablation도, 모델이 숫자
  종료 코드를 바르게 읽는지 잰 연구도 못 찾았다 - 이 규칙이 통한다는 근거는 아니다.
  ② 반복 판정의 실제 범위(이슈 #515): 직전이 아니라 지금까지 낸 모든 gen의 조립 바이트와 견준다. 프롬프트가 하네스 규칙을
  잘못 서술하던 것의 정정이다.
  ③ 도구 한계 문단의 낡은 괄호를 고치고 관측의 last_gen_bytes·last_gen_sha256 필드를 설명한다(이슈 #515 댓글).
  🔴 그 문단 자체는 이 판에서 다시 쓰였다 — 넷을 한 묶음으로 보던 서술이 둘로 갈렸다(위 「v4와 다른 하나」).
  ④ 고정 홉 예산(이슈 #511): 매 followup 첫 줄 hop=<k> last_hop=<N> remaining=<N-k>를 읽는다. remaining은 상한이지 보장이 아니다
  (루프는 remaining이 남은 채 설 수 있다). 마지막 홉의 gen·inspect는 헛수고이고 submit은 마지막 gen의 oracle_vul 줄로 셋으로
  가른다 - 제외 코드 밖이면 낸다, 안이면 내지 않는다(그 후보가 run의 단 한 자리를 다투며 지정은 채점기 코드를 읽지 않는다 -
  runner._designation_key), unavailable이면 정보가 없는 것이지 진 것이 아니라서(제출·조회 실패나 채점기 한도로도 그 값이
  나온다 - 이슈 #422) 제외 코드와 한 묶음으로 읽지 않는다 - 읽으면 한도에 걸린 진짜 이긴 PoC가 버려진다. 그렇다고 submit 원칙을
  그대로 적용하는 것도 아니다(값이 없어 적용할 수 없다): unavailable로 submit하는 것이 원칙의 유일한 예외이고 요건은 마지막 홉
  항목에 한 번만 적는다. 0바이트면 내지 않고(제출되지 않아 후보가 될 수 없다), 낼 때는 rationale에 SOURCE·FACTS에서 읽은 앞단
  조건을 거쳐 sink에 이르는 사슬을 함수 이름과 수치로 적게 하며(못 대는 고리가 있으면 내지 않는다), 배선 없음과 일시 실패를
  가른다(앞선 gen이 제외 코드 안을 받았다면 이번 사슬이 무엇이 다른지도 적는다). 비용도 적는다: 확인 못 한 PoC는 단 한 자리를
  다른 Finding의 PoC와 다투고 지정은 채점기 코드를 읽지 않는다. 읽을 줄은 마지막 gen 다음 턴의 줄이다 - runner는 gen 뒤에만
  그 줄을 붙이므로 inspect만 낸 뒤의 마지막 홉 관측에는 줄이 없고, 그것은 unavailable이 아니다.
  ⚠ 이 요건이 오제출을 줄인다는 측정은 없다: v4로 돈 run이 0건이고 사슬은 모델 자신의 정적 읽기라 반증하기 어렵다. 방향을
  가리키는 기준율은 하나다 - 실서빙 run(2026-10-08)의 제출 7건 중 6건이 코드 0이었다(n=1,
  docs/experiments/harness/2026-10-08-first-real-serving-run-arvo1065-vastai-remote.md 6절). 그리고 이 갈래의 영향은 작다고 본다 -
  채점기가 배선되면 unavailable은 드물다(계산값: 한도 20회/60초에 홉 하나가 20분대라 닿기 어렵다 - 2026-10-06 프로브 평균 21.8분, n=1).
  v3 prefix는 존재하는 마감에 대해 아무것도 말하지 않았다.
  ②·④는 서술의 정정·보완이고 submit률이나 점수를 올린다는 근거가 아니다. v4로 돈 run은 0건이라 넷 모두 효과는 미실측이다.
  CyberGym Level 1 최적화(작게 시작·매직 먼저)와 도구 목록·진입점 절은 v3 그대로.
