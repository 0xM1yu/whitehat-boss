# 2026-10-15 — v7을 잇는 새 판(S20 Phase 15 · ADR 0013 2026-10-15 개정). 바뀐 것은 **prefix 한 줄**이다.
# 「Hop budget」의 *"A loop that exhausts all hops without a `submit` produces no final candidate."* 뒤에 세 문장을 더했다:
#    *"Submit is how you choose. If a Finding ends with no `submit`, the harness may fall back to an intermediate `gen` whose own vul
#    response was a crash, ranked below any submitted candidate — do not rely on it."*
#    이유: ADR 0013 결정 1이 개정돼(2026-10-15, council → @danielcho02 승인) `submit` 없이 끝난 Finding의 중간 gen 중 **자기 vul 제출 응답 코드가
#    크래시 계단인 것**이 지정 후보로 구제된다(`oracle_log.OracleLedger.rescued` · `runner._designation_key`의 둘째 성분). v7은 submit 없이 끝나면
#    최종 후보가 없다고만 적었다 - 그 문장은 모델이 고르는 후보에 대해서는 여전히 참이지만(이 프롬프트에서 「final candidate」는 `submit`이 지정하는
#    것이다 - DEF-SUBMIT) 하네스가 대신 집을 수 있다는 사실을 가린다. 동시에 「크래시 뒤엔 바로 submit」 지시를 약하게 만들지 않으려고
#    구제는 **제출된 후보보다 항상 아래**이고 **기대지 말라**고 적었다.
# prefix의 나머지와 body는 v7과 바이트 동일이다 - 홉 줄·봉투·도구·DEF 규칙·source_options 선언은 안 바꿨다.
# `hop_header: true`·`output_schema: PovActionNamed`는 v7과 같다.
# 🔴 `nodes/pov._WIDE_INPUT_VERSIONS`에 이 판을 넣었다 - 없으면 `oracle_vul` 줄·출력 꼬리·`last_gen_*`이 **조용히 사라진다**
#    (`tests/test_pov_loop.py`의 `test_every_pov_prompt_version_but_v2_gets_the_wide_inputs`가 문다).
# 제외 코드는 v7과 같은 셋(0·71·300)이다 - 정본은 `src/orchestrator/oracle_log.py` `NO_CRASH_VUL_EXIT_CODES`다.
# 불변 기록: 이 판의 sha는 아래 값이다. 이 판을 바꾸면 새 판을 세운다(`docs/agent-contracts.md` §4 규칙 1).
#   prefix.md sha256 `34e8be7172d00b3b68e980c5815f66c05ef96f6d68f09936812538a9342dd911`
#   body.md   sha256 `962b7fe89e6fcbdd26d77ee96cb16571e9ec04d60bb467f15b4ed6cebaa22443`
# ⚠ 이 판은 어느 run에도 안 쓰였다. 추가 문장이 모델 행동을 바꾸는지(submit을 늦추는지 · 구제에 기대는지)는 **미실측**이다.
# v7 이하와 직접 비교하지 않는다(`docs/evaluation.md` §2.3 규칙 4).
role: pov
version: v8
output_schema: PovActionNamed
hop_header: true
description: >-
  PoV v7에 prefix 한 줄을 더한 판입니다. `submit` 없이 끝난 Finding은 자기 vul 응답이 크래시였던 중간 gen이 하네스 쪽에서 제출된 후보보다 아래 순위로
  구제될 수 있다는 사실(ADR 0013 2026-10-15)을 「Hop budget」 한 줄에 적었고, 그래도 크래시 뒤에는 바로 submit하라는 기존 지시는 그대로입니다.
  봉투·홉 줄·도구·나머지 규칙·body는 v7과 같습니다. 이 판으로 돈 run이 0건이라 효과는 미실측입니다.
# 2026-10-15 - 이 판이 서술하는 Auditor `SOURCE` 옵션 둘의 선언(PR #676 가드). v7과 같다 - prefix 「How to reach the vulnerable path」 머리
# 문단을 안 바꿨다(입력 맥락 함수 블록 · 표지 줄은 하네스 생성 텍스트). `cli._undescribed_relayed_options`가 run·doctor에서 이 선언을 읽는다.
# 이 목록은 `config.RELAYED_SOURCE_OPTIONS`의 부분집합만 든다. 이 선언은 meta 한 줄이라 위 sha 핀에 안 든다.
