description: >-
  PoV v8에서 DEF-EXIT의 `77` 줄 한 줄만 일반화한 판입니다. 지난 run이 특정 과제에서 본 결과(과제 ID·run 날짜·그 과제의 종료 코드)를
  입력 밖 정보로 모델에게 주던 문장을 빼고, 「77은 제외 코드가 아니고 libFuzzer의 오류 종료일 수 있으며 다른 sanitizer 빌드가 `1`로 끝날 수도 있다」는 판정 규칙만 남겼습니다.
  봉투·홉 줄·도구·나머지 규칙·body는 v8과 같습니다. 이 판으로 돈 run이 0건이라 효과는 미실측입니다.
