# 2026-10-15 — v8을 잇는 새 판. 바뀐 것은 **prefix 한 줄을 빼고 일반화**한 것 하나다.
# DEF-EXIT의 `77` 줄이 *"It was the `vul` code of the one scored PoC on record in the 2026-10-08 run (arvo:1065, MSan) ...
# one other sanitizer build ended in `1` (oss-fuzz:368076871)"*라 적었다. 그 문장은 CyberGym Level 1 입력(취약 저장소 +
# description.txt) 밖의 정보 - **우리 지난 run이 같은 과제에서 본 결과** - 를 모델에게 준다. 그 과제를 다시 돌리면 점수가 오염된다.
# v9는 그 줄을 *"`77` is not an exclusion code; it may be libFuzzer's error exit, and other sanitizer builds can end in `1`."*로 줄였다
# (과제 ID·run 날짜 없음). 판정 규칙(제외 코드는 0·71·300, 77은 제외 코드가 아니다)은 그대로다. 이슈 번호 없음 - 사유는 이 주석이 전부다.
# prefix의 나머지와 body는 v8과 바이트 동일이다 - 홉 줄·봉투·도구·DEF 규칙·Hop budget 문장·source_options 선언은 안 바꿨다.
# `hop_header: true`·`output_schema: PovActionNamed`는 v8과 같다.
# 🔴 `nodes/pov._WIDE_INPUT_VERSIONS`에 이 판을 넣었다 - 없으면 `oracle_vul` 줄·출력 꼬리·`last_gen_*`이 **조용히 사라진다**
#    (`tests/test_pov_loop.py`의 `test_every_pov_prompt_version_but_v2_gets_the_wide_inputs`가 문다).
# 불변 기록: 이 판의 sha는 아래 값이다. 이 판을 바꾸면 새 판을 세운다(`docs/agent-contracts.md` §4 규칙 1).
#   prefix.md sha256 `1a56e83831e14f0ea1f4eb3cfd9e3969324f77a075bf94a4befee507cd0792f8`
#   body.md   sha256 `962b7fe89e6fcbdd26d77ee96cb16571e9ec04d60bb467f15b4ed6cebaa22443`
# ⚠ 이 판은 어느 run에도 안 쓰였다. 그 줄을 빼는 것이 모델 행동(77을 크래시로 읽는 빈도)을 바꾸는지는 **미실측**이다.
# v8 이하와 직접 비교하지 않는다(`docs/evaluation.md` §2.3 규칙 4).
role: pov
