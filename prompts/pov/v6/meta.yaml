role: pov
version: v6
output_schema: PovActionNamed
hop_header: true
description: >-
  v5를 영어로 다시 쓴 판(PR #636)이다. 매 홉 PovActionNamed(gen/inspect/submit)을 내고 gen은 PovSpec을 싣는 도구 루프이며,
  submit은 poc_sha256으로 앞선 gen을 지명할 수 있다 — 봉투·홉 줄·도구 넷의 구분·채점기 vul 줄은 v5와 같다.
  body는 v5와 같은 입력 틀(FINDING·TARGET·SOURCE·FACTS)을 영어로 적었다(그래서 v5 body와 바이트 동일이 아니다).
  v5와 다른 점 —
  ① prefix와 body가 영어다. 규칙을 한 번만 서술하는 「Core definitions」 절(DEF-EXIT·DEF-SUBMIT·DEF-REPEAT·DEF-UNAVAIL·DEF-CACHED)을
  세우고 나머지 절은 그것을 참조한다 — v5는 같은 규칙을 여러 절에 되풀이했다.
  ② 도달 가이드를 바꿨다: 입력 파서 문법을 sink까지 추적하고(관례로 구두점을 짐작하지 않는다), 한 번에 한 원인만 바꾸며,
  새니타이저 리포트의 종류를 Finding의 버그 종류·sink와 대조한다(다른 종류 리포트는 sink 도달의 증거가 아니다 — 대조는 rationale에
  적고 submit 판단은 DEF-EXIT가 정한다).
  ③ 하네스가 하는 일을 prefix에 더했다: 이미 돌린 도구를 다시 요청한 inspect의 inspect_repeat … rerun=false 줄(runner.py, 이슈 #619),
  첫 gen 전의 inspect poc가 돌릴 바이트가 없다는 것, 스키마 파싱 실패 뒤 재질문 노트(홉 줄 + `[스키마 오류] <사유>` · runner._pov_parse_retry_note ·
  이슈 #550 — v5 prefix는 이것을 서술하지 않는다).
  ④ 출력 규칙: JSON 하나만 내고 rationale은 한 문장으로 한다(마지막 홉 사슬·cached 메모·리포트 종류 불일치 메모는 예외). 긴 추론 응답을 줄이려는 의도다.
  🔴 제외 코드는 v5와 같은 셋(0·71·300)이다. 그래서 77을 받은 PoC는 vul 다리를 채운 것으로 읽고 다음 턴에 submit한다.
  ⚠ 이 판은 v5에서 관측된 같은 문장 반복·실패 원인을 분석하지 않고 비슷한 PoC를 되내는 되먹임(원인은 분석하지 않았다)을 겨냥해 다시 썼다.
  효과는 미실측이다 — 이 판으로 돈 run이 0건이고, 영어로의 전환 자체가 모델 행동에 주는 영향도 재지 않았다. v5와 직접 비교하지 않는다
  (`docs/evaluation.md` §2.3 규칙 4 — 프롬프트가 바뀌면 이전 run과 직접 비교하지 않는다).
