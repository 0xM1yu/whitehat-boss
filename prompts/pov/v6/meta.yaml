# 제외 코드는 `0`·`71`·`300` 셋이다 — 정본은 `src/orchestrator/oracle_log.py` `NO_CRASH_VUL_EXIT_CODES`와
#    `src/adapters/cybergym_oracle.py` `_NO_CRASH_EXIT_CODES`다. `77`은 제외 코드가 **아니다**(10-08 실서빙 run의 점수 1 PoC가 `vul` exit 77 ·
#    `docs/experiments/harness/2026-10-08-first-real-serving-run-arvo1065-vastai-remote.md` · ADR 0013).
# `77` 문장의 근거 — 저장소 안: `arvo:1065`(MSan) `vul` 77 · `oss-fuzz:368076871`(ASan) `vul` 1(ADR 0014 「안 재 본 것」 ·
#    `container_tools._POC_AMBIGUOUS_EXIT` 주석). 🔴 **저장소 밖 지식 · 미실측:** 「77은 libFuzzer의 기본 error exitcode」와
#    「leak 전용 리포트도 제외 코드 밖으로 끝날 수 있다」(LSan의 종료 코드는 이 저장소에서 잰 적이 없다). prefix는 둘을 단언하지
#    않고 「may」로 적는다.
# `submit` 지명(`poc_sha256`)의 규칙은 DEF-SUBMIT 한 곳에만 둔다. 지명이 틀리면(8자 미만·16진 밖·불일치·모호) 하네스가 조용히
#    마지막 gen으로 폴백한다(`runner._resolve_submit_digest`) — prefix가 그것을 적는다.
# `unavailable` submit은 v5처럼 어느 홉에서나 요건(Hop budget)을 채우면 허용한다 — 마지막 홉으로 좁히지 않았다.
# 3라운드 리뷰 반영: 마지막 gen이 `unavailable`이고 앞선 gen이 제외 코드 밖이면 DEF-UNAVAIL이 `poc_sha256` 지명으로 보낸다(요건 셋은 마지막 gen 자체 바이트의
#    bare `submit`에만 적용). 「제외 코드 밖이면 다음 턴 submit」·「안이면 금지」·「0바이트」·「반복 금지」는 각각 DEF-SUBMIT·DEF-REPEAT 한 곳이 본문이고 나머지는 참조다.
# 환경 실패 코드는 124~127·음수 외에 137·255·255 초과·데몬 미도달 exit=1이다(`container_tools._poc_is_harness_failure` ·
#    `_POC_ENV_FATAL` · `_POC_DAEMON_UNREACHABLE`). `71`·`139`는 대상이 낸 값일 수 있어 환경 코드가 아니다.
# 이 판의 첫 커밋(`6ae9513`)은 제외 코드에 77을 넣고 있었고 리뷰가 그것을 잡아 고쳤다 — 첫 커밋 prefix.md sha256은 `786f2c2029ccfab058c210acddc19db4450abe77591a9a664d015732bc8bec1d`다.
