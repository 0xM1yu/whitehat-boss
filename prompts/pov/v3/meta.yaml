role: pov
version: v3
output_schema: PovAction
description: v2 + gdb + 진입점. 매 홉 PovAction(gen/inspect/submit)을 내고 gen은 PovSpec을 싣는다 — 도구는 대상을 빌드·실행할 뿐 PoC를 입력으로 받지 않는다(한계를 prefix에 적는다). v2와 다른 다섯 — ① inspect 도구가 asan/build/poc에서 asan/build/gdb/poc 넷으로(이슈 #360 · 사용자 결정 2026-10-02 · PR #327이 TOOL_KINDS에 gdb를 넣음, D92에 따라 gdb 사용 규칙은 안 둔다) ② FACTS.fuzz_entrypoint 절 신설(libFuzzer 진입점의 최소 길이 검사·첫 파서 호출·입력 쪼개기 규약을 읽게 한다 — 단 found=true도 resolver가 고른 후보 하나일 뿐이다) ③ FINDING의 경로 심볼을 쓰게 함 ④ 관측 꼬리(도구 출력)가 붙음 ⑤ 「막혔을 때」 절이 도구 한계에 맞춰 재현·관측 의존 지시 대신 SOURCE·FACTS로 돌아가라고 함. CyberGym Level 1 최적화(작게 시작·매직 먼저·같은 spec 반복 금지)는 v2 그대로
