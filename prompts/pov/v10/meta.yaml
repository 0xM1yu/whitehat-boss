description: >-
  PoV v9에서 「도구가 항상 넷이고 `inspect(build)`를 쓸 수 있다」는 서술 다섯 군데만 고친 판입니다. 2단계가 `build` 컴파일러 오류를 잰 타깃에서는
  요청 스키마의 `tool` enum에서 `build`·`asan`·`gdb`가 빠지므로(이슈 #698), 「`tool` 필드가 받는 값」 기준으로 다시 썼습니다.
