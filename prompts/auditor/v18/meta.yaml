# 도구 루프 판. 배선 조건은 v12·v14~v17과 같다 — `config/models.yaml`의 auditor 엔트리가 이 버전을 고르고
# `config/budgets.yaml`의 `thresholds.auditor_tool_hops`가 양수여야 루프가 돈다(`nodes/auditor.loop_problem`).
#
# v18 = v17 + **두 군데**(이슈 #698 · #602, council 2026-10-16). body·도구·옵션 열은 v17과 같다.
# - body는 v17과 바이트 동일이다. prefix는 두 군데만 v17과 다르다(`tests/test_auditor_v18.py`가 묶는다):
#   ① 「Harness note (stage 2)」 문단의 두 문장(#698, 아래) ② 「The JSON Schema does not enforce …」 문장(#602).
# - **②(이슈 #602) — 디코더가 받는 JSON 스키마가 판별 합이다.** meta의 `output_schema`가 v15~v17의
#   `AuditorProcedureProbeInputAction`이 아니라 그 서브클래스 `AuditorProcedureProbeInputDiscriminatedAction`이다.
#   스키마가 `action`별 세 갈래(`answer` 갈래는 `procedure` 필수·non-null)로 서고, `procedure`는 `trigger_status`별
#   두 갈래다 — `no_signal`이면 `audit.category` `none` · `defense.status` `not_applicable` ·
#   `refutation.result` `no_candidate` · `cwe` null로 고정하고, 다른 상태면 그 셋을 빼고 `cwe`를 non-null로 둔다.
#   v17 이하는 `procedure`를 빠뜨린 `answer`와 `no_signal`인데 `defense.status`가 `absent`인 답을 문법이 허용하고
#   pydantic이 뒤에서 거절해 후보가 버려졌다(`run_20261016_0001` 후보 4개 중 2개 — n이 작다). pydantic 검증기는
#   그대로 남아 백스톱이다 — 바뀐 것은 디코더가 보는 스키마뿐이다. 그래서 prefix의 「JSON Schema does not enforce」
#   문장이 거짓이 되어 고쳤다. ⚠ 백엔드(vLLM xgrammar)가 이 스키마를 컴파일하는지는 서빙 전 스키마 컴파일 게이트가
#   따로 본다 — 이 판은 그것을 보장하지 않는다. 판별이 판정 분포(`trigger_status`)와 소실 수에 주는 영향은 안
#   쟀다(첫 run에서 v17과 나란히 본다).
# - **①(이슈 #698) —** v17은 「`build`·`asan`·`gdb`는 같은 컴파일 명령이라 같은 오류가
#   예상된다」·「it refuses no tool: a `probe` you still choose runs as usual」이라 적었는데, #698부터 컨테이너
#   어댑터가 이 run에서 컴파일러 오류로 실패한 앞단 컴파일 명령을 **다시 띄우지 않고** 그 측정을 돌려준다
#   (`container_tools.ContainerToolRunner._execute` · `tests/test_container_tools.py`의 #698 절). 그래서 v17의
#   두 문장이 거짓이 됐다. 그리고 노드가 같은 실패로 그 파일의 요청 스키마 `tool` enum에서 `build`·`asan`·`gdb`(clang-tidy가
#   오류를 냈으면 `clang-tidy`도)를 뺀다(`signals.withheld_tools`·`without_tools`). v18은 그 사실(그 도구는 제시되지 않는다)을 적는다.
# 불변 기록: 이 판의 sha는 아래 값이다. 이 판을 바꾸면 새 판을 세운다(`docs/agent-contracts.md` §4 규칙 1).
#   prefix.md sha256 `39ec93df361e1ba4a9f1f36ed04221110070023d236d7afa826187e9570df199`
#   body.md   sha256 `c4799594df6cc3e6d84658674e82bf357d9127479a27c255b93a5a093acb9584` (v17 body와 같다)
# ⚠ 이 판은 어느 run에도 안 쓰였다. 빠진 도구는 서버가 `response_format` strict를 집행하는 한 문법이 막는다(같은
#   xgrammar 문법의 거절은 `tests/test_check_decoder_schemas.py`가 잰다 · 집행하지 않아도 하위 봉투 검증이 거절한다).
#   백엔드가 그 스키마를 받는지는 서빙 전 스키마 컴파일 게이트(doctor)가 본다.
# v17 이하와 직접 비교하지 않는다(`docs/evaluation.md` §2.3 규칙 4).
