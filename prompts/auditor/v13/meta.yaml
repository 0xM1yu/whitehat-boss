# 도구 루프 판. 배선 조건은 v11과 같다 — `config/models.yaml`의 auditor 엔트리가 이 버전을 고르고
# `config/budgets.yaml`의 `thresholds.auditor_tool_hops`가 양수여야 루프가 돈다(`nodes/auditor.loop_problem`).
#
# v13 = v11 + **FACTS에서 `source` 키를 뺀다**(이슈 #67 · 저장소 소유자 결정 2026-10-10 — 산문 SOURCE
# 블록을 남기고 FACTS의 같은 사본을 걷는다. FACTS는 식별자·근거를 든다).
# v11까지는 같은 SOURCE 문자열이 산문 블록과 FACTS JSON(`source`) 양쪽에 실렸고, body가 FACTS를 「the complete
# set of facts」라 불러 산문 블록이 FACTS 밖의 것이 됐다.
# - body는 Facts 머리 문장 한 줄만 바꿨다 — JSON이 식별자·근거를 들고 분석 대상 코드는 위 `SOURCE`라고 적는다.
#   「complete」 주장을 뺐다.
# - prefix는 `FACTS.source`를 가리키던 한 자리(`SOURCE`/`FACTS.source` → `SOURCE`)만 바꿨다. 그 밖은 v11과 바이트
#   동일이다(`tests/test_auditor_v13_facts.py`가 차이를 그 두 줄로 묶는다).
# - 봉투·SOURCE 옵션·도구는 v11과 같다 — `cwe`가 no_signal에서만 null인 v11 계약을 그대로 든다.
# - FACTS에서 `source`를 빼는 것은 아래 `facts_source: false` 선언이 켠다(`prompt_loader` 모듈 docstring
#   「meta의 `facts_source`」). 키를 null로 두지 않고 **아예 뺀다** — null은 「원문이 없다」로 읽힌다.
# ⚠ ~~이 판은 어느 run에도 안 쓰였다.~~ ⏵ 2026-10-11 — 실서빙 run 1건에 쓰였다(run_20261011_0001 ·
#   docs/experiments/harness/2026-10-11-serving-run-arvo1065-vastai-remote.md · Auditor 호출 20건 ·
#   Finding 5건 · checksum 0이라 비교표 밖). 줄어든 요청 크기는 픽스처 렌더의 계산값뿐이고(PR 본문), 서빙 입력 토큰과
# 모델 판정에 주는 효과는 미실측이다. v11 이하와 직접 비교하지 않는다(`docs/evaluation.md` §2.3 규칙 4).
# ⏵ 2026-10-11 — `qwen3.8-27b`를 v14로 올려 지금은 어느 registry 엔트리도 이 버전을 고르지 않는다. v14 = v12 + 같은
# FACTS 변경이다 — 이 판은 봉투가 v11 것(`no_signal`이면 `audit` null)이라 v12 계약인 FT 정답과 어긋났다(이슈 #578).
# 이 판의 prefix·body·meta 키와 봉투는 그대로다(규칙 1). `_CONTENT_AWARE_VERSIONS`에도 남는다.
role: auditor
version: v13
output_schema: AuditorProcedureNullableCweAction
description: v11에서 FACTS의 source 사본을 뺀 판입니다(이슈 #67). 분석 대상 코드는 산문 SOURCE 블록 하나로만 싣고, FACTS는 식별자와 근거를 듭니다. Facts 머리 문장이 JSON을 「사실 전부」라 부르지 않게 고쳤고, 봉투·도구·SOURCE 옵션은 v11과 같습니다.
source_options: [auditor_source_tokens, auditor_definitions, auditor_callee_hops, auditor_caller_lines, auditor_callee_wrappers, auditor_indirect_callees, auditor_write_sites, auditor_guards]
tools: [semgrep, clang-tidy, build, asan, gdb, poc]
facts_source: false
