# 도구 루프 판. 배선 조건은 v12와 같다 — `config/models.yaml`의 auditor 엔트리가 이 버전을 고르고
# `config/budgets.yaml`의 `thresholds.auditor_tool_hops`가 양수여야 루프가 돈다(`nodes/auditor.loop_problem`).
#
# v14 = v12 + **FACTS에서 `source` 키를 뺀다**(이슈 #67 · 저장소 소유자 결정 2026-10-10·11).
# v13(#591)은 같은 변경을 v11 위에 얹었다 — 봉투가 v11의 `AuditorProcedureNullableCweAction`이라 `no_signal`이면 `audit`가
# 정확히 null이다. FT 데이터의 정답은 v12 계약(`no_signal`에도 `audit`를 채운다, 이슈 #578)이라 그 데이터로 학습한
# Auditor를 v13으로 서빙하면 구조화 출력이 학습한 출력을 막는다. v13의 요청 바이트·봉투를 고치지 않고 새 판을 세웠다
# (meta 주석은 바뀔 수 있다 · agent-contracts §4 규칙 1).
# - body는 v13과 바이트 동일이다 — v12(= v11) body에서 Facts 머리 문장 한 줄만 바꿨다. JSON이 식별자·근거를 들고 분석
#   대상 코드는 위 `SOURCE`라고 적는다(「complete」 주장을 뺐다).
# - prefix는 v12에서 `FACTS.source`를 가리키던 한 자리(`SOURCE`/`FACTS.source` → `SOURCE`)만 바꿨다. 그 밖은 v12와 바이트
#   동일이다(`tests/test_auditor_v14_facts.py`가 차이를 그 두 줄로 묶는다).
# - 봉투·SOURCE 옵션·도구는 v12와 같다 — `audit`를 모든 상태에서 채우고, no_signal ⟺ `category` `none` ·
#   `defense.status` `not_applicable` · `refutation.result` `no_candidate`, `cwe`는 no_signal에서만 null.
# - FACTS에서 `source`를 빼는 것은 아래 `facts_source: false` 선언이 켠다(`prompt_loader` 모듈 docstring
#   「meta의 `facts_source`」). 키를 null로 두지 않고 **아예 뺀다** — null은 「원문이 없다」로 읽힌다.
# ⚠ 이 판은 어느 run에도 안 쓰였다. 서빙 입력 토큰과 모델 판정에 주는 효과는 미실측이다. v12 이하와 직접 비교하지
# 않는다(`docs/evaluation.md` §2.3 규칙 4).
role: auditor
version: v14
output_schema: AuditorProcedureAuditAlwaysAction
description: v12에서 FACTS의 source 사본을 뺀 판입니다(이슈 #67). 분석 대상 코드는 산문 SOURCE 블록 하나로만 싣고, FACTS는 식별자와 근거를 듭니다. 봉투(no_signal에도 audit를 채움)·도구·SOURCE 옵션은 v12와 같고, body는 v13과 같습니다. v13은 같은 변경을 v11 위에 얹은 판입니다.
source_options: [auditor_source_tokens, auditor_definitions, auditor_callee_hops, auditor_caller_lines, auditor_callee_wrappers, auditor_indirect_callees, auditor_write_sites, auditor_guards]
tools: [semgrep, clang-tidy, build, asan, gdb, poc]
facts_source: false
