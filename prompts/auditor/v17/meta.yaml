# 도구 루프 판. 배선 조건은 v12·v14·v15·v16과 같다 — `config/models.yaml`의 auditor 엔트리가 이 버전을 고르고
# `config/budgets.yaml`의 `thresholds.auditor_tool_hops`가 양수여야 루프가 돈다(`nodes/auditor.loop_problem`).
#
# v17 = v16 + **두 군데**(S20 Phase 14 · 이슈 #438 (b) · #669의 Auditor 몫). body·봉투·도구·다른 옵션 아홉은 v16과 같다.
# - body는 v16과 바이트 동일이다. prefix는 아래 **두 군데**만 v16과 다르다(`tests/test_auditor_v17.py`가 묶는다).
#   1. 「Original-source input contract」의 마지막 항목 정정: v16은 「배너가 없으면 `SOURCE`는 첫 블록 하나」라고 했는데, 쓰기 지점
#      창이 전부 못 실리면(크기 상한 · 개수 상한) `SOURCE`는 배너 없는 entry 함수 **+ 끝 줄 표지**
#      (`/* ... +N more write windows not shown ... */`, 이슈 #650)라 거짓이다(`runner._auditor_source`의 `anchor_text` 경로 ·
#      `tests/test_slice_targets.py::test_marker_follows_a_bare_anchor_when_every_window_is_size_dropped`). 예외를 더했다.
#   2. 새 항목 `FACTS.slice_state`: 슬라이서가 슬라이스마다 쓴 정적 사실(`analysis_kind` · `degraded` · `truncated` +
#      `truncation_reasons` · `boundary_reasons` · `sinks_capped` · `cross_method_flow_truncated`)이다. 모름(`null`)은 `false`가 아니고, 키가 없는 것도 완전하다는 증거가 아니다 —
#      그 서술은 키가 없을 때도 참이라 옵션이 꺼진 run에서도 맞다. 키를 만드는 곳은 `orchestrator/slice_state.facts`다.
# - source_options: v16의 아홉에 `auditor_slice_state`를 더한 열이다. 이 옵션은 `config/budgets.yaml`에서 **꺼져 있다** — 켜는 것은
#   측정 결정이다(D101의 닫히는 조건이 켠 run ↔ 끈 run 짝 비교를 요구한다). 같은 판이 둘을 다 서술해야 짝 비교가 같은 prefix에서
#   선다(그래서 끈 채로 선언한다 — `tests/test_config.py`의 선언 == 켜진 옵션 검사는 이 하나만 예외로 둔다). v16 이하를 고르고
#   켜면 `cli`의 run·doctor가 막는다(`_undescribed_source_options`).
# ⚠ #669의 나머지(Critic v7 60-62행 · PoV v6)는 이 판이 안 고친다 — 같은 SOURCE 문자열이 Critic·PoV에도 가므로 그 판 쪽 서술은
#   별도 판 몫이다.
# ⚠ 이 판은 PR #668(v16 · 입력 맥락 블록) 위에 선다 — v16 prefix의 입력 맥락 서술을 그대로 물려받으므로 그 블록이
#   코드에 있어야 서술이 맞다.
# 불변 기록: 이 판의 sha는 아래 값이다. 이 판을 바꾸면 새 판을 세운다(`docs/agent-contracts.md` §4 규칙 1).
#   prefix.md sha256 `8905905f4ab2fd1b744eb63696f613be0855eab2b83f74f11c5ea58ca465162a`
#   body.md   sha256 `c4799594df6cc3e6d84658674e82bf357d9127479a27c255b93a5a093acb9584` (v16 body와 같다)
# ⚠ 이 판은 어느 run에도 안 쓰였다. 켠 옵션의 효과(모델이 `slice_state`를 판정에 쓰는지 · 입력이 길어지는 정도)는 미실측이다.
# v16 이하와 직접 비교하지 않는다(`docs/evaluation.md` §2.3 규칙 4).
