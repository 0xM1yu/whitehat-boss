# 도구 루프 판. 배선 조건은 v12·v14·v15와 같다 — `config/models.yaml`의 auditor 엔트리가 이 버전을 고르고
# `config/budgets.yaml`의 `thresholds.auditor_tool_hops`가 양수여야 루프가 돈다(`nodes/auditor.loop_problem`).
#
# v16 = v15 + **`SOURCE` 블록 하나의 서술**(S20 Phase 13 · council 2026-10-14 + 사용자 최종 승인). 새 옵션
# `auditor_input_context`가 켜지면 슬라이서의 `analysis.input_context`가 고른 입력 디코더 함수의 본문이 `SOURCE`
# 블록의 **맨 끝**(쓰기 지점 창 다음)에 붙는다(`orchestrator/source_input_context`). body·봉투·도구·다른 옵션 여덟은
# v15와 같다.
# - body는 v15와 바이트 동일이다. prefix는 아래 **다섯 군데**만 v15와 다르다(`tests/test_auditor_v16.py`가 묶는다).
#   1. 「Trust boundary」의 하네스 생성 텍스트 목록에 `/* ... +N more write windows not shown ... */` 줄을 더한다 -
#      쓰기 지점 창이 보인 것보다 많았을 때 `SOURCE`의 **맨 끝**(모든 블록 뒤)에 붙는 줄이다(이슈 #650 · PR #667).
#   2. 「Original-source input contract」 머리: 「banners and the GUARDS block」 예외에 그 목록의 표지 줄을 더한다.
#   3. 쓰기 지점 창 항목: 「Last」가 「Then」이 되고(이제 맨 끝이 아니다) 표지 줄이 무엇을 뜻하는지 한 문장을 더한다.
#   4. 새 항목 「Last, input-context functions」 - CPG 근거(`basis: cpg`)가 선 선택만 붙는다 · 전체가 이미 실린 함수만
#      건너뛰고 창 조각과 일부만 겹치면 붙어 몇 줄이 중복될 수 있다 · 상한에 넘치면 통째로 뺀다 · 블록이 없을 수 있고
#      없음은 증거가 아니다 · 붙었다고 슬라이스의 데이터가 그 함수를 지난다는 뜻은 아니다. 러너 동작과 같다.
#   5. 보조 문맥 목록(「supporting context」)에 입력 맥락 함수를 더한다.
# - source_options: v15의 여덟에 `auditor_input_context`를 더한 아홉이다. v15 이하를 고르고 그 옵션을 켜면 `cli`의
#   run·doctor가 막는다(`_undescribed_source_options`) - v15는 이 옵션의 서술이 없어 SOURCE와 어긋난다.
# ⚠ 1·3번은 PR #667(쓰기 지점 창 표지)이 main에 들어와야 코드와 맞는다 - 그 전에 서빙하면 그 줄은 `SOURCE`에 안
#   나온다(CLAUDE.md §2.1). 머지 순서(2026-10-14 기준)는 #667 → 이 PR이다.
# ⚠ 같은 SOURCE 문자열이 PoV(`pov._WIDE_INPUT_VERSIONS` 판)와 Critic에도 간다(`finding_sources`) - 디코더 본문과
#   표지 줄이 그 프롬프트에도 든다. PoV·Critic 판 쪽 서술은 이 판이 안 고친다.
