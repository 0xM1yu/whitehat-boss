# 아직 미활성(gpt-oss-20b은 v1): critic/v3는 신설(#237)됐고 근거 본문 배선이 들어왔다
# (critic 노드가 v3 경로에서만 payload 본문을 EVIDENCE·FACTS에 싣는다). 그래서 이 prefix는
# 더 이상 「항상 need_evidence」가 아니라 content-conditional이다 — 본문 있으면 rebut/uphold,
# ID·metadata만이면 need_evidence. **다만 gpt-oss-20b을 v3로 켜는 것은 validated·proven이
# 실제로 흐르는지 확인하는 run(#237 HIGH-1) 뒤 별도 단계다.** 그전까지 v1 유지.
#
role: critic
version: v3
output_schema: DecisionDraft
description: 주장·경로·근거(있으면 머리줄을 뺀 도구 로그의 결정론적 절단까지)를 받아 반박하는 7단계 비판. 근거 없는 `rebut`을 금지하고 `need_evidence`로 보낸다
