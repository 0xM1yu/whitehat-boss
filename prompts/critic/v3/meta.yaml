# 미배선(disk-only): 이 PR(#237)은 critic/v3를 신설하지만 **켜지 않는다**. gpt-oss-20b은 v1로
# 둔다 — critic/v3 prefix가 metadata-only 런타임에서 항상 need_evidence를 내 validated·proven이
# 0이 되고 8단계가 안 돌기 때문이다(리뷰 #237 HIGH-1). evidence 본문이 Critic에 닿는 변경 뒤 올린다.
#
# ⚠ **2026-09-12에 이 버전의 본문이 바뀌었고 `version`은 그대로다** (PR #182).
# 그래서 `prompt_version: "v2"`가 **서로 다른 두 텍스트**를 가리킨다 — 그 날 이전 run의
# 기록과 이후 run의 기록이 같은 라벨을 달고 다른 프롬프트를 뜻한다.
#
# **왜 범프하지 않았나.** `prompt_template_version`이 `ModelEntry`별이라(`config/models.yaml`)
# 커밋된 9개 프로필 중 **7개에서 critic 엔트리가 scout·auditor와 공유된다** —
# `fake`(dev 5개 + `single_gpu_12g`)와 `qwen3-coder-30b-a3b`(`b1_single`). critic만 v3로
# 올리면 그 둘이 없는 `prompts/scout/v3`·`prompts/auditor/v3`를 찾는다 (D67 · 이슈 #172의
# 선택지 (b)가 그 자리다).
#
# **왜 되돌리지도 않았나.** 이 버전의 계약은 이미 `146fcf7`이 깨뜨렸다 — 노드가
# `DecisionDraft`를 보내는데 아래 `output_schema`는 `Decision`이었다. 제자리 수정은
# **그 어긋남을 없애는 것**이지 새로 만드는 것이 아니다.
#
# **해소 조건.** 역할별 `prompt_version`(D67 · #172 선택지 (c))이 들어오면 그때 v3로 가른다.
# ⚠ evaluation.md §2.3 규칙 4("프롬프트 버전이 바뀌면 재측정한다")가 이 건에는 **발화하지
# 않는다** — 버전 문자열이 안 바뀌었다. 그 사실과 영향 범위는
# `docs/agent-contracts.md` §4 규칙 1의 ⚠ 문단에 있다.
role: critic
version: v3
output_schema: DecisionDraft
description: 주장·경로·근거 ID만 받아 반박하는 7단계 비판. 근거 없는 `rebut`을 금지하고 `need_evidence`로 보낸다
