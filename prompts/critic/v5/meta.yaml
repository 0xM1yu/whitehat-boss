# ⏵ 2026-10-02 — 배선됨. `config/models.yaml`의 `gpt-oss-20b.prompt_template_version`이 v5를
# 고르고(`harness_pool`·`_hybrid`의 critic), `nodes/critic.py`의 `_CONTENT_AWARE_VERSIONS`가 이
# 버전에서 bounded evidence body를 EVIDENCE·FACTS에 싣는다. 이 판으로 돈 run은 저장소에 아직 0건이다.
# Critic은 이 판에서도 대상 원문을 안 받는다 — prefix가 FACTS의 `source`·`capsule_sections`·`callers`를
# default-empty로 서술하고 body에 `{{SOURCE}}` 자리가 없다. 노드가 그 서술대로 보내는지는
# `tests/test_nodes.py`의 `test_critic_node_sends_the_input_its_prefix_describes`가 묶는다.
role: critic
version: v5
output_schema: DecisionDraft
description: gpt-oss Harmony 응답과 절단된 도구 출력을 고려한 독립 비판. 판정에 필요한 누락과 본문 없는 metadata-only 입력은 `need_evidence`로 보낸다
