[project]
name = "whitehat-boss"
version = "0.1.0"
description = "소형 LLM 앙상블 기반 취약점 연구 Multi-Agent Orchestration Harness"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    # config/*.yaml 로더 (src/config.py). engineering-guide.md §2가 설정 파일을 YAML로 정한다.
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
