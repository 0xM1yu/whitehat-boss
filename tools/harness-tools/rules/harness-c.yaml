# 하네스 전용 최소 룰셋.
#
# `src/adapters/fake_tools.py`의 `_STATIC_PATTERNS`와 **같은 것을 잡는다.** Fake와 실제
# 컨테이너가 같은 표본에서 같은 판정을 내야 dev_fake와 dev_docker의 결과를 비교할 수 있다.
# 공개 룰셋(/opt/semgrep-rules/c)과 함께 로드되므로, 여기 있는 것은 그쪽이 놓치는
# 최소 보증선이다 — 픽스처의 취약/benign 구분이 공개 룰셋의 버전에 좌우되면 안 된다.
rules:
  - id: harness-memcpy-nonconstant-length
    languages: [c, cpp]
    severity: WARNING
    message: 길이가 상수가 아닌 memcpy — 대상 버퍼 크기와 비교되지 않았을 수 있다
    patterns:
      - pattern: memcpy($DST, $SRC, $LEN)
      - pattern-not: memcpy($DST, $SRC, sizeof(...))
      # 정수 리터럴은 제외한다. 식별자·수식으로 시작하는 길이만 남긴다.
      - metavariable-regex:
          metavariable: $LEN
          regex: ^[A-Za-z_]

  - id: harness-unbounded-string-copy
    languages: [c, cpp]
    severity: ERROR
    message: 길이 상한이 없는 문자열 함수 — 대상 버퍼를 넘길 수 있다
    pattern-either:
      - pattern: gets(...)
      - pattern: strcpy(...)
      - pattern: strcat(...)
      - pattern: sprintf(...)
