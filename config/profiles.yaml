# 실행 프로필 (model-serving.md §5, engineering-guide.md §2)
#
# 프로필 교체만으로 B1/B1'/B3/B3' 조건과 실행 환경을 구성할 수 있어야 한다.
# `roles`의 값은 models.yaml의 model key다. scout·auditor·critic은 필수다.
# `adapters`는 모델 외 3개 인터페이스의 구현 선택이다. ModelClient는 여기서 고르지 않는다 —
# models.yaml의 endpoint 스킴이 역할별로 결정하므로 한 프로필에서 실서빙과 Fake가 섞일 수 있다.

profiles:
  dev_fake:
    description: "GPU 없이 파이프라인 0~9단계를 완주시키는 개발 프로필. 전 역할 Fake."
    # 팀원 대부분이 GPU 접근이 없다. 이 프로필로 전체 경로가 돌지 않으면 병렬 작업이 막힌다.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: fake
      state_store: memory
    budget: dev_fake

  dev_hybrid:
    description: "GPU 없이 hybrid Retriever 경로를 태우는 개발 프로필. 전 역할 Fake."
    # dev_fake와 다른 점은 `retriever: hybrid` 하나다. embedding·reranker도 Fake이므로
    # GPU가 없어도 광역 수집 → embedding → reranker 재선별 경로가 실제로 실행된다.
    # 실서빙과의 차이는 두 클라이언트 구현뿐이고, 그 선택은 endpoint 스킴이 한다.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: hybrid
      tool_runner: fake
      state_store: memory
    budget: dev_fake

  dev_hybrid_docker:
    description: "hybrid Retriever가 실제 index.json을 읽는 유일한 프로필. 전 역할 Fake 모델."
    # `dev_hybrid`와 다른 점은 `tool_runner` 하나다.
    #
    # **이 조합이 없으면 HybridRetriever의 그래프 섹션 경로가 어느 프로필에서도 돌지
    # 않는다.** index.json을 내는 프로필은 전부 `retriever: fake`이고(dev_docker·
    # dev_singularity·local_balanced·b1_single), `dev_hybrid`는 `tool_runner: fake`라
    # index.json이 만들어지지 않는다 — hybrid의 `callers`/`callees` 분기가 죽은 코드가 된다.
    #
    # 이 저장소는 "픽스처가 실전을 대표하지 못해 생긴 결함"을 이미 두 번 겪었다:
    # clang의 include 경로(D13)와 tree-sitter 최상위 한 겹(zlib 28.3%/json 70.3%).
    # 둘 다 테스트는 초록이었다. 프로필이 없으면 같은 자리가 또 생긴다.
    #
    # 모델이 전부 Fake라 GPU가 필요 없고 `production: false`라 조건 비교에 들어가지 않는다.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: hybrid
      tool_runner: docker
      state_store: memory
    budget: dev_fake

  dev_docker:
    description: "GPU 없이 실제 도구를 Docker 컨테이너에서 실행. 전 역할 Fake 모델."
    # 모델은 Fake지만 도구는 진짜다. 2·8단계가 실제 semgrep·clang을 돌리므로
    # `RunRecord.tool_images`가 채워지고, 그래야 이 run이 비교표에 들어갈 수 있다.
    # 이미지 준비 절차는 tools/README.md.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: docker
      state_store: sqlite
    budget: dev_fake

  dev_singularity:
    description: "Docker 데몬 접근이 없는 환경(Seraph 등). 도구는 Singularity로 실행."
    # moana-u3에서 /usr/bin/docker는 permission denied이고 singularity 3.7.3만 돈다
    # (2026-08-13 실측). dev_docker와 다른 점은 런타임 하나뿐이고, cpu_limit·memory_mb는
    # 이 런타임이 강제하지 못한다(SLURM 소관, container_tools.UNENFORCED).
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: singularity
      state_store: sqlite
    budget: dev_fake

  single_gpu_12g:
    # 12GB 카드 1장 기준 실서빙은 scout 하나만 올린다.
    #
    #   Qwen3-4B(FP8)        약 8.0GB
    #   Qwen3-Embedding-0.6B 약 1.2GB
    #   Qwen3-Reranker-0.6B  약 1.2GB
    #   합계                 약 10.4GB  (12GB 중)
    #
    # 산술적으로는 1.6GB가 남지만 셋을 한 장에 올리면 안 된다. vLLM은 기동 시
    # gpu_memory_utilization 비율만큼 메모리를 선점하고 가중치를 뺀 나머지 대부분을
    # KV cache로 잡는다. 세 프로세스가 같은 카드를 나눠 쓰면 scout에 남는 여유가
    # 1.6GB 미만이 되어 KV cache가 사실상 0이 되고, 동시 요청 1건도 처리하지 못한다.
    # 따라서 embedding·reranker를 포함한 나머지 전 역할을 Fake로 둔다.
    #
    # **메모리만으로는 부족하다 — 세대 조건이 따로 있다.** scout의 qwen3-4b는 `fp8`이고
    # FP8 텐서코어는 Ada(sm_89) 이상이다. 12GB 카드라도 Ampere(A2000, sm_86)에서는 기동
    # 자체가 안 된다. 이 프로필이 특히 위험한 이유는 이름이 정확히 "12GB 카드용"이라 그
    # 카드를 가진 사람이 고를 프로필인데, 메모리 계산은 맞고 세대 때문에 죽기 때문이다 —
    # 조건을 다 만족했는데 죽으므로 원인 찾기가 비싸다 (docs/portability.md §5 #2).
    description: "12GB 이상 + Ada(sm_89) 이상 단일 GPU. scout만 실서빙하고 나머지는 Fake."
    production: false
    roles:
      scout: qwen3-4b
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: fake
      state_store: sqlite
    budget: default

  local_balanced:
    description: "AI TOP ATOM(GB10) 전 역할 실서빙. B3' 조건의 기본 구성."
    # model-serving.md §3 체크리스트를 실측하고 models.yaml의 benchmark를 채우기 전까지
    # production: true 로 올리지 않는다.
    production: false
    roles:
      scout: qwen3-8b
      auditor: qwen3-coder-30b-a3b
      critic: devstral-small-2-24b
      embedding: qwen3-embedding-0.6b
      reranker: qwen3-reranker-0.6b
    adapters:
      # retriever는 fake로 둔다. hybrid로 올리면 embedding·reranker까지 실서빙이 되어
      # ATOM에 모델 5개를 동시에 띄워야 하고, R1(sm_121 커널 호환성) 검증의 실패 지점이
      # 그만큼 늘어난다. 검색 경로는 dev_hybrid가 GPU 없이 이미 태우고 있다.
      retriever: fake
      # 도구가 실제로 돌아야 `RunRecord.tool_images`가 채워지고, **그래야 이 run이
      # 비교표에 들어간다**(STATUS.md §8). fake로 두면 완주시켜도 비교 대상이 아니라
      # 중간 발표 DoD "B1 조건 1회 완주"를 프로필 정의만으로는 만족시킬 수 없었다.
      #
      # **`docker`인 것은 주 실서빙 장비가 ATOM이기 때문이다** — 프로필은 주 실서빙
      # 장비의 런타임을 선언하고 다른 장비가 오버라이드한다(portability.md §3).
      # 그 기준은 그대로이고, **바뀐 것은 "ATOM의 런타임"이 무엇이냐다.**
      #
      # ⚠ **2026-08-28에 `podman` → `docker`로 되돌렸다.** 경위는
      # decisions/0005-tool-runner-override.md의 마지막 절. 2026-08-17에 `docker` →
      # `podman`으로 간 근거는 "ATOM에는 podman만 있다"였고 그 전제가 2026-08-21에
      # 반증됐다(Docker 29.2.1 · podman 4.9.3 공존. 2026-08-28
      # `ssh atom 'which podman; which docker'`로 재확인 — 둘 다 /usr/bin에 있다).
      #
      # **되돌린 진짜 이유는 선언값이 실행 기록과 어긋나 있었다는 것이다.** `b1_single`로
      # 돈 run 둘(`run_20260827_0001`·`0004`)이 **둘 다 `tool_runner: docker`**다 — 즉
      # `--tool-runner docker` 오버라이드를 달고 돌았다. 그것은 evaluation.md §2.3 규칙 2가
      # 조건 비교용 프로필에 금지한 예외이고, ADR 0005가 podman을 고른 근거("주 경로가
      # 상시 예외 상태면 그 기록이 '이 run은 특별했다'를 뜻하지 못한다")가 **이제 정확히
      # 반대를 가리킨다.**
      #
      # **"이미 podman으로 돈 run과 digest가 갈린다"던 유지 사유는 사실이 아니었다.**
      # artifacts의 run 14건을 전수 조회한 결과 podman으로 도구를 돌린 run은
      # `run_20260817_0001` 하나이고, 그것은 `model_checksums`가 전부 0인 dev 프로필이다
      # (`dev_docker --tool-runner podman`). **이 프로필과 `b1_single`로 podman을 써서 돈
      # run은 0건이라 갈릴 기록이 없다.**
      #
      # 반대 방향의 대가는 없다. 이 프로필의 모델 5개 중 3개가 Blackwell 이상을 요구하므로
      # (`fp4` ×1, `nvfp4` ×2) Seraph(sm_86)에서는 **애초에 기동하지 못한다**
      # (portability.md §5 #1). 그래서 그 장비에서 `--tool-runner singularity`가 상시
      # 필요해지는 상황이 생기지 않는다.
      tool_runner: docker
      state_store: sqlite
    budget: default

  b1_single:
    description: "벤치마크 조건 B1 — 전 역할을 같은 단일 모델로 실행."
    # evaluation.md §2.3 공정성 규칙 1: 조건 간 차이는 프로필과 단계 활성화만.
    # 예산·임계값·프롬프트 버전은 budgets.yaml에서 공통으로 온다.
    production: false
    roles:
      scout: qwen3-coder-30b-a3b
      auditor: qwen3-coder-30b-a3b
      critic: qwen3-coder-30b-a3b
      embedding: qwen3-embedding-0.6b
      reranker: qwen3-reranker-0.6b
    adapters:
      # local_balanced와 같은 이유로 fake다. B1과 B3'의 차이가 "모델 구성"이어야 하므로
      # 검색 경로도 두 조건에서 같아야 한다(evaluation.md §2.3 규칙 2).
      retriever: fake
      # local_balanced와 같은 이유로 컨테이너 런타임이다 — `RunRecord.tool_images`가 비면
      # 이 run은 비교표에서 제외되고(STATUS.md §8), 그러면 B1 조건을 완주시켜도 B3'와
      # 대조할 수 없다. 두 조건이 같은 tool_runner를 써야 도구 차이가 결과 차이로 섞이지
      # 않는다. 런타임이 `docker`인 근거도 local_balanced와 같다(주 실서빙 장비 = ATOM,
      # portability.md §3). 세 역할이 전부 `nvfp4`라 Seraph에서 못 도는 것도 같다.
      #
      # **이 프로필이 되돌림의 직접 근거다.** 선언은 `podman`이었는데 이 프로필로 돈 run
      # 둘(`run_20260827_0001`·`0004`)이 `RunRecord.tool_runner: docker`다 — 주 경로가
      # 상시 오버라이드 상태였다. 자세한 것은 local_balanced 주석과 ADR 0005 마지막 절.
      tool_runner: docker
      state_store: sqlite
    budget: default

  # === 팀 2x2 실험 (B1' ×3 · B3') =========================================
  #
  # 이름은 팀 `experiments/2x2/config/run_matrix.yaml`의 값과 **글자까지 같아야 한다** —
  # 팀 스크립트가 `python -m src.cli run --profile <이 이름>`으로 부른다. 바꾸면 실험이
  # 프로필을 못 찾는다.
  #
  #   b1prime_profiles:
  #     qwen3-8b:          b1_single_qwen3_8b
  #     foundation-sec-8b: b1_single_foundation_sec
  #     granite-3.3-8b:    b1_single_granite
  #   b3prime_profile:     b3prime_balanced
  #
  # **넷의 어댑터 선택이 같아야 한다.** 조건 간 차이는 `roles`뿐이어야 하고, 그것이
  # evaluation.md §2.3 규칙 1이다. 그래서 아래 넷은 adapters·budget·production이 동일하다.
  #
  # `tool_runner: docker` — **ATOM에 docker가 있다**(2026-08-21 실측: Docker 29.2.1이
  # podman 4.9.3과 공존). portability.md §6이 오래 "Docker 데몬 접근 없음"으로 적고 있었는데
  # 그건 2026-08-17 관측이고 4일 뒤 뒤집혔다 — 이 PR이 그 서술도 함께 고친다.
  #
  # **근거는 말이 아니라 run이다.** `--device atom --tool-runner docker`로 도구가 실제로
  # 돌아 `tool_images`가 채워진 run이 docs/experiments/README.md §#6에 셋 적혀 있고
  # (`run_20260821_0004` 9건 · `run_20260823_0002` 238건 · `run_20260825_0001` 238건),
  # 8/26·8/27 재측정도 같은 플래그였다(`run_20260827_0004` 완주, `tool_call` 13건).
  # **반대로 podman으로 도구를 돌린 run은 `run_20260817_0001` 하나뿐이다** — 즉 "검증된
  # 경로는 podman"이 지금은 거꾸로다.
  #
  # 팀 `lib/prime_runner.py`가 `--tool-runner` 오버라이드를 쓰지 않으므로 여기 적힌 값이
  # 그대로 쓰인다. podman으로 두면 그 스크립트가 덮어 줄 수단이 없다.
  #
  # ✅ **B3'-large와 런타임이 같아졌다(2026-08-28).** 전에는 `local_balanced`가 `podman`이라
  # 이 넷과 갈렸고, `tool_images` digest는 런타임 사이에서 비교할 수 없으므로
  # (portability.md §5 #4) 네 조건을 같은 비교표에 못 올렸다. `local_balanced`·`b1_single`을
  # `docker`로 되돌리면서 그 벽이 사라졌다 — **조건 비교용 실서빙 프로필 여섯이 전부
  # `docker`다.** 팀 run_matrix의 `b3prime_large_profile`은 아직 `TODO_local_large`라
  # 프로필 이름만 정하면 된다.
  #
  # `retriever: fake` — hybrid로 두면 embedding·reranker까지 실서빙해야 하고 ATOM에 모델을
  # 다섯 개 띄워야 한다. B1'와 B3'의 차이가 "모델 구성"이어야 하므로 검색 경로도 네 조건에서
  # 같아야 한다(§2.3 규칙 2). 검색 경로 자체는 dev_hybrid_docker가 GPU 없이 태운다.
  #
  # `embedding`·`reranker`가 `fake`인 것은 `retriever: fake`라 호출되지 않기 때문이다.
  # 실제로 안 띄우는 모델을 선언하면 `doctor`가 그 포트를 요구하는 것처럼 출력한다
  # (single_gpu_12g가 같은 이유로 같은 선택을 한다).

  b1_single_qwen3_8b:
    description: "B1' — 세 역할 전부 Qwen3-8B(bf16). 팀 2x2 실험."
    production: false
    roles:
      scout: qwen3-8b-bf16
      auditor: qwen3-8b-bf16
      critic: qwen3-8b-bf16
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: docker
      state_store: sqlite
    budget: default

  b1_single_foundation_sec:
    description: "B1' — 세 역할 전부 Foundation-Sec-8B(bf16). 팀 2x2 실험."
    production: false
    roles:
      scout: foundation-sec-8b
      auditor: foundation-sec-8b
      critic: foundation-sec-8b
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: docker
      state_store: sqlite
    budget: default

  b1_single_granite:
    description: "B1' — 세 역할 전부 Granite-3.3-8B(bf16). 팀 2x2 실험."
    production: false
    roles:
      scout: granite-3.3-8b
      auditor: granite-3.3-8b
      critic: granite-3.3-8b
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: docker
      state_store: sqlite
    budget: default

  b3prime_balanced:
    description: "B3' — 역할마다 다른 8B 모델. 팀 2x2 실험의 대조 조건."
    # 세 모델이 서로 다른 계열이라야 교차 검증에 값이 있다(model-serving.md §2). critic이
    # auditor와 다른 계열인 것이 특히 그렇다 — 같은 계열이면 반박이 재진술이 되기 쉽다.
    #
    # ⚠ **셋을 동시에 띄워야 하는 유일한 프로필이다.** 8006·8003·8001 세 포트가 함께 살아
    # 있어야 한다. B1' 셋은 한 번에 하나만 띄우면 되므로 granite(8003)와 devstral(8003),
