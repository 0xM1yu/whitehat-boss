# 실행 프로필 (model-serving.md §5, engineering-guide.md §2)
#
# ⚠ **이 파일의 `roles:`는 프로필마다 §1과의 관계가 다르다.** 어느 모델이 어느 자리에 앉는지의
# 정본은 저장소 루트 `PROJECT-CONTEXT.md` §1이다. **실모델을 쓰는 프로필은 canonical `harness_pool`(과
# `_hybrid`) 둘이고 §1 로스터와 일치한다**(2026-09-24 `local_balanced_pool`에서 이름을 바꿨다). 나머지
# `dev_*` 다섯은 전 역할이 fake다. 옛 로스터 프로필 넷(`single_gpu_12g`·`local_balanced`·`_hybrid`·`b1_single`)은
# 2026-09-24 로스터 밖 정리로 지웠다 — 로스터를 바꿀 때 고칠 자리는 `PROJECT-CONTEXT.md` §3이 든다.
#
# 프로필 교체만으로 B1/B1'/B3/B3' 조건과 실행 환경을 구성할 수 있어야 한다.
# `roles`의 값은 models.yaml의 model key다. **필수는 auditor·critic 둘**이다(REQUIRED_ROLES).
# 4단계 Scout 자리는 **단일 `scout` 하나 아니면 풀 셋 전부**다 — `scout_memory`·`scout_boundary`·
# `scout_injection`을 다 적든지 하나도 안 적든지 둘 중 하나이고, 단일과 풀을 함께 선언하거나
# 풀을 반만 적으면 로드가 실패한다(ADR 0010 §3, ProfileEntry._declares_one_scout_arrangement).
# auditor와 critic이 **다른 모델 키면** models.yaml의 `family`가 달라야 한다 — 같은 키(B1)는
# 정의상 허용하고, `family`가 비어 있으면 통과가 아니라 실패다(_check_family_split).
# `adapters`는 모델 외 3개 인터페이스의 구현 선택이다. ModelClient는 여기서 고르지 않는다 —
# models.yaml의 endpoint 스킴이 역할별로 결정하므로 한 프로필에서 실서빙과 Fake가 섞일 수 있다.

profiles:
  dev_fake:
    description: "GPU 없이 파이프라인 0~9단계를 완주시키는 개발 프로필. 전 역할 Fake."
    # 팀원 대부분이 GPU 접근이 없다. 이 프로필로 전체 경로가 돌지 않으면 병렬 작업이 막힌다.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      pov: fake_v2
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: fake
      state_store: memory
    budget: dev_fake

  dev_hybrid:
    description: "GPU 없이 hybrid Retriever 경로를 태우는 개발 프로필. 전 역할 Fake."
    # dev_fake와 다른 점은 `retriever: hybrid` 하나다. embedding·reranker도 Fake이므로
    # GPU가 없어도 광역 수집 → embedding → reranker 재선별 경로가 실제로 실행된다.
    # 실서빙과의 차이는 두 클라이언트 구현뿐이고, 그 선택은 endpoint 스킴이 한다.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      pov: fake_v2
      embedding: fake
      reranker: fake
    adapters:
      retriever: hybrid
      tool_runner: fake
      state_store: memory
    budget: dev_fake

  dev_hybrid_docker:
    description: "hybrid Retriever가 실제 index.json을 읽는 유일한 GPU 불필요 프로필. 전 역할 Fake 모델."
    # `dev_hybrid`와 다른 점은 `tool_runner` 하나다.
    #
    # **이 조합이 없으면 HybridRetriever의 그래프 섹션 경로가 GPU 없이는 어느 프로필에서도
    # 돌지 않는다.** 이 프로필을 만들 당시(2026-08-20, 이슈 #63) index.json을 내는 프로필은 전부
    # `retriever: fake`였고(dev_docker·dev_singularity·local_balanced·b1_single),
    # `dev_hybrid`는 `tool_runner: fake`라 index.json이 만들어지지 않았다 — hybrid의
    # `callers`/`callees` 분기가 죽은 코드가 된다.
    #
    # **2026-09-04에 `local_balanced_hybrid`가 같은 짝을 이뤘지만 이 프로필을 대신하지
    # 않는다.** 그쪽은 모델 다섯을 실서빙하므로 GPU 없이는 못 돈다(그 프로필은 2026-09-24에 지웠고,
    # 지금 실서빙 hybrid 짝은 `harness_pool_hybrid`다 — 역시 GPU 없이는 못 돈다). GPU도 Docker도 없는
    # 팀원의 경로(portability.md §2)에서 이 분기를 태우는 것은 여전히 여기뿐이다.
    #
    # 이 저장소는 "픽스처가 실전을 대표하지 못해 생긴 결함"을 이미 두 번 겪었다:
    # clang의 include 경로(#63)와 tree-sitter 최상위 한 겹(zlib 28.3%/json 70.3%).
    # 둘 다 테스트는 초록이었다. 프로필이 없으면 같은 자리가 또 생긴다.
    #
    # 모델이 전부 Fake라 GPU가 필요 없고 `production: false`라 조건 비교에 들어가지 않는다.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      pov: fake_v2
      embedding: fake
      reranker: fake
    adapters:
      retriever: hybrid
      tool_runner: docker
      state_store: memory
    budget: dev_container

  dev_docker:
    description: "GPU 없이 실제 도구를 Docker 컨테이너에서 실행. 전 역할 Fake 모델."
    # 모델은 Fake지만 도구는 진짜다. 2·8단계가 실제 semgrep·clang을 돌리므로
    # `RunRecord.tool_images`가 채워지고, 그래야 이 run이 비교표에 들어갈 수 있다.
    # 이미지 준비 절차는 tools/README.md.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      pov: fake_v2
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: docker
      state_store: sqlite
    budget: dev_container

  dev_singularity:
    description: "Docker 데몬 접근이 없는 환경(Seraph 등). 도구는 Singularity로 실행."
    # moana-u3에서 /usr/bin/docker는 permission denied이고 singularity 3.7.3만 돈다
    # (2026-08-13 실측). dev_docker와 다른 점은 런타임 하나뿐이고, cpu_limit·memory_mb는
    # 이 런타임이 강제하지 못한다(SLURM 소관, container_tools.UNENFORCED).
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      pov: fake_v2
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: singularity
      state_store: sqlite
    budget: dev_container

  # --- 로스터 canonical 배선(PROJECT-CONTEXT.md §1 정본) — Scout qwen3-14b + Auditor qwen3.8-27b + Critic gpt-oss + 리랭커 4b, 단계 단위 실행 ----
  harness_pool:
    # **§1 정본의 로스터를 배선한 canonical 프로필이다. checksum·처리량 검증 전.**
    # 2026-09-24 `local_balanced_pool`에서 이름을 바꿨다(조민규 — 로스터 확정에 따라 프로필 배선).
    # 그 이름으로 적힌 날짜 붙은 서술(PR #190·#240 등)은 이 프로필의 옛 이름을 가리킨다.
    #
    # - **Scout 풀** — scout_{memory,boundary,injection}이 각자 CWE 계열을 본다(ADR 0010 §3).
    #   ⏵ 2026-10-14 — **셋 다 `qwen3-14b` 한 키다**(실험팀 프롬프트 개선 작업에서 정한 교체 —
    #   PROJECT-CONTEXT.md §1). 프롬프트가 역할 폴더로 갈린다(`scout_{memory,boundary,injection}/v4`).
    #   ⚠ 그래서 **세 역할 축이 재는 것은 전부 프롬프트 차이이고 모델 차이가 아니다**(§1 · ADR 0010 §3).
    #   injection은 2026-09-23 팀 피드백(모델 크기를 내리자)으로 `deepseek-r1-distill-qwen-32b`에서,
    #   memory는 2026-09-25 실험팀 최종 권고로, boundary는 2026-10-14에 `seccoderx-8b`에서 옮겼다.
    # - **Critic = §1의 `gpt-oss-20b`**(reasoning_effort: high). 프롬프트는 v7이다(2026-10-14 — #497이 2026-10-05에 v6으로 배선했고
    #   S20 Phase 11이 올렸다. v7은 SOURCE로 직접 검증하는 5-check 절차이고 입력은 v6과 같다).
    #   근거 본문·위치·캐시 SOURCE를 받는다. v3는 디스크 전용이며 확인 run 선행은 유지하지 않는다.
    # - **Auditor = §1의 `qwen3.8-27b`**(2026-09-26 `qwen3.6-35b-a3b`에서 바꿨다). ⏵ 2026-09-29 —
    #   registry가 근거 본문 배선과 함께 `v3`를 골랐다(auditor/v3는 2026-09-22 #237로 디스크에 있었고,
    #   올린 것은 `nodes/auditor.py`의 `_CONTENT_AWARE_VERSIONS` 배선과 같은 PR이다). 같은 날 #328 머지 뒤
    #   `v4`로 다시 올렸다(v4도 그 집합에 든다). ⏵ **2026-10-03 — v6로 올렸다**(프롬프트 #418 ·
    #   배선 #421 · 사용자 결정 — **v5는 건너뛰었다**). v6도 그 집합에 든다. ⏵ 2026-10-04 — v7로 올렸다
    #   (v6 + Auditor SOURCE 옵션 넷의 서술, #349 — v7도 그 집합에 든다). ⏵ 같은 날 — **v8로
    #   올렸다**(도구 루프 · #419 — v8도 그 집합에 든다. `thresholds.auditor_tool_hops`가
    #   양수여야 돈다). ⏵ 2026-10-06 — v9로 올렸다(v8 + `auditor_guards` 서술 — v9도 그 집합에 든다).
    #   ⏵ 2026-10-07 — **v10으로 올렸다**(v7 전면 재작성 · 매 홉 봉투가 `AuditorProcedureAction`이고
    #   최종 답이 `AuditProcedure` — v10도 그 집합에 든다. v10으로 돈 run은 0건이다 — ⏵ 2026-10-08 1건이 됐다, `checksum` 0이라 비교표 밖).
    #   ⏵ 2026-10-09 — **v11로 올렸다**(`config/models.yaml`의 `qwen3.8-27b` · 이슈 #525). ⏵ 2026-10-10 —
    #   **v13으로 올렸다**(이슈 #67 — v11 + FACTS에서 `source` 사본을 뺀다). ⏵ 2026-10-11 —
    #   **v14로 올렸다**(v12 + FACTS `source` 제거 — v12 봉투, 이슈 #67 · #578). ⏵ 2026-10-13 —
    #   **v15로 올렸다**(v14 + 계약 문장 여섯 · 봉투는 v12의 서브클래스 `AuditorProcedureProbeInputAction` ·
    #   `facts_source: false`는 그대로다 — S19). critic gpt-oss와
    #   계열이 갈린다(qwen × gpt-oss, `_check_family_split`). **사고를 켠다**(`reasoning_effort: xhigh`) —
    #   기동 조건(`--reasoning-parser qwen3`가 없으면 사고가 죽는다)과 예산은 `config/models.yaml`의 그
    #   항목이 든다.
    # - **PoV = §1의 `feyospace-v1-small`**(8단계 · Qwen3.8-27B 사이버 post-train, Auditor와 같은 계열).
    #   pov 노드가 8단계에 들어온(진입 시 `VALIDATED`인) Finding에서 PoC를 만든다 — `validate.run`이 `QUEUED`로
    #   내린 것도 포함한다(추가형 — 그 목록은 `validate.run` 전에 잡히고 러너가 그 뒤에 부른다). `pov_attempt_top_n`이
    #   양수면 그 밖의 Finding도 상위 몇 건 더한다(저장소 설정 8 — `config/budgets.yaml`). 사고를 켠다 —
    #   Auditor의 손잡이 넷(`reasoning_effort` `xhigh` · `sampling` · `thinking_token_budget` ·
    #   `request_timeout_s`)을 물려받아 선언하고 출력 상한은 `output_max_by_role.pov`(`config/budgets.yaml`)다
    #   (계획값 · feyospace 미실측 — `config/models.yaml`). `--reasoning-parser qwen3` 필요 ·
    #   checksum·benchmark 미실측이라 이 run은 비교표 제외.
    # - **리랭커 = §1의 `qwen3-reranker-4b`** — 근거·범위는 `harness_pool_hybrid`의 주석이 든다.
    #   **`retriever: fake`인 이 프로필은 그것을 부르지 않지만** 쌍의 roles가 같아야 해서 같이 적는다.
    #
    # ## 실행 — 단계 단위(`execution.mode: per_stage` — ADR 0009, ADR 0010 §1이 승인)
    #
    # 모든 target이 한 단계를 마친 뒤에 다음 단계가 시작한다(`runner._triage_by_stage`). 그래야 단계마다
    # 그 단계의 모델만 떠 있으면 된다 — 다섯 서버를 한 장비에 다 올리면 util 합이 2.60으로 1을 넘는다
    # (0.30 + 0.40 + 0.80 + 0.30 + 0.80(pov) — `config/serving/atom.yaml`의 util, 계획값). 2026-09-24 판은 1.44였다
    # (Scout 0.20·0.30 · 옛 Auditor `qwen3.6-35b-a3b` 0.64 · Critic 0.30 — 그날 ATOM에서 뜬 util).
    # ⏵ 2026-10-08 — 위 두 합은 ATOM 값이다(ATOM 사용 종료 2026-09-29, #340 · docs/portability.md §6). 지금 vast 장비
    #   파일 `config/serving/vastai-remote.yaml`로 세면 0.35 + 0.55 + 0.90 + 0.90 + 0.90(pov) = 3.60(계산값)이라
    #   「1을 넘는다」는 그대로 선다.
    #
    # ## 교대 — 단계 경계 콜드 재기동(`execution.swap`, 2026-09-29 — ADR 0009 「2026-09-29 제안」 절)
    #
    # 모델을 부르는 단계(4 Scout · 5 Auditor · 7 Critic · 8 PoV)에 들어갈 때 러너가 교대 명령을 불러 앞 단계 서버를
    # 끄고 그 단계 모델만 띄운다. run 끝에 전부 내린다. 명령과 기동 조건(util·창·인자)은 **장비 파일**
    # (`config/serving/<device>.yaml`)이 들고 `run --device`가 고른다 — 이 선언은 장비와 무관하다. 장비 파일
    # 없이 모델에 닿는 run은 run 디렉터리를 잡기 전에 거부된다. **실장비 종단은 미실측이다**(ATOM 먼저).
    # ⏵ 2026-09-29 — ATOM에서 한 번 돌았다(`docs/experiments/harness/2026-09-29-stage-swap-smoke-atom.md` — 교대 네 번
    #   전부 `ok=true`, 슬라이스 1개·n=1). vast는 미실측이다.
    # ⏵ 2026-10-08 — 같은 날 ATOM 사용이 끝났다(#340 · docs/portability.md §6) -> 「ATOM 먼저」는 지난 계획이다. vast 쪽은
    #   `vastai-remote`로 교대 종단이 처음 성립했다(WSL `run_20261003_0002`가 먼저 완주했으나 도구 4개 전부 실패,
    #   도구까지 돈 완주는 Windows `run_20261003_0003` — `docs/experiments/harness/2026-10-04-cybergym-operational-run-vastai-remote.md`
    #   §1 — 둘 다 Scout·Auditor만 모델을 불렀고 7·8단계는 안 불렀다). 8단계까지 모델을 부른 첫 완주는
    #   `run_20261007_0001`이다(`docs/experiments/harness/2026-10-08-first-real-serving-run-arvo1065-vastai-remote.md` §1·§3 —
    #   게이트가 Finding 5건을 전부 `E0`로 보내 7단계 Critic은 0회). `--device vastai`로 돈 run은 `docs/experiments/`에 없다.
    # hybrid 짝은 교대를 선언하지 않는다 — 검색 역할을 어느 단계에 띄울지가 ADR 0012 결정 3 뒤다.
    #
    # ⚠ `production: false`는 **안전장치가 아니다.** `served_models()`가 이 프로필에서 6역할
    #   (scout 셋+auditor+critic+pov)을 돌려주므로 러너는 이것을 **실서빙 프로필로 취급**하고
    #   `--device`·`--condition`을 요구한다(`runner.py`의 그 주석 — dev/실서빙을 가르는 것은
    #   `production`이 아니라 `served_models()`다, 2026-09-02 실측). ~~`--slices`도 요구한다~~ —
    #   ⏵ **2026-10-07: 더 이상 안 요구한다.** Scout 셋이 v4(meta `input: source`)로 배선되며
    #   `cli._slice_input_prompts`가 빈 목록을 돌려준다(PR #524). 그 전에는 v3가 슬라이스 입력이라
    #   실서빙 여부와 무관하게 요구했다(ADR 0012 결정 1). ~~⚠ 지금은 `--slices`를 **주는** 쪽이
    #   어긋난다 — 노드가 슬라이스 렌더를 싣는데 v4 산문은 함수 본문이라 적는다(이슈 #529).~~
    #   ⏵ 2026-10-13: 노드가 `SOURCE`의 모양을 meta `input`으로 골라 `--slices` run에서도 v4는 함수
    #   본문을 받는다(#529).
    #   `production: false`가 실제로
    #   하는 일은 `cli._check_benchmarks`의 미측정 ERROR를 WARN으로 내리는 것뿐이다. 서빙 세 키
    #   (`qwen3-14b`·`qwen3.8-27b`·`feyospace-v1-small`)의 `checksum`이 0이라 이 프로필로
    #   돈 run은 비교표에서 제외된다(CLAUDE.md §0).
    description: "로스터 canonical 배선(§1 정본: Scout 풀 qwen3-14b + Auditor qwen3.8-27b + Critic gpt-oss + PoV feyospace + 리랭커 4b), 단계 단위 실행 — checksum·처리량 검증 전"
    production: false
    roles:
      scout_memory: qwen3-14b
      scout_boundary: qwen3-14b
      scout_injection: qwen3-14b
      auditor: qwen3.8-27b
      critic: gpt-oss-20b
      pov: feyospace-v1-small
      embedding: qwen3-embedding-0.6b
      reranker: qwen3-reranker-4b
    adapters:
      retriever: fake
      tool_runner: docker
      state_store: sqlite
    budget: default
    execution:
      mode: per_stage
      swap:
        # 상주 없음 — 단계마다 그 단계 모델만 떠 있어야 한 장비에 들어간다(위 util 합).
        resident: []
        swappable: [scout_memory, scout_boundary, scout_injection, auditor, critic, pov]
        # 교대 한 번(내림 + 기동 + 준비 확인)의 마감 — **계산값, 미실측.** 두 장비 파일 중 가장 무거운 교대인
        # ATOM Auditor 교대로 잡았다: 앞 단계 Scout 둘 내림 2 × 50 s + 시도 2 × (준비 상한 1,720 s + 시도당
        # 300 s) = 4,140 s → 4,200 s. 시도당 300 s = 메모리 대기 60 s + 마지막 폴링 둘 2 × 5 s + 마지막 채팅
        # 요청의 `curl -m` 상한 120 s(준비 상한을 넘겨서도 붙잡는다) + `/v1/models` 확인 60 s + 실패 기동 내림
        # 50 s(TERM 20 + KILL 30). 준비 상한의 근거는 `config/serving/atom.yaml`의 그 행이고, 나머지는
        # `tools/serve/swap.sh`의 상수와 `src/bench_metrics.py`의 `_TIMEOUT_S`다. `tests/test_serve_scripts.py`가
        # 두 장비 파일의 모든 교대에 대해 이 식을 잠근다.
        # ⏵ 2026-10-08 — 「두 장비 파일」은 낡았다: 지금 셋이다(`config/serving/` atom·vastai·vastai-remote —
        #   `tests/test_serve_scripts.py`의 `DEVICES`). ATOM 종료 때문이 아니라 `vastai-remote` 추가(#417) 때문이다.
        #   4,200 s의 근거는 ATOM Auditor 교대다(ATOM 사용 종료 2026-09-29, #340) — 이 값을 vast로 다시 계산하지 않았다.
        #   vast에서 잰 교대 벽시계는 최대 145.1 s다(`model_swap` `wall_ms`, WSL `run_20261003_0002` 5단계 —
        #   `docs/experiments/harness/2026-10-04-cybergym-operational-run-vastai-remote.md` §3, n=2 run). PoV 좌석은
        #   손으로 돌린 교대 명령에서 준비 319 s였다(`2026-10-06-pov-seat-probe-vastai.md` §0 — 가중치 캐시가 찬 상태).
        settle_timeout_s: 4200

  harness_pool_hybrid:
    # `harness_pool`에 **검색 경로를 켠 것** — embedding·reranker를 실제로 부르는
    # 풀 프로필. 지운 옛 짝 `local_balanced`↔`local_balanced_hybrid`와 같은 결이고, 유일한 차이가
    # `retriever` 하나여야 두 프로필의 run 차이를 검색 경로로 돌릴 수 있다(아래 테스트가 고정).
    # ⚠ 2026-09-29부터 차이가 하나 더 있다 — `harness_pool`만 교대를 선언한다(아래 `execution` 주석). 모델
    #   호출 순서는 같고 서버를 누가 띄우는지만 갈린다.
    # 2026-09-24 `local_balanced_pool_hybrid`에서 이름을 바꿨다. 검색 3단계를 어떻게 쓸지는 팀 논의가
    # 남아 있어(2026-09-26 대면) canonical은 `harness_pool`(fake retriever)이다.
    #
    # **왜 in-place로 안 바꾸고 새로 파나.** `harness_pool`(fake retriever)은 GPU 없이
    # 풀 팬아웃 제어흐름을 도는 자리이고, 이것은 3단계 검색(embedding→reranker)을 실제로 태우는
    # 자리다 — 축이 하나여야 어느 쪽 효과인지 갈린다. 옛 `local_balanced_hybrid`가 같은 이유로
    # `local_balanced`와 나뉘었다(둘 다 2026-09-24에 지웠다).
    #
    # ⚠ **전 역할이 `harness_pool`과 같은 §1 키다** — Scout `qwen3-14b`(⏵ 2026-10-14 — 셋 다 한 키 · v4),
    #   Auditor `qwen3.8-27b`(⏵ 2026-09-29 — 근거 본문 배선과 함께 v3, 같은 날 v4로 올렸다 ·
    #   ⏵ 2026-10-03 v6 — #418·#421 · 사고 켬 · ⏵ 2026-10-04 v7 — #349 SOURCE 서술 · 같은 날 v8 —
    #   #419 도구 루프 · ⏵ 2026-10-06 v9 — `auditor_guards` 서술 · ⏵ 2026-10-07 v10 — v7 전면 재작성),
    #   Critic gpt-oss.
    #   checksum·검증 전. **reranker는 2026-09-20에 §1 정본대로 `qwen3-reranker-4b`로
    #   올렸다** — 두 풀 프로필을 같은 diff에서 고친다(`tests/test_config.py`가 쌍의 roles 동일을
    #   기계로 고정하므로 한쪽만 고치면 red다).
    # ⚠ **올린 것이 검증된 것은 아니다.** #152(닫힘 2026-10-12 — canonical 경로 밖, 되살릴 때 새 이슈)의 배제셋 중 **둘이 열려 있고**(참조 구현 대조 ·
    #   리랭커를 끈 기준선), `benchmark`는 전부 `0`이다(미실측 표시 — CLAUDE.md §0).
    #   2026-09-13 ATOM 실측은 **우리 실경로 질의 모양**(맨 식별자 하나)에서 이 모델을 나쁘게 쟀다
    #   — 전체-8 렌즈에서 정답이 **7위**, 무관이 1위. ⚠ **그 실측의 수를 완화로 쓰지 마라.**
    #   배선 렌즈인 top-5에서 2/3으로 덜 나쁘게 보이지만 그 칸에 단서가 둘 붙는다 —
    #   ① 형제 PR #189가 **문서 압축만 바꿔 그 칸을 포함해 두 칸을 뒤집었다.** ⚠ **방향이 갈린다** —
    #   그 칸은 2/3→**3/3**(4b에 유리)이고 자연어 질의는 PASS→**FAIL**이다. 그래서 자매 보고서
    #   (템플릿 쪽)가 *"32건·실조각 실측 전까지 어느 숫자도 확정이 아니다"*로 닫는다.
    #   ② 여기 top-5는 **8건에서 5**(62.5%)인데 실경로는 **32건에서 5**(15.6%)라, 입력 모양 보고서가
    #   그 문장을 *"32건 실측 전까지 상한"*으로 못박는다. 관측은 #152(닫힘 — 위)에 있고 남은 레버를 이어받는 열린 이슈는 없다.
    #   **0.6b로 되돌리는 것이 답은 아니다** — 만든 쪽 표(검색 조사 §1)에서 MTEB-Code는 리랭킹 없음
    #   **75.41** 대비 0.6B **73.42** · 4B **81.20** `[출처주장]`이고 그 차 **−1.99**·**+5.79**는 `[계산]`이다.
    #   그것이 §1 로스터가 4b를 앉힌 근거다.
    #   ⚠ 그 표는 **우리 입력 모양이 아니고**, 0.6B의 관측을 4B에 이식하는 것은
    #   `docs/decisions/0010-harness-structure-and-model-roster.md` 후속 1이 금지한다(#152는 그
    #   추적 미러다 — 금지의 출처가 아니다).
    #   ⚠ **둘을 「미검증」으로 묶지 마라 — 상태가 다르다.** 4b는 우리 모양에서 **재서 나빴고**(위),
    #   0.6b는 우리 모양에서 **재지 않았다.** 이 배선은 「미검증 둘 중 정본」이 아니라
    #   **불리한 우리-모양 실측을 외부 표와 정본으로 넘은 판단**이다. 근거·범위는 #152가 들었다(닫힘 2026-10-12).
    #   `#189`가 넣은 Qwen3 instruction 양식은 두 모델 다에 실린다 — 옛 `local_balanced_hybrid`와
    #   **같은 `VllmRerankerClient`**라 새 코드 경로가 아니라 풀 프로필에 그 경로가 붙는 것이다.
    # ⚠ **예산은 이 배선에 맞춰 안 잡혔다** — `hybrid_retriever.py` 모듈 docstring이 적은
    #   「related 본문이 산문·사실 블록 양쪽에 실려 선언 N토큰이 실제 ~2N」(#67 계약)이 이
    #   프로필에도 성립한다. `budget: default`는 축을 하나로 유지하려는 선택이지 그 예산이
    #   맞다는 판정이 아니다 — 재는 것이 선행이다(옛 `local_balanced_hybrid`와 같은 상태였다).
    #   (⏵ 2026-10-12 #67 닫힘 — Auditor `source` 사본만 걷었다, `related` 2N은 그대로)
    # ⚠ **`production: false` — `harness_pool`과 같다.** 그 주석대로 안전장치가 아니라
    #   `served_models()`가 실서빙으로 취급하므로 손으로 안 돌린다.
    description: "harness_pool에 검색 경로를 켠 것 — 풀에서 embedding·reranker를 실제로 부르는 첫 프로필 (플러밍, 검증 전)"
    production: false
    # `harness_pool`과 **같아야 한다.** 차이가 retriever 하나여야 검색 경로 효과가
    # 갈린다. tests/test_config.py가 roles·budget·나머지 어댑터까지 기계로 고정한다.
    roles:
      scout_memory: qwen3-14b
      scout_boundary: qwen3-14b
      scout_injection: qwen3-14b
      auditor: qwen3.8-27b
      critic: gpt-oss-20b
      pov: feyospace-v1-small
      embedding: qwen3-embedding-0.6b
      reranker: qwen3-reranker-4b
    adapters:
      # 이 한 줄이 harness_pool과 다른 어댑터 전부다(교대 선언 유무는 아래 `execution`).
      retriever: hybrid
      tool_runner: docker
      state_store: sqlite
    budget: default
    # 실행 단위도 `harness_pool`과 같아야 한다 — 다르면 두 run의 차이가 검색 경로 하나로 안 갈린다.
    # ⚠ 교대(`swap`)는 선언하지 않는다(2026-09-29) — 검색 역할을 어느 단계에 띄울지가 ADR 0012 결정 3 뒤라
    #   선언할 수 없다: 목록에 넣으면 `SwapPolicy`가, 빼면 `load_config`가 거부한다
    #   (`_check_swap_lists_every_served_role`). 그래서 이 프로필은 서버를 사람이 띄운다 —
    #   `harness_pool`과 갈리는 둘째 자리다.
    execution:
      mode: per_stage
