# 실행 프로필 (model-serving.md §5, engineering-guide.md §2)
#
# ⚠ **이 파일의 `roles:`는 프로필마다 §1과의 관계가 다르다.** 어느 모델이 어느 자리에 앉는지의
# 정본은 저장소 루트 `PROJECT-CONTEXT.md` §1이다. **canonical `harness_pool`(과 `_hybrid`)이 §1 로스터와
# 일치**하고(2026-09-24 `local_balanced_pool`에서 이름을 바꿨다), **실서빙 `local_balanced`·`b1_single` 등은 아직
# 옛 로스터**다 — 여기 적힌 `critic: devstral-small-2-24b` 같은 값을 "지금 쓰는 로스터"로 읽지 마라.
# `PROJECT-CONTEXT.md` §5의 마지막 줄이 자리별 상태를 든다.
#
# 프로필 교체만으로 B1/B1'/B3/B3' 조건과 실행 환경을 구성할 수 있어야 한다.
# `roles`의 값은 models.yaml의 model key다. **필수는 auditor·critic 둘**이다(REQUIRED_ROLES).
# 4단계 Scout 자리는 **단일 `scout` 하나 아니면 풀 셋 전부**다 — `scout_memory`·`scout_boundary`·
# `scout_injection`을 다 적든지 하나도 안 적든지 둘 중 하나이고, 단일과 풀을 함께 선언하거나
# 풀을 반만 적으면 로드가 실패한다(ADR 0010 §3, ProfileEntry._declares_one_scout_arrangement).
# auditor와 critic이 **다른 모델 키면** models.yaml의 `family`가 달라야 한다 — 같은 키(B1)는
# 정의상 허용하고, `family`가 비어 있으면 통과가 아니라 실패다(_check_family_split).
# `adapters`는 모델 외 3개 인터페이스의 구현 선택이다. ModelClient는 여기서 고르지 않는다 —
# models.yaml의 endpoint 스킴이 역할별로 결정하므로 한 프로필에서 실서빙과 Fake가 섞일 수 있다.

profiles:
  dev_fake:
    description: "GPU 없이 파이프라인 0~9단계를 완주시키는 개발 프로필. 전 역할 Fake."
    # 팀원 대부분이 GPU 접근이 없다. 이 프로필로 전체 경로가 돌지 않으면 병렬 작업이 막힌다.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: fake
      state_store: memory
    budget: dev_fake

  dev_hybrid:
    description: "GPU 없이 hybrid Retriever 경로를 태우는 개발 프로필. 전 역할 Fake."
    # dev_fake와 다른 점은 `retriever: hybrid` 하나다. embedding·reranker도 Fake이므로
    # GPU가 없어도 광역 수집 → embedding → reranker 재선별 경로가 실제로 실행된다.
    # 실서빙과의 차이는 두 클라이언트 구현뿐이고, 그 선택은 endpoint 스킴이 한다.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: hybrid
      tool_runner: fake
      state_store: memory
    budget: dev_fake

  dev_hybrid_docker:
    description: "hybrid Retriever가 실제 index.json을 읽는 유일한 GPU 불필요 프로필. 전 역할 Fake 모델."
    # `dev_hybrid`와 다른 점은 `tool_runner` 하나다.
    #
    # **이 조합이 없으면 HybridRetriever의 그래프 섹션 경로가 GPU 없이는 어느 프로필에서도
    # 돌지 않는다.** 이 프로필을 만들 당시(2026-08-20, 이슈 #63) index.json을 내는 프로필은 전부
    # `retriever: fake`였고(dev_docker·dev_singularity·local_balanced·b1_single),
    # `dev_hybrid`는 `tool_runner: fake`라 index.json이 만들어지지 않았다 — hybrid의
    # `callers`/`callees` 분기가 죽은 코드가 된다.
    #
    # **2026-09-04에 `local_balanced_hybrid`가 같은 짝을 이뤘지만 이 프로필을 대신하지
    # 않는다.** 그쪽은 모델 다섯을 실서빙하므로 GPU 없이는 못 돈다. GPU도 Docker도 없는
    # 팀원의 경로(portability.md §2)에서 이 분기를 태우는 것은 여전히 여기뿐이다.
    #
    # 이 저장소는 "픽스처가 실전을 대표하지 못해 생긴 결함"을 이미 두 번 겪었다:
    # clang의 include 경로(#63)와 tree-sitter 최상위 한 겹(zlib 28.3%/json 70.3%).
    # 둘 다 테스트는 초록이었다. 프로필이 없으면 같은 자리가 또 생긴다.
    #
    # 모델이 전부 Fake라 GPU가 필요 없고 `production: false`라 조건 비교에 들어가지 않는다.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: hybrid
      tool_runner: docker
      state_store: memory
    budget: dev_fake

  dev_docker:
    description: "GPU 없이 실제 도구를 Docker 컨테이너에서 실행. 전 역할 Fake 모델."
    # 모델은 Fake지만 도구는 진짜다. 2·8단계가 실제 semgrep·clang을 돌리므로
    # `RunRecord.tool_images`가 채워지고, 그래야 이 run이 비교표에 들어갈 수 있다.
    # 이미지 준비 절차는 tools/README.md.
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: docker
      state_store: sqlite
    budget: dev_fake

  dev_singularity:
    description: "Docker 데몬 접근이 없는 환경(Slurm 등). 도구는 Singularity로 실행."
    # <node>에서 /usr/bin/docker는 permission denied이고 singularity 3.7.3만 돈다
    # (2026-08-13 실측). dev_docker와 다른 점은 런타임 하나뿐이고, cpu_limit·memory_mb는
    # 이 런타임이 강제하지 못한다(SLURM 소관, container_tools.UNENFORCED).
    production: false
    roles:
      scout: fake
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: singularity
      state_store: sqlite
    budget: dev_fake

  single_gpu_12g:
    # 12GB 카드 1장 기준 실서빙은 scout 하나만 올린다.
    #
    #   Qwen3-4B(FP8)        약 8.0GB
    #   Qwen3-Embedding-0.6B 약 1.2GB
    #   Qwen3-Reranker-0.6B  약 1.2GB
    #   합계                 약 10.4GB  (12GB 중)
    #
    # 산술적으로는 1.6GB가 남지만 셋을 한 장에 올리면 안 된다. vLLM은 기동 시
    # gpu_memory_utilization 비율만큼 메모리를 선점하고 가중치를 뺀 나머지 대부분을
    # KV cache로 잡는다. 세 프로세스가 같은 카드를 나눠 쓰면 scout에 남는 여유가
    # 1.6GB 미만이 되어 KV cache가 사실상 0이 되고, 동시 요청 1건도 처리하지 못한다.
    # 따라서 embedding·reranker를 포함한 나머지 전 역할을 Fake로 둔다.
    #
    # **메모리만으로는 부족하다 — 세대 조건이 따로 있다.** scout의 qwen3-4b는 `fp8`이고
    # FP8 텐서코어는 Ada(sm_89) 이상이다. 12GB 카드라도 Ampere(A2000, sm_86)에서는 기동
    # 자체가 안 된다. 이 프로필이 특히 위험한 이유는 이름이 정확히 "12GB 카드용"이라 그
    # 카드를 가진 사람이 고를 프로필인데, 메모리 계산은 맞고 세대 때문에 죽기 때문이다 —
    # 조건을 다 만족했는데 죽으므로 원인 찾기가 비싸다 (docs/portability.md §5 #2).
    description: "12GB 이상 + Ada(sm_89) 이상 단일 GPU. scout만 실서빙하고 나머지는 Fake."
    production: false
    roles:
      scout: qwen3-4b
      auditor: fake
      critic: fake
      embedding: fake
      reranker: fake
    adapters:
      retriever: fake
      tool_runner: fake
      state_store: sqlite
    budget: default

  local_balanced:
    description: "AI TOP ATOM(GB10) 전 역할 실서빙. B3' 조건의 기본 구성."
    # model-serving.md §3 체크리스트를 실측하고 models.yaml의 benchmark를 채우기 전까지
    # production: true 로 올리지 않는다.
    production: false
    roles:
      scout: qwen3-8b
      auditor: qwen3-coder-30b-a3b
      critic: devstral-small-2-24b
      embedding: qwen3-embedding-0.6b
      reranker: qwen3-reranker-0.6b
    adapters:
      # retriever는 fake로 둔다. hybrid로 올리면 embedding·reranker까지 실서빙이 되어
      # ATOM에 모델 5개를 동시에 띄워야 하고, R1(sm_121 커널 호환성) 검증의 실패 지점이
      # 그만큼 늘어난다. 검색 경로는 dev_hybrid가 GPU 없이 이미 태우고 있다.
      retriever: fake
      # 도구가 실제로 돌아야 `RunRecord.tool_images`가 채워지고, **그래야 이 run이
      # 비교표에 들어간다**(STATUS.md §8). fake로 두면 완주시켜도 비교 대상이 아니라
      # 중간 발표 DoD "B1 조건 1회 완주"를 프로필 정의만으로는 만족시킬 수 없었다.
      #
      # **`docker`인 것은 주 실서빙 장비가 ATOM이기 때문이다** — 프로필은 주 실서빙
      # 장비의 런타임을 선언하고 다른 장비가 오버라이드한다(portability.md §3).
      # 그 기준은 그대로이고, **바뀐 것은 "ATOM의 런타임"이 무엇이냐다.**
      #
      # ⚠ **2026-08-28에 `podman` → `docker`로 되돌렸다.** 경위는
      # decisions/0005-tool-runner-override.md의 마지막 절. 2026-08-17에 `docker` →
      # `podman`으로 간 근거는 "ATOM에는 podman만 있다"였고 그 전제가 2026-08-21에
      # 반증됐다(Docker 29.2.1 · podman 4.9.3 공존. 2026-08-28
      # `ssh atom 'which podman; which docker'`로 재확인 — 둘 다 /usr/bin에 있다).
      #
      # **되돌린 진짜 이유는 선언값이 실행 기록과 어긋나 있었다는 것이다.** `b1_single`로
      # 돈 run 둘(`run_20260827_0001`·`0004`)이 **둘 다 `tool_runner: docker`**다 — 즉
      # `--tool-runner docker` 오버라이드를 달고 돌았다. 그것은 evaluation.md §2.3 규칙 2가
      # 조건 비교용 프로필에 금지한 예외이고, ADR 0005가 podman을 고른 근거("주 경로가
      # 상시 예외 상태면 그 기록이 '이 run은 특별했다'를 뜻하지 못한다")가 **이제 정확히
      # 반대를 가리킨다.**
      #
      # **"이미 podman으로 돈 run과 digest가 갈린다"던 유지 사유는 사실이 아니었다.**
      # artifacts의 run 14건을 전수 조회한 결과 podman으로 도구를 돌린 run은
      # `run_20260817_0001` 하나이고, 그것은 `model_checksums`가 전부 0인 dev 프로필이다
      # (`dev_docker --tool-runner podman`). **이 프로필과 `b1_single`로 podman을 써서 돈
      # run은 0건이라 갈릴 기록이 없다.**
      #
      # 반대 방향의 대가는 없다. 이 프로필의 모델 5개 중 3개가 Blackwell 이상을 요구하므로
      # (`fp4` ×1, `nvfp4` ×2) Slurm(sm_86)에서는 **애초에 기동하지 못한다**
      # (portability.md §5 #1). 그래서 그 장비에서 `--tool-runner singularity`가 상시
      # 필요해지는 상황이 생기지 않는다.
      tool_runner: docker
      state_store: sqlite
    budget: default

  local_balanced_hybrid:
    description: "local_balanced에 검색 경로를 켠 것. embedding·reranker를 실제로 띄우는 첫 프로필."
    # **build-plan §8 row 2("임베딩·리랭커를 켠다")가 요구하는 프로필이다.** 그 행이 건
    # 선행 조건은 "checksum을 먼저 채운다" 하나이고 2026-09-03에 채워졌다 — 이슈 #131
    # (config/models.yaml의 qwen3-embedding-0.6b·qwen3-reranker-0.6b).
    #
    # **local_balanced를 고치지 않고 새로 판 이유.** 그 프로필은 b1_single과 함께 조건
    # 비교표(B1·B3')의 정본이고, evaluation.md §2.3 규칙 2가 "retrieval 설정은 고정한다"로
    # 두 조건의 검색 경로를 같게 묶어 둔다. 실시간 retriever를 그 이름 아래에서 바꾸면
    # 과거 run과 앞으로의 run이 같은 프로필 이름을 달고 다른 것이 된다.
    #
    # **이 프로필은 evaluation.md §2.3 규칙 2가 세는 「조건 비교에 쓰는 실서빙 프로필」에
    # 들어가지 않는다.** 그쪽은 비교축이 모델 구성이고, 이것은 검색 경로를 켜는 쪽이라 그 표의
    # 셀이 아니다. 그래서 그 문단의 목록에 이 이름을 더하지 않는다 — **개수를 여기 적지
    # 않는 것도 의도다**: 그 목록은 프로필이 늘고 줄 때마다 움직인다.
    #
    # ── fake로 두었던 근거가 어디까지 움직였나 ──
    #
    # local_balanced의 retriever 주석이 든 근거는 둘이다: ① ATOM에 모델 5개를 동시에
    # 띄워야 한다 ② R1(sm_121 커널 호환성) 검증의 실패 지점이 그만큼 늘어난다.
    #
    # **①의 메모리 전제만 실측이 건드렸다.** 2026-09-03 ATOM에서 잠재우기가 약 51 GiB를
    # 반환했고 왕복이 2~6초였다(콜드 238초). 세 계측기가 일치했다 — 통합메모리가 모델을
    # 붙들고 안 놓는 장비가 아니다
    # (docs/experiments/harness/2026-09-03-model-swap-sleep-atom.md §1).
    #
    # **그 실측을 더 세게 읽지 않는다.** 같은 보고서가 스스로 셋을 못박는다.
    #   · §5 — mem_gb_ctx8k를 안 쟀다. 이 실험의 context는 32,768이고 8K 고정이 아니다.
    #   · §5 — 모델 **하나**를 재우고 깨웠다. 여러 모델을 번갈아 올리는 것은 안 했다.
    #   · §7-5 — 교대를 하네스에 배선하는 것은 별개다. 그 항이 근거로 든 것은
    #     "execution.mode·swap 키가 스키마에 없고 extra=forbid라 프로필이 로드 단계에서
    #     거부된다"이고, 이 실험은 "장비가 되는가"만 답했지 "하네스가 할 수 있는가"는
    #     안 답했다고 적는다.
    #
    # ⚠ **§7-5가 든 그 근거는 2026-09-09에 바뀌었다 — 보고서 밖의 사실이라 여기 적는다.**
    # ADR 0009가 연 execution.mode·swap이 ProfileEntry에 들어와, 이제 적으면 로드는
    # 통과한다(ADR 0009 결과 1). **§7-5의 결론은 그대로다** — 없는 것은 그 뒤이고,
    # 러너가 아직 단계 단위가 아니며 sleep/wake를 부르는 코드도 없다(결과 2·3, 각각 별도 PR).
    # 그래서 **이것은 다섯을 동시에 띄우는 프로필이다.** 교대로 다섯을 피하는 배선은
    # 아직 존재하지 않는다.
    #
    # **②는 실측이 건드리지 않았다.** R1은 커널이 도는가의 문제라 메모리와 다른 축이다
    # (docs/open-questions/R/R1.md — model-serving.md §3 체크리스트 7개 중 1개 통과·1개
    # 부분). 검증 지점이 다섯으로 느는 것은 그대로다. **그것이 이 프로필의 쓸모다** —
    # 8004·8005가 실제로 뜨는지는 이 프로필로만 물을 수 있다.
    #
    # ⚠ **production: true로 올리지 않는다.** local_balanced와 같은 조건이다 —
    # model-serving.md §3 체크리스트를 실측하고 models.yaml의 benchmark를 채우기 전까지다.
    # 두 검색 모델의 benchmark는 checksum과 달리 아직 전부 0이다(미실측 표시).
    #
    # ⚠ **예산은 아직 이 배선에 맞춰 잡히지 않았다.** src/adapters/hybrid_retriever.py의
    # 모듈 docstring이 "실서빙 hybrid 프로필이 생기면 예산을 캡슐 선언값이 아니라 이 사실로
    # 잡아야 한다"고 적어 뒀다 — related 본문이 산문과 사실 블록 양쪽에 실려 선언 N토큰이
    # 실제로는 약 2N을 차지한다(#67과 같은 계약). 그 조건이 이 프로필로 성립했다.
    # `budget: default`를 그대로 쓰는 것은 **대조군과 축을 하나로 유지하려는 선택**이지
    # 그 예산이 맞다는 판정이 아니다. 재는 것이 선행이다.
    production: false
    # local_balanced와 **같아야 한다.** 차이가 retriever 하나여야 두 프로필의 run 차이를
    # 검색 경로로 돌릴 수 있다. tests/test_config.py의
    # test_the_hybrid_serving_profile_differs_from_local_balanced_only_in_the_retriever가
    # roles·budget·나머지 어댑터까지 기계로 고정한다.
    roles:
      scout: qwen3-8b
      auditor: qwen3-coder-30b-a3b
      critic: devstral-small-2-24b
      embedding: qwen3-embedding-0.6b
      reranker: qwen3-reranker-0.6b
    adapters:
      # 이 한 줄이 local_balanced와 다른 전부다.
      retriever: hybrid
      tool_runner: docker
      state_store: sqlite
    budget: default

  b1_single:
    description: "벤치마크 조건 B1 — 전 역할을 같은 단일 모델로 실행."
    # evaluation.md §2.3 공정성 규칙 1: 조건 간 차이는 프로필과 단계 활성화만.
    # 예산·임계값·프롬프트 버전은 budgets.yaml에서 공통으로 온다.
    production: false
    roles:
      scout: qwen3-coder-30b-a3b
      auditor: qwen3-coder-30b-a3b
      critic: qwen3-coder-30b-a3b
      embedding: qwen3-embedding-0.6b
      reranker: qwen3-reranker-0.6b
    adapters:
      # local_balanced와 같은 이유로 fake다. B1과 B3'의 차이가 "모델 구성"이어야 하므로
      # 검색 경로도 두 조건에서 같아야 한다(evaluation.md §2.3 규칙 2).
      retriever: fake
      # local_balanced와 같은 이유로 컨테이너 런타임이다 — `RunRecord.tool_images`가 비면
      # 이 run은 비교표에서 제외되고(STATUS.md §8), 그러면 B1 조건을 완주시켜도 B3'와
      # 대조할 수 없다. 두 조건이 같은 tool_runner를 써야 도구 차이가 결과 차이로 섞이지
      # 않는다. 런타임이 `docker`인 근거도 local_balanced와 같다(주 실서빙 장비 = ATOM,
      # portability.md §3). 세 역할이 전부 `nvfp4`라 Slurm에서 못 도는 것도 같다.
      #
      # **이 프로필이 되돌림의 직접 근거다.** 선언은 `podman`이었는데 이 프로필로 돈 run
      # 둘(`run_20260827_0001`·`0004`)이 `RunRecord.tool_runner: docker`다 — 주 경로가
      # 상시 오버라이드 상태였다. 자세한 것은 local_balanced 주석과 ADR 0005 마지막 절.
      tool_runner: docker
      state_store: sqlite
    budget: default

  # --- 로스터 canonical 배선(PROJECT-CONTEXT.md §1 정본) — Scout seccoderx·qwen3-14b + Auditor qwen3.6 + Critic gpt-oss + 리랭커 4b, 단계 단위 실행 ----
  harness_pool:
    # **§1 정본의 로스터를 배선한 canonical 프로필이다. checksum·처리량 검증 전.**
    # 2026-09-24 `local_balanced_pool`에서 이름을 바꿨다(@danielcho02 — 로스터 확정에 따라 프로필 배선).
    # 그 이름으로 적힌 날짜 붙은 서술(PR #190·#240 등)은 이 프로필의 옛 이름을 가리킨다.
    #
    # - **Scout 풀** — scout_{memory,boundary,injection}이 각자 CWE 계열을 본다(ADR 0010 §3).
    #   memory·boundary = `seccoderx-8b`(한 키가 두 역할, 프롬프트 v3 폴더가 내용을 가름:
    #   scout_memory/v3=옛 v14s · scout_boundary/v3=옛 v15s), injection = `qwen3-14b`(v3) —
    #   2026-09-23 팀 피드백(모델 크기를 내리자)으로 `deepseek-r1-distill-qwen-32b`에서 옮겼다.
    # - **Critic = §1의 `gpt-oss-20b`**(reasoning_effort: high). 프롬프트는 v1이다 — v3로 올리는 것은
    #   검증 run 뒤의 별도 단계다(`prompts/critic/v3/meta.yaml`).
    # - **Auditor = §1의 `qwen3.6-35b-a3b`.** registry가 아직 디스크의 v1을 고른다(auditor/v3는 2026-09-22
    #   #237로 디스크에 있고 올리는 것은 별도 단계다). critic gpt-oss와 계열이 갈린다(qwen × gpt-oss,
    #   `_check_family_split`). 이 Auditor의 기동 조건(parser 없이 띄우면 사고 없이 답한다)은
    #   `config/models.yaml`의 그 항목이 든다.
    # - **리랭커 = §1의 `qwen3-reranker-4b`** — 근거·범위는 `harness_pool_hybrid`의 주석이 든다.
    #   **`retriever: fake`인 이 프로필은 그것을 부르지 않지만** 쌍의 roles가 같아야 해서 같이 적는다.
    #
    # ## 실행 — 단계 단위(`execution.mode: per_stage` — ADR 0009, ADR 0010 §1이 승인)
    #
    # 모든 target이 한 단계를 마친 뒤에 다음 단계가 시작한다(`runner._triage_by_stage`). 그래야 단계마다
    # 그 단계의 모델만 떠 있으면 된다 — 네 서버를 한 장비에 다 올리면 util 합이 1.44로 1을 넘는다
    # (0.20 + 0.30 + 0.64 + 0.30 — `config/models.yaml` 각 항목 「기동 조건」의 util, 계산값).
    # ⚠ **교대(`execution.swap`)는 아직 적지 않는다 — 배선이 없다**(ADR 0009 결과 3). 적으면 러너가 아무것도
    #   재우지 않는데 정책이 선 것처럼 보인다. 교대 배선 PR이 여기에 함께 적는다. 그때까지 이 프로필로
    #   끝까지 도는 run은 네 서버가 동시에 떠 있어야 하고, ATOM에는 그렇게 못 올린다.
    #
    # ⚠ `production: false`는 **안전장치가 아니다.** `served_models()`가 이 프로필에서 5역할
    #   (scout 셋+auditor+critic)을 돌려주므로 러너는 이것을 **실서빙 프로필로 취급**하고
    #   `--device`·`--condition`을 요구한다(`runner.py`의 그 주석 — dev/실서빙을 가르는 것은
    #   `production`이 아니라 `served_models()`다, 2026-09-02 실측). `production: false`가 실제로
    #   하는 일은 `cli._check_benchmarks`의 미측정 ERROR를 WARN으로 내리는 것뿐이다. Scout·Auditor 세 키
    #   (`seccoderx-8b`·`qwen3-14b`·`qwen3.6-35b-a3b`)의 `checksum`이 0이라 이 프로필로 돈 run은
    #   비교표에서 제외된다(CLAUDE.md §0).
    description: "로스터 canonical 배선(§1 정본: Scout 풀 seccoderx·qwen3-14b + Auditor qwen3.6 + Critic gpt-oss + 리랭커 4b), 단계 단위 실행 — checksum·처리량 검증 전"
    production: false
    roles:
      scout_memory: seccoderx-8b
      scout_boundary: seccoderx-8b
      scout_injection: qwen3-14b
      auditor: qwen3.6-35b-a3b
      critic: gpt-oss-20b
      embedding: qwen3-embedding-0.6b
      reranker: qwen3-reranker-4b
    adapters:
      retriever: fake
      tool_runner: docker
      state_store: sqlite
    budget: default
    execution:
      mode: per_stage

  harness_pool_hybrid:
    # `harness_pool`에 **검색 경로를 켠 것** — embedding·reranker를 실제로 부르는
    # 풀 프로필. `local_balanced`↔`local_balanced_hybrid`와 같은 결이고, 유일한 차이가
    # `retriever` 하나여야 두 프로필의 run 차이를 검색 경로로 돌릴 수 있다(아래 테스트가 고정).
    # 2026-09-24 `local_balanced_pool_hybrid`에서 이름을 바꿨다. 검색 3단계를 어떻게 쓸지는 팀 논의가
    # 남아 있어(2026-09-26 대면) canonical은 `harness_pool`(fake retriever)이다.
    #
    # **왜 in-place로 안 바꾸고 새로 파나.** `harness_pool`(fake retriever)은 GPU 없이
    # 풀 팬아웃 제어흐름을 도는 자리이고, 이것은 3단계 검색(embedding→reranker)을 실제로 태우는
    # 자리다 — 축이 하나여야 어느 쪽 효과인지 갈린다. `local_balanced_hybrid`가 같은 이유로
    # `local_balanced`와 나뉜 것과 같다.
    #
    # ⚠ **전 역할이 `harness_pool`과 같은 §1 키다** — Scout seccoderx·qwen3-14b(v3),
    #   Auditor `qwen3.6-35b-a3b`(프롬프트 미확정이라 디스크의 v1), Critic gpt-oss.
    #   checksum·검증 전. **reranker는 2026-09-20에 §1 정본대로 `qwen3-reranker-4b`로
    #   올렸다** — 두 풀 프로필을 같은 diff에서 고친다(`tests/test_config.py`가 쌍의 roles 동일을
    #   기계로 고정하므로 한쪽만 고치면 red다).
    # ⚠ **올린 것이 검증된 것은 아니다.** #152의 배제셋 중 **둘이 열려 있고**(참조 구현 대조 ·
    #   리랭커를 끈 기준선), `benchmark`는 전부 `0`이다(미실측 표시 — CLAUDE.md §0).
    #   2026-09-13 ATOM 실측은 **우리 실경로 질의 모양**(맨 식별자 하나)에서 이 모델을 나쁘게 쟀다
    #   — 전체-8 렌즈에서 정답이 **7위**, 무관이 1위. ⚠ **그 실측의 수를 완화로 쓰지 마라.**
    #   배선 렌즈인 top-5에서 2/3으로 덜 나쁘게 보이지만 그 칸에 단서가 둘 붙는다 —
    #   ① 형제 PR #189가 **문서 압축만 바꿔 그 칸을 포함해 두 칸을 뒤집었다.** ⚠ **방향이 갈린다** —
    #   그 칸은 2/3→**3/3**(4b에 유리)이고 자연어 질의는 PASS→**FAIL**이다. 그래서 자매 보고서
    #   (템플릿 쪽)가 *"32건·실조각 실측 전까지 어느 숫자도 확정이 아니다"*로 닫는다.
    #   ② 여기 top-5는 **8건에서 5**(62.5%)인데 실경로는 **32건에서 5**(15.6%)라, 입력 모양 보고서가
    #   그 문장을 *"32건 실측 전까지 상한"*으로 못박는다. 관측·남은 레버는 #152.
    #   **0.6b로 되돌리는 것이 답은 아니다** — 만든 쪽 표(검색 조사 §1)에서 MTEB-Code는 리랭킹 없음
    #   **75.41** 대비 0.6B **73.42** · 4B **81.20** `[출처주장]`이고 그 차 **−1.99**·**+5.79**는 `[계산]`이다.
    #   그것이 §1 로스터가 4b를 앉힌 근거다.
    #   ⚠ 그 표는 **우리 입력 모양이 아니고**, 0.6B의 관측을 4B에 이식하는 것은
    #   `docs/decisions/0010-harness-structure-and-model-roster.md` 후속 1이 금지한다(#152는 그
    #   추적 미러다 — 금지의 출처가 아니다).
    #   ⚠ **둘을 「미검증」으로 묶지 마라 — 상태가 다르다.** 4b는 우리 모양에서 **재서 나빴고**(위),
    #   0.6b는 우리 모양에서 **재지 않았다.** 이 배선은 「미검증 둘 중 정본」이 아니라
    #   **불리한 우리-모양 실측을 외부 표와 정본으로 넘은 판단**이다. 근거·범위는 #152가 든다.
    #   `#189`가 넣은 Qwen3 instruction 양식은 두 모델 다에 실린다 — `local_balanced_hybrid`와
    #   **같은 `VllmRerankerClient`**라 새 코드 경로가 아니라 풀 프로필에 그 경로가 붙는 것이다.
    # ⚠ **예산은 이 배선에 맞춰 안 잡혔다** — `hybrid_retriever.py` 모듈 docstring이 적은
    #   「related 본문이 산문·사실 블록 양쪽에 실려 선언 N토큰이 실제 ~2N」(#67 계약)이 이
    #   프로필에도 성립한다. `budget: default`는 축을 하나로 유지하려는 선택이지 그 예산이
    #   맞다는 판정이 아니다 — 재는 것이 선행이다(`local_balanced_hybrid`와 같은 상태).
    # ⚠ **`production: false` — `harness_pool`과 같다.** 그 주석대로 안전장치가 아니라
    #   `served_models()`가 실서빙으로 취급하므로 손으로 안 돌린다.
    description: "harness_pool에 검색 경로를 켠 것 — 풀에서 embedding·reranker를 실제로 부르는 첫 프로필 (플러밍, 검증 전)"
    production: false
    # `harness_pool`과 **같아야 한다.** 차이가 retriever 하나여야 검색 경로 효과가
    # 갈린다. tests/test_config.py가 roles·budget·나머지 어댑터까지 기계로 고정한다.
    roles:
      scout_memory: seccoderx-8b
      scout_boundary: seccoderx-8b
      scout_injection: qwen3-14b
      auditor: qwen3.6-35b-a3b
      critic: gpt-oss-20b
      embedding: qwen3-embedding-0.6b
      reranker: qwen3-reranker-4b
    adapters:
      # 이 한 줄이 harness_pool과 다른 전부다.
      retriever: hybrid
      tool_runner: docker
      state_store: sqlite
    budget: default
    # 실행 단위도 `harness_pool`과 같아야 한다 — 다르면 두 run의 차이가 검색 경로 하나로 안 갈린다.
    execution:
      mode: per_stage
