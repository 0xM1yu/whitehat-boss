# ATOM 장비 파일 — 교대 명령과 모델별 기동 조건 (ADR 0012 Phase 6.5 — ADR 0009 「2026-09-29 제안」 절).
#
# `run --device atom`이 고른다. **하네스는 이 값을 쓰지 않는다** — 교대 명령(`command`)이 읽는다. 하네스는
# 스키마(`src/config.py`의 `ServerLaunch`)와 registry 교차 검사(`check_serving` — 창 = `context_limit`)만 한다.
# 포트·체크포인트·revision은 registry(`config/models.yaml`)가 든다.
#
# ## 장비
# GIGABYTE AI TOP ATOM — GB10(sm_121 · aarch64). **통합메모리**다 — CPU·GPU가 한 메모리(MemTotal 119.7 GiB)를
# 나눠 쓰고 `nvidia-smi`의 메모리 칸이 `[N/A]`라, 교대 명령이 MemAvailable 판정을 탄다(`tools/serve/swap.sh`
# 머리 주석 · docs/portability.md §6 「페이지 캐시」). vLLM이 util을 곱하는 분모는 119.7 GiB다
# (docs/experiments/harness/2026-09-28-ne-loop-smoke-benign-atom.md 메타). docker가 있어 하네스·vLLM·도구가
# 한 기계에서 돈다 — 그래서 첫 종단 검증 장비다(2026-09-29 사용자).
# ⏵ 2026-10-08 — 그 검증은 2026-09-29 07:28 KST에 한 번 돌았다(`docs/experiments/harness/2026-09-29-stage-swap-smoke-atom.md`).
#   같은 날 ATOM 사용이 끝났다(#340 · docs/portability.md §6) -> 이 파일은 기록이다. 그 뒤
#   `docs/experiments/` 보고서의 장비는 `vastai-remote`다(2026-10-04 · 2026-10-06 · 2026-10-08). `atom`은 여전히
#   `tests/test_serving.py`·`tests/test_serve_scripts.py`·`tests/test_model_swap.py`의 장비 목록에 든다.
#
# ## command — 로컬 실행
# 하네스와 같은 기계의 로컬 subprocess다(ADR 0009 「2026-09-29 제안」 절 6). vLLM 실행 파일과 gpt-oss의 Harmony
# 어휘 경로는 사람마다 달라 여기 적지 않는다 — run을 띄우는 셸에서 `VLLM_BIN`(예: `$HOME/venv-probe/bin/vllm`)과
# `TIKTOKEN_ENCODINGS_BASE`(예: `$HOME/tiktoken_encodings`)를 export한다. 교대 명령이 그 환경을 물려준다.
#
# ## 값의 성격 — 전부 「계획값 — ATOM 미실측(2026-09-29)」
# util·seqs는 로딩·배선 조사 ②-1(2026-09-24 채택 배선 — 저장소 밖 문서)이다. **이 util·이 창의 조합으로 뜬
# 적은 없다** — 행마다 가장 가까운 ATOM 실측을 적었다. 창(`max_model_len`)은 registry `context_limit` 그대로다
# (`check_serving`이 강제 — 2026-09-25에 Scout를 16,384로 띄워 400이 조용히 버려졌다, #331). 단계 util 합 ≤ 0.80
# (②-1). 준비 상한(`ready_timeout_s`)은 ATOM 기동 실측 × 3이고, 실측이 없는 Auditor는 계산값 × 3이다.
#
# 공통 환경(`&vllm_env`)은 ATOM에서 로스터를 띄운 인자 그대로다(`config/models.yaml` 각 항목 「기동 조건」).
# `VLLM_ATTENTION_BACKEND`는 0.27.1에 없는 이름이라 안 쓴다 — 백엔드는 `--attention-config.backend`다.

command: [bash, tools/serve/swap.sh]

servers:
  # --- 4단계 Scout — 서버 하나다 ---
  # KV는 계산값이다: util × 119.7 − (가중치+non-torch · 활성 — ATOM 실측) ÷ 토큰당 KV.
  # ⏵ 2026-10-14 — `scout_boundary`가 `qwen3-14b`로 옮겨 쌍이 하나가 됐다(`seccoderx-8b`는 로스터에서
  #   내려왔다 — PROJECT-CONTEXT.md §1). 그 전에는 util 합이 0.70(0.30 + 0.40) ≤ 0.80이었다.
  #   남은 0.30은 어디에도 안 줬다 — 단독 기동의 KV를 다시 재지 않았다(CLAUDE.md §0).
  #   앵커 `&vllm_env`를 선언하는 자리도 그 키에서 아래 `qwen3-14b`로 옮겼다.
  qwen3-14b:
    # 0.40 × 119.7 = 47.9 GiB − 28.27(가중치+non-torch, 09-24) − 0.80(활성 — 09-21 dense 24B의 값을 상한으로)
    # ≈ 18.8 GiB → 160 KiB/토큰(09-24 실측 7.37 GiB ÷ 48,256 토큰)이면 ≈123k 토큰 = 창 131,072의 0.94배(계산값, 미실측) — ⚠ 한 요청이 못 들어가는 크기다. ATOM은 사용 종료라 띄워 보지 않는다.
    # memory·boundary·injection 세 역할이 이 한 서버를 쓴다(⏵ 2026-10-15 — 「두 역할」이었다). 가장 가까운 실측: 2026-09-28 util 0.30 · 창 40,960.
    # 준비 상한 550 s ≈ 181 s(09-24 스모크) × 3.
    util: 0.40
    max_num_seqs: 8
    max_model_len: 131072
    # ⏵ 2026-10-15 — YaRN: 창 131,072 = registry `context_limit`. 원천(카드 README@rev · vLLM 0.27.1 소스)·한계는
    # `config/models.yaml`의 `qwen3-14b` 「YaRN」 절이 든다. `--rope-scaling`은 0.27.1에 없어 `--hf-overrides`다.
    # JSON은 한 인자라 swap.sh의 `shlex.quote`가 그대로 넘긴다. 이 조합으로 띄운 적은 없다 — 미실측.
    extra_args:
      - --enforce-eager
      - --enable-prompt-tokens-details
      - --reasoning-parser
      - deepseek_r1
      - --hf-overrides
      - '{"rope_parameters":{"rope_type":"yarn","rope_theta":1000000,"factor":4.0,"original_max_position_embeddings":32768}}'
    env: &vllm_env
      VLLM_USE_DEEP_GEMM: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      VLLM_HOST_IP: "127.0.0.1"
      NCCL_SOCKET_IFNAME: lo
      GLOO_SOCKET_IFNAME: lo
    probe: chat
    ready_timeout_s: 550

  # --- 5단계 Auditor — 단독 ---
  qwen3.8-27b:
    # 여유(계산값): 가중치 51.1 GiB(2026-09-29 vast 실측 — 같은 bf16 체크포인트)
    # + 창 262,144 × 64 KiB/토큰(registry 주석의 계산) = 16 GiB → 67 GiB < util 몫 0.80 × 119.7 = 95.8 GiB.
    # 가장 가까운 실측: 2026-09-28 ATOM에서 util 0.80으로 떴다(정상 표본 스모크 §5 — 창은 보고서에 없다).
    # 그 run 동안 MemAvailable 최저는 16.2 GiB였다(같은 보고서 「감시자 기록」).
    # ⚠ 기동 전 여유 검사가 날에 따라 통과·거부로 갈린다 — 필요량 = util 몫 0.80 × 119.70 + 서버 호스트 몫 3 +
    #   감시자 하한 12 + 여분 4 = 114.76 GiB(계산값 — 교대 명령은 0.1 GiB로 반올림해 114.8과 비교한다). 빈 ATOM의
    #   MemAvailable 실측은 114.6(09-27 보고서 — run 뒤 읽기, 페이지 캐시를 뗐는지 기록이 없다) · 115.1(#335 교대
    #   스모크 — Scout `qwen3-14b` 기동 앞 교대 명령의 판정값) · 115.2(#335 — **Auditor 기동 앞** 판정값) · 115.3
    #   (09-24·09-28 정리 뒤) · 115.4(09-26)라 여유가 −0.16~+0.64 GiB다(계산값). 모자라면 MEM_WAIT_S 뒤 교대가 run을 멈춘다 — 잃는 것은 재실행 시간이다. 그 run만 여분을 줄이려면
    #   run을 띄우는 셸에서 SWAP_MARGIN_GIB를 export한다(교대 명령이 하네스의 환경을 물려받는다) — 줄인 만큼 감시자
    #   하한 위의 여유가 줄고, 그 위험은 운영자 몫이다. 값을 바꿀지는 결정 대기다.
    # max_num_seqs 8 — registry 주석에 값이 없다(조사 ②-1의 16은 옛 qwen3.6 값). 하네스는 단계 안 요청을
    # 한 번에 하나 보내므로(단계 안 동시성 미착수) 상한일 뿐이다.
    # 준비 상한 1,720 s — ATOM 기동 실측이 없다. 계산값 573 s × 3: vast 기동 중 적재 밖의 시간 190 s(244 s −
    # 다운로드 44.8 s − 가중치 읽기 9.1 s, 2026-09-29 vast 로그) + 51.75 GiB ÷ 0.135 GiB/s(ATOM에서 잰 가장
    # 느린 적재 — 09-24 `seccoderx-8b` 15.27 GiB / 113 s) = 383 s.
    util: 0.80
    max_num_seqs: 8
    max_model_len: 262144
    extra_args:
      - --enforce-eager
      - --enable-prompt-tokens-details
      - --reasoning-parser
      - qwen3
      - --structured-outputs-config.backend
      - xgrammar
    env: *vllm_env
    probe: chat
    ready_timeout_s: 1720

  # --- 7단계 Critic — 단독 ---
  gpt-oss-20b:
    # 2026-09-21 ATOM에서 util 0.30 · 창 32,768로 KV 20.57 GiB = 795,782 토큰이었다(로스터 메모리·KV 보고서 #8) —
    # 창 131,072의 6배라 util은 그대로 두고 창만 `context_limit`으로 올린다. 2026-09-28에도 0.30으로 떴다.
    # 백엔드 TRITON_ATTN · xgrammar는 registry 「기동 조건」. `VLLM_SYSTEM_START_DATE`는 Harmony 시스템 메시지의
    # 날짜를 고정한다(0.27.1 `envs.py` — 없으면 그날 날짜가 들어가 run마다 프롬프트 토큰이 갈린다).
    # 준비 상한 300 s = 100 s(09-21 보고서 §3.1 콜드 기동 — 페이지 캐시를 떼고 잰 값) × 3.
    util: 0.30
    max_num_seqs: 8
    max_model_len: 131072
    extra_args:
      - --enforce-eager
      - --enable-prompt-tokens-details
      - --attention-config.backend
      - TRITON_ATTN
      - --structured-outputs-config.backend
      - xgrammar
    env:
      <<: *vllm_env
      VLLM_SYSTEM_START_DATE: "2026-09-29"
    probe: chat
    ready_timeout_s: 300

  # --- 8단계 PoV — 단독 ---
  feyospace-v1-small:
    # Auditor(`qwen3.8-27b`)와 같은 모델·창이라 그 행 값을 그대로 따른다 — **전부 계획값·ATOM 미실측**.
    # util 0.80(단독 단계라 Auditor와 같은 몫) · 창 262,144(registry context_limit, check_serving 강제).
    # 준비 상한 1,720 s = Auditor와 같다(같은 크기 콜드 기동). `--reasoning-parser qwen3`가 없으면
    # `thinking_token_budget`을 건 요청이 400이다(`qwen3.8-27b`와 같은 기제). 비전 타워는 로드되나 안 쓴다 —
    # (language-only 플래그는 vLLM 0.27.1 지원 확인 뒤 붙인다).
    util: 0.80
    max_num_seqs: 8
    max_model_len: 262144
    extra_args:
      - --enforce-eager
      - --enable-prompt-tokens-details
      - --reasoning-parser
      - qwen3
      - --structured-outputs-config.backend
      - xgrammar
    env: *vllm_env
    probe: chat
    ready_timeout_s: 1720
