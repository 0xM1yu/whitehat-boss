# run 단위 예산과 정책 임계값 (engineering-guide.md §8.5)
#
# 하드코딩 금지 — 임계값·예산·모델은 전부 여기서 온다. 노드는 이 값을 직접 비교하지 않고
# RoutingPolicy를 거친다(src/orchestrator/policy.py).
#
# evaluation.md §2.3 공정성 규칙: 모든 조건은 동일 예산에서 실행한다. 조건 간 차이는
# 프로필과 단계 활성화만이므로 thresholds·sampling·seed는 프로필과 무관하게 공통이다.
# 실제로 쓰인 값은 RunRecord.thresholds에 박제된다(evaluation.md §6).

budgets:
  default:
    # ⏵ 2026-10-05 — 토큰 두 상한을 **10배**로 올렸다(4,000,000 → 40,000,000 · 400,000 →
    # 4,000,000). **사용자 결정이고 잰 값이 아니라 정한 값이다(§0).** 이유: 서빙이 자체 서빙(vast
    # 대여 GPU)이라 토큰은 청구되지 않는다 — 돈에 가장 가까운 상한은 `gpu_seconds`이고 **그것도 같은 날
    # 올렸다**(7,200 → 72,000 — 아래). 토큰 상한의 목적은 폭주 차단과 부분 결과 종료 하나이고,
    # Auditor 도구 루프(`thresholds.auditor_tool_hops`)가 켜지면 4,000,000은 후보 몇 건에서 소진된다
    # (아래 그 줄의 계산값 — 3.5~7.6후보). 입력은 그 계산값이 근거다(40,000,000 ÷ 1,147,800 ≈ 34.8 ·
    # ÷ 525,700 ≈ 76후보 — 상한 쪽 계산값이지 실측이 아니다). **출력은 후보당 값이 0 관측이라 계산
    # 근거가 없다 — 입력과 같은 배율로 올렸을 뿐이다(미측정).**
    # ⏵ **이 절의 수(40,000,000 · 4,000,000 · ≈34.8후보)는 첫 인상 시점의 것이다** — 아래 둘째 ⏵로
    # 입력은 400,000,000(≈348후보 — 그 셈은 아래 `auditor_tool_hops` 주석의 둘째 ⏵가 든다),
    # 출력은 40,000,000이 됐다. 이전 run들의 값(4,000,000 ·
    # 400,000)과 같은 예산에서 돈 것이 아니므로 `RunRecord.budget`이 다른 run과는 비교표에서 따로
    # 읽어야 한다(evaluation.md §2.3).
    # ⏵ 2026-10-05 — `gpu_seconds`도 **10배**(7,200 → 72,000)로 올렸다. 사용자 결정이다. 이슈 #389가
    # 적은 대로 7,200은 서빙 역할 한 바퀴의 선언값 합보다 작아 정상 run을 끊었다(선택지 (a)). 그 합은
    # 지금 `harness_pool`·`harness_pool_hybrid` 둘 다 21,300 s다(2026-10-05 `load_config`의
    # `request_timeout_s`를 역할마다 합해 계산 — 이슈 작성 때는 `harness_pool`이 20,700이었다).
    # 72,000은 그 합의 3.4배였다(72,000 ÷ 21,300 ≈ 3.38 — 계산값). ⏵ **둘째 인상 뒤 현재 상한
    # 7,200,000은 그 합의 338배다**(7,200,000 ÷ 21,300 ≈ 338.0 — 계산값). **정한 값이지 잰 값이 아니다(§0) —
    # 실서빙 GPU 초는 0 관측이다.** 임대 비용을
    # 정하는 것은 인스턴스 가동 시간이고 이 상한은 run 한 건이 정상 진행 중에 끊기지 않게 하는 천장이다.
    # 🔴 ⏵ 2026-10-05 (둘째) — **`gpu_seconds`는 100배, 나머지 셋은 10배로 올렸다. 사용자 결정이다.**
    # 이 인상 직전 값은 72,000 · 40,000,000 · 4,000,000 · 1,800이다.
    #
    # **왜.** 220 슬라이스 전량 run을 환산하면 `gpu_seconds`가 **459,206~1,116,445 s(≈128~310시간)**
    # 로 나온다 — 비관 끝이 72,000의 **15.5배**다. 식은 한 줄이다(전부 계산값):
    #   `220 × (Scout s/슬라이스 + 슬라이스당 Auditor 호출 × 17 × Auditor 호출당 s)`
    #   낙관 `220 × (74.5 + 0.75 × 17 × 157.9)` · 비관 `220 × (67.0 + 1.25 × 17 × 235.7)`
    # 🔴 **17은 가정이다** — `thresholds.auditor_tool_hops: 16`이라 후보당 최대 17호출인데 **전 후보가
    # 16홉을 다 쓴다**고 둔 값이고 홉 수 분포는 **0 관측**이다. 그래서 같은 양을 **한 방 판**으로 센
    # 보고서 §5의 **42,500~79,600 s**보다 10.8~14배 크다. 보고서는 *「배율은 두지 않았다」*고 적는다 —
    # 그 차이는 전부 이 ×17에서 온다.
    # 단가 둘의 원천은 그 보고서
    # (`docs/experiments/harness/2026-10-04-cybergym-operational-run-vastai-remote.md` §5)이고,
    # **나머지 가정도 미검증이다**(220 완주 run 0회 · 단가 표본 run 둘 · v8 호출당 비용 미측정 ·
    # 4→220 선형 외삽 · Critic·PoV 몫 제외 · 비관 토큰은 호출 수 비만 적용).
    # **더 자세한 셈과 그 한계는 PR #501 본문이 든다.**
    #
    # 🔴 **실효 상한은 `gpu_seconds`가 아니다 — 토큰이다.** 같은 환산에서 비관 입력은
    # 400,000,000의 **79%**인데 `gpu_seconds`는 7,200,000의 **15.5%**다. 그리고 `output_tokens`
    # 40,000,000은 16.2 tok/s에서 **≈2,469,000 s(28.6일)**이라 `gpu_seconds` 7,200,000(83일)보다
    # **먼저 걸린다**(교차 속도 5.56 tok/s — 낙관 run의 Auditor는 **25.3 tok/s**이고 이것은 실측
    # 누적에서 나눈 **계산값**이다: 출력 11,960 ÷ 473.6 s, `run_20261003_0003`의 `trace.jsonl` —
    # ⚠ 그 파일은 `_workspace/`(gitignore)에 있어 **저장소 독자에게는 안 닿는다**).
    # `BudgetLedger._overrun`이
    # 네 키를 다 집행한다. 구조 상한(`auditor_tool_hops` · `candidate_max` · `critic_top_n`)도 그대로다.
    # ⚠ **그래서 `gpu_seconds`를 올린 것이 220 슬라이스를 가능하게 만들지 않는다** — 먼저 걸리는 것은
    # 토큰이고, 그 앞에 **벽시계와 인스턴스 가동 시간**이 있다(코드가 안 묶는다).
    #
    # ⚠ `tool_seconds`는 **환산 근거가 없다.** 실측은 run **1회분 7.069 s**(`run_20261003_0003`의
    # 마지막 `budget` charge `tool_ms`=7,069 — 같은 gitignore된 trace다. 도구 넷 중 둘은 실패로
    # 즉시 끝났다)이고 2단계 도구는 **artifact 단위**로 돌아 슬라이스 수에 선형이 아니다 — 220에서의
    # 값은 **미측정**이다. 올린 사유는 **v8 도구 루프가 홉마다 도구를 부르는 몫이 0 관측**이라는 것뿐이다.
    # ⚠ **네 값 다 잰 값이 아니라 정한 값이다(§0).** 목적은 「정상 run을 끊지 않는다」다.
    gpu_seconds: 7200000
    input_tokens: 400000000
    output_tokens: 40000000
    # 컨테이너 도구(semgrep·clang-tidy·build·asan)의 run 전체 상한. GPU 예산과 나눈
    # 이유는 그 도구들이 GPU를 쓰지 않기 때문이다(schemas/run.py `Budget.tool_seconds`).
    #
    # **이 값은 잠정치다. 실대상 측정이 아니다.** 지금 가진 수치는 2026-08-17에 잰
    # 8,492 ms(x86_64/docker)와 4,491 ms(aarch64/podman)뿐인데 둘 다 대상이
    # `tests/fixtures/target`(파일 두 개짜리 장난감 parser.c)이다. 실제 저장소는 파일이
    # 서너 자릿수 많으므로 그 값에서 상한을 유도하면 **지어낸 근거**가 된다
    # (model-serving.md §5·bench.py 모듈 docstring의 같은 규칙: 지어낸 값은 미측정을
    # production으로 통과시킨다).
    #
    # 근거를 만드는 측정(zlib 급 실대상 1회 run)은 안 했다 — 이슈 #65는 2026-10-12에 이 값을
    # 정한 값으로 둔 채 닫았다(실서빙 도구 시간 7~16 s). 이 값의 목적은 폭주 차단 하나이고,
    # 정상 run이 걸리지 않도록 넉넉히 둔다.
    # ⏵ **2026-10-05 — 1,800에서 18,000으로 10배 올렸다**(사용자 결정 · 위 `default` 줄 주석의
    # 둘째 ⏵). ⚠ **환산 근거가 없다** — 실측은 run 1회분 7.069 s이고 도구는 artifact 단위라
    # 슬라이스에 선형이 아니다. 올린 사유는 v8 도구 루프 몫이 0 관측이라는 것뿐이다. 이슈 #65(닫음)가 그 경위다.
    tool_seconds: 18000

  # **0이 든 예산은 Fake 전용 프로필(`dev_*`)만 쓴다.** 상한 0은 「검사하지 않는다」
  # (`BudgetLedger._overrun`)라 실모델을 서빙하는 프로필이 0이 든 예산을 쓰면 임대 GPU가 한도 없이
  # 돈다 — `load_config`가 그 프로필을 거부한다(`_check_real_serving_limits_are_positive`). 도구 시간은
  # `tool_runner`가 `fake`가 아닌 프로필(오버라이드 포함)이 0 예산을 쓰는 것도 거부한다
  # (`check_container_runtime_caps_tool_time`). `tool_seconds`는 안 적어도 0이다. 아직 안 잰 상한이면 0이 아니라 직접 고른 잠정 상한을 적는다(위 `default`의
  # `tool_seconds`가 그 모양이다 — 잠정치라고 밝히고 목적은 폭주 차단 하나로 둔다).
  dev_fake:
    # Fake 어댑터는 GPU를 쓰지 않는다 — 이 예산에는 **돈이 걸린 항목이 없다.**
    #
    # ⏵ 2026-10-03 — 넷을 다 0(= 상한 없음)으로 내렸다. 그전에는 토큰 둘이
    # `200000`·`20000`이었고 주석은 *"예산 소진 경로(stopped_after)를 테스트에서 태울 수
    # 있도록 일부러 작게 잡는다"*였다. **그 사유는 거의 성립하지 않는다** — 소진 경로를 태우는
    # 검사는 자기 예산을 주입하고(`tests/test_pipeline_e2e.py`의 `Budget(input_tokens=1,
    # output_tokens=1, gpu_seconds=0)` 둘), `git grep -w 200000 tests/`는 과거 run 매니페스트
    # 픽스처 하나만 낸다 — `-w` 없이 돌리면 ASan 주소 `0x602000000018`의 **부분 문자열**로 셋이
    # 더 걸린다(`tests/test_pov_loop.py`). ⚠ **소진 경로용으로 이 값을 빌린 것은 하나다** —
    # `tests/test_poc_log.py`의
    # `test_budget_exhaustion_leaves_no_poc_directory`가 `config.budget.input_tokens + 1`을
    # 청구했다. 「특정 값과 무관」이지만 **상한이 양수여야** 성립하는 꼴이라 0으로 내리자
    # 빨개졌고, 그래서 그 검사도 자기 예산을 주입하게 고쳤다(같은 PR).
    # ⚠ **「0건」이 아니다 — 이 값에 결합된 검사는 둘이고 둘 다 같은 PR에서 고쳤다.** 다른 하나는
    # `tests/test_budget.py`의 `test_a_real_serving_profile_cannot_borrow_the_fake_budget`이고,
    # 소진 경로가 아니라 **0인 키 목록**을 단언해서 둘 → 넷으로 늘었다. 첫 판에 「0건」이라 적은
    # 것은 전수를 `200000` **문자열**로 돌려 그 동적 독자를 못 봤기 때문이다(CLAUDE.md §2.5).
    #
    # 🔴 **그 상한이 실제 과제를 막았다.** 이 프로필의 설명문은 *"GPU 없이 파이프라인 0~9단계를
    # 완주시키는"*인데(`profiles.yaml`), 실제 CyberGym Level 1 번들(우리가 가진 가장 작은 것)에서
    # `204,963`이 `200,000`을 넘어 계획된 대상 47건 중 9건에서 끝났다(`stopped_after: 4`).
    # 7·8단계에 못 가 PoC 바이트가 0개였다 — 이슈 #424. (그 run의 보고서는 별 PR이 들여온다.
    # 여기서 경로로 가리키지 않는 것은 머지 순서를 강제할 장치가 없어서다 —
    # `test_config_comments_point_at_a_real_doc`가 그 사고를 핀으로 들고 있다.)
    #
    # **왜 숫자가 아니라 0인가.** 상한을 떼고 완주시킨 run의 원장은 `input_tokens 510,732`지만
    # 그것은 **n=1 · 과제 하나 · 가장 작은 번들**의 값이고 Fake 경로는 `chars/token` 상수를 쓰는
    # 항등식이다(CLAUDE.md §5). 그 수에 여유를 곱해 적으면 **곱한 값이 추정치**가 되고 §0을 깬다.
    # 0은 이 파일의 기존 관용구이고(`gpu_seconds`·`tool_seconds`가 먼저 그렇게 쓴다) **위험한
    # 쪽은 로드 가드가 막는다** — 실모델을 서빙하는 프로필이 0이 든 예산을 쓰면 거부된다
    # (`_check_real_serving_limits_are_positive`). 그래서 이 프로필에서 0은 「무제한」이 맞다.
    #
    # ⚠ **임대 GPU의 상한은 여기가 아니다.** 돈에 가장 가까운 것은 `default`의 `gpu_seconds`이고
    # 그 값은 이 변경(2026-10-03 — 이 `dev_fake` 예산을 들여온 PR)이 건드리지 않는다.
    # ⏵ 2026-10-05 — `default.gpu_seconds`는 그 뒤 두 번 올라 7,200,000이다(위 `default` 줄 주석).
    input_tokens: 0
    output_tokens: 0
    gpu_seconds: 0
    # Fake 런타임의 도구 시간은 애초에 청구되지 않는다(`RunContext.call_tool`) — 잴
    # 컨테이너가 없고, 그 시간은 하네스가 자기를 잰 값이다. 0은 "상한 없음"이라는 기존
    # 관용구다(`BudgetLedger._overrun`). 이 예산을 쓰는 것은 `tool_runner: fake`인 프로필뿐이다 -
    # 실컨테이너 dev 프로필은 아래 `dev_container`다(이슈 #436 · 로드 가드가 지킨다).
    tool_seconds: 0

  # 실컨테이너를 도는 dev 프로필(`dev_docker`·`dev_hybrid_docker`·`dev_singularity`)의 예산(이슈 #436).
  # 모델은 Fake라 토큰·GPU의 0은 `dev_fake`와 같지만, 도구는 **진짜 컨테이너**라 `call_tool`이 시간을
  # 청구한다 - 그래서 `tool_seconds`만 양수다. **정한 값이지 잰 값이 아니다(§0)**: `default`의 잠정치와
  # 같은 수를 빌렸고 목적은 폭주 차단 하나다. `check_container_runtime_caps_tool_time`이 이 줄이
  # 0이 되는 것을 로드에서 막는다.
  dev_container:
    input_tokens: 0
    output_tokens: 0
    gpu_seconds: 0
    tool_seconds: 18000

thresholds:
  # 4단계 Scout 승격 기준 (architecture.md §3). 신호 없는 접두의 폴백 경로값(서빙 Scout v4는 신호로 판정 — 이슈 #91 닫힘 2026-10-12). 값은 안 잰 초기값이다.
  scout_threshold: 0.5

  # Progressive Context Expansion 상한 (knowledge-base.md §5, 초기값 3) — 이슈 #92.
  # 초과하면 후보를 폐기하지 않고 queued로 둔다.
  # ⏵ 2026-10-13 - 이 값을 읽는 정책 결정점(`policy._capsule_expansion`)은 있으나 러너가 부르는 곳이
  # 없다(ADR 0012 결정 6이 확장을 `max_hops` 루프로 대체) - 어느 run도 이 값에 좌우되지 않는다.
  # 그래서 doctor의 「실측 전 초기값」 목록에서 뺐다(이슈 #78). 키와 결정점의 삭제는 별 작업이다.
  capsule_expansion_max: 3

  # need_evidence 루프 상한 — Scout가 NE 신호를 낸 뒤 같은 세션에서 되물을 수 있는 최대
  # 홉 수(ADR 0012 결정 6 — 위 capsule_expansion_max를 대체한다. 이슈 #92). 0이면 루프가
  # 꺼진다. **명세값이고 이 하네스에서 안 쟀다** — cli.PROVISIONAL_THRESHOLDS에 있다.
  # ⏵ 2026-10-03 — **Auditor 도구 루프는 전용 상한 `thresholds.auditor_tool_hops`를 쓴다. 이 값이
  # 아니다** — 여기를 올리면 Scout 되묻기·`cli estimate`의 `scout_calls`까지 같이 움직인다(이슈 #419).
  # ⏵ 2026-10-06 — 8단계 PoV 툴 루프(`_run_pov_hops`)도 전용 상한 `pov_tool_hops`(아래)를 받았다
  # (이슈 #511). 이 값을 0으로 내려도 PoV 산출이 안 꺼진다.
  max_hops: 3

  # Auditor 도구 루프의 **전용** 상한(이슈 #419). 조사 홉은 hop 0..값-1이고 hop 값은
  # `answer`여야 한다 — 모델 호출은 후보당 최대 `1 + 이 값`회다(`nodes/auditor._run_hops` ·
  # `cli estimate`의 `auditor_calls`). 0이면 루프가 꺼지고 한 방 Finding 판으로 돈다.
  #
  # ⚠ 위 `max_hops`가 **아니다.** 거기를 올리면 Scout 되묻기와 `cli estimate`의 `scout_calls`가
  # 같이 움직인다.
  #
  # 이 값과 배선된 프롬프트 판은 **같은 말을 해야 한다** — 양수인데 판이 `Finding`을
  # 선언하거나, 0인데 판이 루프 봉투(`AuditorAction`·`AuditorProcedureAction`·⏵ 2026-10-09 v11의
  # `AuditorProcedureNullableCweAction`)를 선언하거나,
  # 루프 판이 meta `tools`를 안 들면
  # `nodes/auditor.loop_problem`이 run과 doctor를 같은 문장으로 막는다(한쪽만 통과하는
  # 설정이면 통과한 run이 첫 Auditor 호출에서야 선다 — 그 앞 단계의 GPU 시간 뒤다).
  #
  # **16은 실험팀·사용자 판단으로 받은 값이고 이 하네스에서 안 쟀다(§0).** 홉당 usage는
  # 0 관측이고, 실측 근거는 `auditor_hop` trace가 처음 돈 run에서 만든다.
  # 🔴 **창이 드는지도 미실측이다.** 계산값으로만: 입력 몫 196,608토큰(vast 창 262,144 −
  # 출력 상한 65,536)인데 글자/토큰 최악 비 1.22에서 `lookup` 관측 16개만 196,736이라
  # hop0를 빼고도 넘는다(`nodes/auditor.py`의 `_LOOKUP_MAX_CHARS` 주석이 그 셈을 든다).
  # 낙관 비 3.28이면 16홉 합이 73,184로 든다. 어느 쪽인지는 돌려 봐야 안다 — 넘으면 서버가
  # 크기로 거절하고 그 예외는 안 흡수한다.
  # 🔴 **run 입력 예산 `default.input_tokens`도 다시 안 쟀다 — 아래는 계산값이고 실측이 아니다**
  # (이 계산은 올리기 전 값 4,000,000 기준이다 — 2026-10-05에 40,000,000으로 올렸고 **같은 날
  # 둘째 인상으로 지금은 400,000,000이다**. 위 `default` 줄 주석). `BudgetLedger.charge`는 호출마다 서버가 센 `prompt_tokens` 전체를 더하고
  # (`cached_tokens`는 안 뺀다), 루프는 매 홉 prefix(system)와 hop0 user 턴(SOURCE·FACTS)을
  # `history` 맨 앞에 **다시** 싣는다(`nodes/auditor.py` 모듈 docstring). 후보 하나가 홉 h번을 쓰면
  # 입력은 `(h+1) × hop0 + 관측 누적`이다.
  # - hop0 ≈ 30,924토큰: prefix 33,209자(`prompts/auditor/v8/prefix.md`를 센 글자 수 —
  #   `tests/test_auditor_prompt_v8.py`가 핀으로 든다) ÷ 3.04(#349의 글자/토큰 중앙 비) ≈ 10,924
  #   + SOURCE 상한 20,000(아래 `auditor_source_tokens` — entry 함수는 그 밖이라 더 클 수 있다.
  #   FACTS의 근거 본문은 안 셌다).
  # - ⏵ 2026-10-06 서빙 판이 v9가 됐고 **2026-10-07에 v10이 됐다**(배선 · PR #521). prefix 글자 수는 **실측**으로
  #   v8 33,209 · v9 35,501 · v10 **56,906**이다(`load_prompt(...).prefix`의 길이를 이 저장소에서
  #   쟀다 — 전 판의 「v8보다 1,815자」는 틀린 수였다). v10은 v8보다 **+23,697자**, v9보다
  #   +21,405자다. 같은 3.04로 나눈 **계산값**으로는 hop0 ≈ 18,719 + SOURCE 상한 20,000 = 약
  #   38,720토큰이고 v8 기준 30,924의 1.25배다. **아래 후보당 수는 v8 기준이고 다시 안 셌다.**
  #   ⚠ **이 수는 `tests/test_auditor_prompt_v10.py`가 핀으로 든다** — v10 산문을 고치면 그 검사가
  #   빨개지고, 그때 이 주석과 아래 자리들을 같이 고친다. 핀을 둔 이유는 이 수가 **한 세션에서
  #   두 번 낡았기 때문이다**(산문을 고치고 다시 재지 않았다).
  #   가드 블록은 SOURCE에 붙는 몫이라 따로 안 셌다(미실측).
  # - ⏵ 2026-10-09 — 서빙 판은 **v11**이다(이슈 #525 — v10 + no_signal의 `cwe`를 null로 내라는 서술 네 줄).
  #   prefix 56,872자로 v10보다 34자 짧다(`load_prompt(...).prefix`의 길이 — 실측). 위 v10 계산값을
  #   다시 안 셌다 — 34자는 같은 3.04로 약 11토큰(계산값)이다.
  # - ⏵ 2026-10-10 — 서빙 판은 **v13**이다(이슈 #67 — v11 + FACTS에서 `source` 사본을 뺀다). prefix는 v11에서
  #   한 조각만 빠졌다(`tests/test_auditor_v13_facts.py`). 위 v10 계산값을 다시 안 셌다.
  # - ⏵ 2026-10-11 — 서빙 판은 **v14**다(이슈 #67 — v14 = v12 + FACTS에서 `source` 사본을 뺀다(봉투는 v12의 `AuditorProcedureAuditAlwaysAction`)). 위 계산값을 다시 안 셌다.
  # - 🔴 **그 hop0 수들은 SOURCE를 한 번만 센다 — hop0 user 턴은 SOURCE를 두 번 싣는다.**
  #   `prompts/auditor/*/body.md`가 `{{SOURCE}}`와 `{{FACTS}}`를 둘 다 두고 `build_facts`가
  #   FACTS에 `source`를 싣는다(`prompt_loader`). 2026-10-06 적대적 검토가 렌더 결과에서 센티널이
  #   2회 나오는 것을 봤다. 그래서 v8의 30,924와 v10의 약 38,720은 **둘 다 SOURCE 상한 하나(20,000)
  #   만큼 낮다** — 같은 잣대라 1.25배 비(比)는 서지만 **절댓값과 아래 후보 수는 과소다.**
  #   고쳐 세지 않은 것은 그 수의 원천이 v8 기준이라서다(위 줄) — 다시 셀 때 둘을 같이 센다.
  #   ⏵ 2026-10-10 — **서빙 판 v13은 SOURCE를 한 번만 싣는다**(meta `facts_source: false` — FACTS에 `source`가
  #   없다, 이슈 #67). 위 「두 번」은 v12 이하(v13·v14 제외)의 것이다. 위 수들은 다시 안 셌다 — SOURCE를 한 번 센 그 수가
  #   v13의 SOURCE 몫에는 맞는 쪽이 됐지만 prefix·나머지 몫은 v8 기준 그대로다.
  #   ⏵ 2026-10-11 — 서빙 판 v14도 같다(`facts_source: false` — v12 + FACTS `source` 제거).
  #   ⏵ 2026-10-13 — 서빙 판 v15도 같다(`facts_source: false` · body는 v14와 바이트 동일). prefix는 계약 문장 여섯만
  #   다르다(`docs/agent-contracts.md` §2.2 「v14 → v15」) — 위 hop0 수를 다시 안 셌다.
  #   ⏵ 2026-10-14 — 서빙 판 v16도 같다(`facts_source: false` · body는 v15와 바이트 동일). prefix는 다섯 군데만 더 든다(입력 맥락 함수 서술 · 쓰기 창 표지 줄) — 다시 안 셌다.
  #   ⏵ 2026-10-14 — 서빙 판 v17도 같다(body는 v16과 바이트 동일 · prefix는 두 군데 — `FACTS.slice_state` 서술 · 「배너 없으면 첫 블록 하나」 정정) — 다시 안 셌다.
  # - 16홉을 다 쓰면 17호출 × 30,924 ≈ 525,700토큰/후보. 거기에 `lookup` 관측이 매번 15,000자
  #   (`_LOOKUP_MAX_CHARS`, 위 낙관 비 3.28이면 4,574토큰)로 오면 홉 k의 요청에 k개가 쌓여
  #   136 × 4,574 ≈ 622,100이 더해진다 → 약 1,147,800토큰/후보(어시스턴트 턴 열여섯은 안 셌다).
  # - 4,000,000 ÷ 525,700 ≈ 7.6 · ÷ 1,147,800 ≈ 3.5후보 — scout·critic 몫을 빼기 전이고 후보마다
  #   16홉을 다 쓴다는 가정이다. 한 방 판이면 같은 한도가 hop0 한 번씩으로 약 129후보다. 넘으면
  #   `BudgetExhausted`로 run이 부분 결과로 끝난다. 모델이 일찍 `answer`하면 이보다 훨씬 적다 —
  #   홉 수 분포는 0 관측이다. **예산 값은 2026-10-05에 사용자 결정으로 10배로 올렸다**(40,000,000이면
  #   ÷ 525,700 ≈ 76 · ÷ 1,147,800 ≈ 34.8후보, 한 방 판이면 약 1,293후보 — 같은 계산값이고 실측이
  #   아니다). ⏵ **같은 날 둘째 인상으로 입력 상한은 지금 400,000,000이다** — 같은 식으로
  #   **÷ 525,700 ≈ 761 · ÷ 1,147,800 ≈ 348후보**다(계산값). 돈에 가장 가까운 `gpu_seconds`도
  #   72,000을 거쳐 **지금은 7,200,000이다** — 위 `default` 줄 주석.
  # - **이 수들은 상한 쪽 계산값이다 — 오차는 대체로 위(과대)로 난다.** ⚠ ⏵ 2026-10-06 — 그 방향
  #   판단은 **hop0를 v8로 센 수에서 나왔고 서빙 판이 v10이 되면서 다시 도출하지 않았다**:
  #   prefix가 +23,697자라 계산값 hop0가 +7,795토큰 커진다. 과대 쪽이라는 결론이 그 수로도 서는지는
  #   안 봤다. SOURCE 20,000은 통상값이
  #   아니라 상한이고(대부분은 더 작다), 위 「16홉을 다 쓴다」도 가정이다. 다만 엄밀한 천장은
  #   아니다: 3.04는 C 코드 SOURCE에서 잰 비라 영어 prefix에 맞지 않을 수 있고(`config/models.yaml`의
  #   「영어 텍스트의 비를 4 아래로 묶은 실측이 없다 · v3 스모크의 2.29 이상」 — 2.29면 hop0는
  #   33,209 ÷ 2.29 + 20,000 ≈ 34,502, 계산값), entry 함수는 SOURCE 상한 밖이다.
  # ⚠ `cli estimate`는 이것을 못 센다: `_estimate`는 `캡슐 토큰 × 자리 수 + prefix × 호출 수`이고
  # prefix가 역할 평균(`harness_pool`에서 5,253토큰 — `len//4`의 계산값이고 c2bdac1에 PoV v4 prefix
  # (10,214자)를 올린 상태다. c2bdac1 자체는 5,042이고 옛 값 4,481은 낡았다. prefix가 바뀌면 움직인다)
  # 이라 Auditor 호출을 홉마다 약 5.3k로 센다. SOURCE(한 방일 때도 안 센다)와 홉마다의 hop0 재전송·관측 누적이 빠져 **루프를 켠
  # 뒤 과소추정**이다. 고치지 않았다(별 작업).
  auditor_tool_hops: 16

  # queued 후보의 재평가 횟수 상한. 새 Evidence가 들어올 때마다 무한히 재평가하면
  # 토큰이 샌다. 초과 시에도 폐기하지 않고 queued를 유지하며 사유 코드만 남긴다.
  requeue_max: 2

  # 7단계 Critic에 올릴 상위 Finding 수. Critic은 가장 비싼 단계이므로 상한이 있어야 한다
  # (architecture.md §3 "상위 Finding만").
  critic_top_n: 8

  # 8단계에서 `validated` **밖의** Finding 중 PoV를 더 시도할 수 상한. **0은 종전 동작이고
  # 미실측 표시가 아니다** — PoV는 8단계에 `VALIDATED`로 들어온 Finding만 돈다.
  #
  # 풀은 「Critic이 밀어 내지 않은 Finding」이다 — Critic이 반박으로 판정한 것과 판정 호출이
  # 실패해 버려진 것은 뺀다(`runner._pov_targets`). ⏵ 2026-10-11 — 보류(`need_evidence`)는 이제 들고
  # 정렬·최종 지정에서 uphold, 미경유, 보류 순이다(최종 지정은 같은 `vul` 응답 코드 계단 안에서 -
  # ⏵ 2026-10-14 #637 · 이슈 #604 · ⏵ 2026-10-12 — 미경유를 uphold와
  # 갈라 그 사이에 뒀다, (b)의 순서). 드는 것은 Critic을
  # 안 거친 Finding(`critic_top_n`에 잘린 것 · 6단계가 E0로 `QUEUED`한 것)과 재현 명세가 없어
  # `hypothesized`에 멈춘 것(F-9) 등이다.
  #
  # ⚠ 이 필터는 반박된 Finding의 PoC가 최종 제출이 되는 것을 막지만, **이 기능이 처음 겨냥한
  # run의 풀은 바꾸지 않는다.** 그 run(`run_20261003_0003`)의 Finding 셋은 Critic을 안 거쳤고
  # 전부 Auditor가 스스로 낸 부정 결론이다(`trigger_status=no_signal` · `confidence`
  # 0.10·0.10·0.05 · `docs/experiments/harness/2026-10-04-cybergym-operational-run-vastai-
  # remote.md` §4). 풀은 그것을 거르지 않는다(결정 대기) — 그런 Finding에서 PoV가 낼 PoC가
  # 있는지는 **미측정**이다.
  #
  # 왜 상한이 생겼나. 2026-10-03 첫 실모델·실도구 run은 완주했는데 PoV가 **0건**이었다 —
  # Finding이 인용한 Evidence가 없어(모델이 인용하지 않았다 — 이슈 #475 정정) 전부 E0로
  # 6단계가 `QUEUED`에 내렸고 재현 명세도 없어(Level 1은 그 근거를 안 준다) 8단계 진입
  # 시점에 `validated`가 비어 있었다. PoV를 안 돌리면 PoC가 없고 PoC가 없으면 채점 점수가
  # 없다. 그래서 `validated` 밖에서도 상위 몇 건은 시도할 수 있게 뚫었다.
  #
  # **켤 때의 값은 미실측이다(§0).** ⏵ 2026-10-06 — 후보 **하나**는 쟀다: PoV 좌석 프로브의
  # find_0001이 4홉 · 약 5,233 s · 출력 92,543 · 입력 242,717토큰이고 **홉 상한에 끊겼다**(`max_hop` —
  # 아래 `pov_tool_hops`가 이 값을 든다). 못 잰 것은 **모델이 스스로 서기까지의 홉·토큰·벽시계**다 —
  # 그 프로브에 자발 종료가 0회였고, 같은 run의 다른 finding은 hop0이 61초였다(n=2).
  # 지금 가진 것은 그 하나와 PoV가 0건이던 run뿐이라 거기서 풀 상한을 유도하면 지어낸 근거가 된다
  # (위 `candidate_max`가 쓰는 논법과 같다).
  # 🔴 ⏵ 2026-10-05 — **0에서 8로 켰다(사용자 결정).** 0이면 PoV가 `validated`만 도는데
  #   `synthesize_repro_spec`이 꺼져 있던 동안 `validated`가 늘 비어서 **PoV가 한 건도 안 돌았고
  #   PoC가 0건이라 채점이 시작조차 안 됐다.** 위 「켤 때의 값은 미실측이다」는 맞지만, 0은
  #   미실측이 아니라 **「안 돈다」가 확정된 값**이다 — 재려면 먼저 켜야 한다.
  #   8은 `critic_top_n: 8`과 같게 맞춘 값이다(계산값 — Critic이 본 Finding 전부를 PoV 풀이
  #   덮는다. ⏵ 2026-10-11 — 반박과 판정 호출이 실패해 버려진 것(`critic_failed_ids`)은 풀에서
  #   빠지므로 「전부」는 그 둘이 아닌 것에 한한다, 이슈 #604. ⏵ 2026-10-12 — 풀은 Critic 미경유
  #   Finding도 담고 uphold → 미경유 → 보류 순으로 자르므로 합이 8을 넘으면 보류가 `rest[:8]`
  #   밖으로 밀린다 — 「전부 덮는다」는 합이 8 이하일 때만 선다).
  #   `pov_tool_hops: 16`이라 finding당 1+16홉 -> PoV 모델 호출 최대 136회(계산값).
  #   ⏵ 2026-10-12 — 파싱 실패 재질문(#550)도 홉 하나라 이 136은 **그대로**다(홉 수는 안 는다).
  #   다만 한 호출 안에 어댑터 시도가 `schema_retries + 1` = 2회라(아래) 비절단 체계적 파싱 실패면
  #   생성은 최대 136 x 2 = 272회(계산값)이고, 전 시도가 `length`면 재질문 없이 서므로 이 합이 아니다.
  #   미실측: 후보가 **스스로 서기까지의** 홉·토큰·벽시계 0건(잰 한 건은 홉 상한에 끊겼다 - 위).
  #   `default.gpu_seconds`는 **7,200,000**이고 ⏵ **PoV
  #   폭주를 먼저 묶는 것은 `output_tokens`다**(위 `default` 주석의 「실효 상한」 단락).
  pov_attempt_top_n: 8

  # 8단계 PoV 툴 루프의 **전용** 홉 상한(이슈 #511). 모델 호출은 finding당 최대 `1 + 이 값`회다
  # (`runner._run_pov_hops`). 0이면 hop0(gen) 뒤 곧장 MAX_HOP이라 submit이 없다. 필드 기본이 없다 —
  # 값은 여기만 든다(`Thresholds.pov_tool_hops`).
  #
  # **16은 사용자 결정이다**(조민규, 2026-10-06). PoV가 `max_hops`에서 물려받던 3에서 올렸다 — 2026-10-06
  # 프로브가 `stop_reason: max_hop`으로 끊겼고 모델이 매 홉 PoC를 키우는 중이었다(#511). 16은
  # `auditor_tool_hops`와 **같은 수**이고 창 산수의 보수적 바닥(약 12홉)을 막 넘는다(계산값).
  # ⚠ **효과는 미실측이다** — 16으로 돈 run이 0건이라 `cli.PROVISIONAL_THRESHOLDS`에 남는다.
  # ⚠ **올려도 submit이 난다는 보장은 없다.** ⏵ 2026-10-09 — 이 경고의 **근거가 바뀌었다**:
  # 전에는 「도구 관측이 PoC의 함수가 아니라 홉이 늘면 무신호 되먹임을 더 읽는다」였는데
  # ADR 0014가 `poc` 도구를 과제 `-vul` 이미지로 바꿔 **그 도구의 관측은 PoC의 함수가 됐다**.
  # 남는 근거는 둘이다 — ① `inspect` 홉의 `asan`·`gdb`·`build`는 여전히 아니다(이슈 #507)
  # ② 🔴 **홉마다 채점기에 제출하므로 홉이 늘면 레이트리미트(20회/60초)에 먼저 박는다**
  # (`rate_limited`는 이미 지정을 죽이는 사유다). 효과는 **여전히 미실측이다** — 16으로 돈 run이 0건.
  #
  # ⏵ 2026-10-12 — **파싱 실패 재질문(#550)은 홉을 쓴다**: 모델 호출은 여전히 finding당 최대
  # `1 + 이 값`회다(홉 수는 안 는다). 한 호출 안에 어댑터 시도가 `schema_retries + 1` = 2회라
  # 비절단 체계적 파싱 실패는 최대 (1+16) x 2 = 34회 생성한다(계산값 — 실측 아님, 그런 run은 0건).
  # 모든 시도가 `finish_reason == "length"`로 끝난 실패는 재질문 없이 그 홉에서 선다. 연속 파싱 실패
  # 횟수의 상한은 없다 — 이슈 #613. **이 값 16은 이 변경으로 바꾸지 않았다.**
  #
  # **비용은 시간이다.** 홉 벽시계가 네 홉 모두 `출력 토큰 ÷ 17.24~18.06 tok/s`이고 평균 21.8분이다
  # (2026-10-06 PoV 좌석 프로브 실측, n=1 — 한 finding의 네 홉). 🔴 **아래는 상한이지 예상 시간이
  # 아니다** — 모델이 `submit`하거나 이미 낸 PoC를 다시 내면(`REPEAT_SPEC`) 그 자리에서 서므로 더
  # 짧다. 상한 N이면 run 하나의 **최대**가 `8 × (1+N) × 21.8분`이다(계산값 — N=16이면 약 49시간 ·
  # N=3이면 약 11.6시간). ⚠ **모델이 몇 홉에 서는지는 미실측이다** — 자발 종료 관측이 **0회**다
  # (그 프로브의 finding은 네 홉 모두 돌고 `max_hop`에 걸렸다). 그 칸은 `docs/build-plan.md`의
  # 미실측 표에 있다. ⚠ 같은 run의 다른 finding은 hop0이 61초였다(n=2) — 홉 시간도 finding마다 다르다.
  # ⚠ **창이 안 닿는다는 결론은 그 프로브로 안 갈렸다** — 홉당 입력 증가 +89/+183/+300이 선형이면
  # 약 561홉, 배가면 약 12홉이 든다(둘 다 계산값). 🔴 **배가 쪽이 맞으면 16은 창에 닿는다** — 그때는
  # `CONTEXT_OVERFLOW`로 그 finding만 흡수되고 마지막 PoC는 남지만 **submit 없이 끝난다**(#511과 같은
  # 증상, 다른 사유). 그 프로브는
  # 그 프로브는 `tool_runner: fake`라 관측 꼬리가 없었다 — 실도구면 홉당 약 731토큰이 더 붙는다
  # (계산값). **16으로 처음 도는 run이 그 창 측정을 겸한다** — 홉별 `input_tokens`를 보면 선형인지
  # 배가인지 갈린다. ⚠ 창은 GPU를 더 빌려도 안 늘어난다(모델 `context_limit` 262,144가 천장이다).
  # 수치와 그 한계는
  # `docs/experiments/harness/`의 2026-10-06 PoV 좌석 프로브 보고서(PR #512) §1·§8.
  #
  # ⚠ **`max_hops`를 대신 올리지 않는다.** 그 값은 Scout 되묻기(`runner._run_ne_hops`)와 `cli estimate`의
  # `scout_calls = candidates * (1 + max_hops)`를 읽는다 — 올리면 둘이 같이 움직인다.
  pov_tool_hops: 16

  # 한 run이 4단계(Scout)에 올릴 target 수 상한 (W2).
  #
  # 후보 단위가 파일에서 심볼로 바뀌면서 필요해졌다. zlib은 분석 대상 artifact 32건이
  # 함수 수백 개가 된다. 초과분은 **버리지 않고** trace의 `target_skipped`에
  # `over_candidate_max`로 남기고, 건수는 run 경고와 report.md에도 올린다 — 안 만들어진
  # 후보가 흔적 없이 사라지면 정적 신호를 게이트가 아니라 순서로 쓰기로 한 결정((a′))이
  # 뜻을 잃는다.
  #
  # **이 값은 잠정치다. 실측이 아니다.** 후보 1건당 토큰·시간을 한 번도 재지 않았고,
  # 그 측정의 입력이 이 변경 뒤의 zlib 급 실대상 1회 run이다. 지금 가진 것은 파일 단위
  # 후보 32건짜리 run뿐이라 거기서 상한을 유도하면 **지어낸 근거**가 된다
  # (위 `tool_seconds`가 #65에 대해 쓰는 논법과 같다).
  # ⏵ 2026-09-24 — 위 「한 번도 재지 않았고」·「32건짜리 run뿐」은 2026-08-23에 거짓이 됐다. 그날
  # 바로 그 zlib run이 돌았고(후보 256건) 2026-08-25 run이 542건 전량으로 후보 1건당 값을 냈다
  # (`docs/experiments/harness/`의 두 날짜 zlib 편). **값은 그대로다** — 두 run 다 scout만
  # 실서빙이었고 확정은 실서빙 auditor run 뒤로 미뤘다(이슈 #97).
  # ⏵ 2026-10-12 — 그 run이 있었다(10-11 보고서 §4). 값은 그대로이고 정한 값이다(이슈 #97 닫힘).
  #
  # 256을 고른 유일한 이유는 **(이슈 #71로 제거된) `queue_maxsize`가 쓰던 값**을 재사용해 새
  # 숫자를 지어내지 않기 위해서였다 — **근거가 아니라 관례다.** 그전까지 이 값의 목적은
  # 폭주 차단 하나다.
  candidate_max: 256

  # 구조화 출력 파싱 실패 시 재요청 횟수 (agent-contracts.md §1의 token_budget.retries).
  # 한도를 넘기면 후보를 queued로 두고 schema_parse_failed로 기록한다. 이 값을 올리면
  # "스키마 파싱 실패율"(evaluation.md §5.1)의 분자·분모가 함께 커지므로(재시도가 늘면
  # 시도 수 `attempts`가 는다) 조건 간 비교에서 고정해야 한다. **재시도를 늘리면 실패율이
  # 낮아진다는 옛 직관은 새 정의에서 성립하지 않는다** — 분자가 '일어난 실패'라 오히려 는다(#83).
  schema_retries: 1

  # 모델 게이트웨이 요청 하나의 **출력 토큰 상한**. `openai_compat._request_payload`가
  # `"max_tokens"`로 싣는다.
  #
  # ⚠ ~~팀 2x2 스펙 고정값은 8,192이고 이 값은 거기서 벗어난다 (2026-08-28)~~
  # → **2026-09-01 팀 2×2 전량 폐기로 이 제약은 소멸했다.** 그때는 스펙이 묶은 값을
  # 한 사람이 바꾸는 것이라 절차 문제였고, 지금은 아니다. 근거는 아래 "왜 4,096인가"에
  # 있고, 되돌릴 자리는 여전히 아래 한 줄이며 캡슐 예산 주석의 역산 숫자만 함께 고치면 된다.
  #
  # **이 값이 없으면 상한도 없다.** 지금까지 payload에 `max_tokens`가 없었고, 그러면 서버는
  # `--max-model-len`까지 생성할 수 있다. 2026-08-27 ATOM에서 30B가 실제로 폭주해 클라이언트
  # 타임아웃(300초)이 났다 — `openai_compat._TIMEOUT_S`가 걸리는 자리다. 상한의 목적은
  # 그 폭주 차단이지 정상 응답을 자르는 것이 아니다: 8/27 track_a run의 `model_call`
  # `output_tokens` **최대**가 auditor 2,424(성공 호출 — `run_20260827_0002` seq=1707,
  # `ok=true`)다. 평균(≈189)이 아니라 **관측 최대**가 상한을 정한다 — 2,000이었으면 그
  # 성공 호출이 잘려 파싱 실패로 뒤집혔을 값이다.
  #
  # **왜 4,096인가 (2026-08-28, 8,192에서 내림).** 근거는 헤드룸이 아니라 **폭주가 먹는
  # 시간**이다. 헤드룸만 보면 8,192가 낫다(2,424의 3.4배 대 1.7배).
  #
  #   `run_20260828_0002`는 869초를 돌았는데 그중 **792.6초(91.2%)가 실패한 model_call
  #   5건**이다. 서빙 로그의 생성 속도가 63 tok/s이므로 상한까지 폭주하면 1회에
  #   `8192 ÷ 63 ≈ 130초`이고 `schema_retries: 1`이라 실패 하나가 2회를 태운다 — critic
  #   하나가 실제로 288,959 ms를 먹었다. **run 시간의 지배 항이 폭주이고 그 항이 상한에
  #   정비례한다.** 4,096이면 그대로 절반이 된다.
  #
  # **타임아웃은 부차적 근거다. 계산을 조심해야 한다.** `_TIMEOUT_S = 300`은 `_post`의
  # `urlopen` **호출 하나당**이고 `model_call.wall_ms`는 재시도까지 감싼 값이라, 288,959 ms를
  # 300초와 직접 비교하면 안 된다(시도 하나는 약 144초였다). 시도 하나가 300초를 넘으려면
  # 8,192에서는 생성이 27.3 tok/s 아래로, 4,096에서는 13.7 tok/s 아래로 떨어져야 한다 —
  # 관측 63 tok/s 대비 여유가 2.3배에서 4.6배가 된다. 출력 상한을 넣게 만든 300,005 ms는 상한이 **아예
  # 없어** 한 시도가 `--max-model-len`까지 간 경우이고, 8,192가 실린 뒤로는 출력 길이만으로
  # 그 벽에 닿지 않는다.
  #
  # ⚠ **2026-09-24 — 위 문단의 「4,096에서는 13.7 tok/s 아래로 떨어져야 한다」가 새 로스터에서 일어났다.**
  # 그 여유(4.6배)는 옛 30B의 63 tok/s 기준이었다. ATOM 스모크(실서빙 키 `checksum` 0이라 비교표 밖)의
  # 단일 요청 생성 속도가 `seccoderx-8b` **13.3** · Qwen3-14B **8.1** tok/s다(서버 로그 10초 창 중앙값).
  # (⏵ 2026-10-14 — `seccoderx-8b`는 로스터에서 내려왔다. 13.3은 그때의 실측 기록이고 지금 Scout
  #  세 자리는 `qwen3-14b` 하나다 — 그 좌석에 해당하는 값은 8.1이다.)
  # Qwen3-14B는 registry 밖이고, PR #260의 ADR 0012 결정 4가 injection 잠정으로 둔 후보다. §1의 injection인
  # `deepseek-r1-distill-qwen-32b`는 안 쟀다. (⏵ 같은 날 뒤 — injection이 `qwen3-14b`로 확정돼 registry·§1에 올랐고
  # (PR #266) `deepseek-r1-distill-qwen-32b`는 지웠다(PR #267). 8.1 tok/s는 그 키가 같은 revision으로 뜬 값이다.) 두 속도로 300초 안에 낼 수 있는 출력은 각각 ≈3,990 · ≈2,430토큰이다
  # (계산값, 프리필 제외) — **「출력 길이만으로 그 벽에 닿지 않는다」가 이 둘에서는 참이 아니다.** 실제로
  # `run_20260924_0001`이 `scout_boundary` 호출 하나의 300,021 ms 타임아웃으로 멈췄다(서버는 그동안 생성
  # 중이었다 — 끊은 것은 클라이언트다).
  # **같은 이유로 「폭주 비용은 상한에 비례한다」도 이 둘에서는 성립하지 않는다** — 폭주는 상한 전에 300초 벽에서
  # 끊기고, 그때 run 전체가 선다. 이 명제를 적은 자리는 셋이다: 위 「왜 4,096인가」의 「그 항이 상한에
  # 정비례한다」, 바로 아래 「폭주 자체는…」 문단의 「그 비용이 상한에 비례한다」, 그리고 더 아래 2026-09-12
  # 결론의 「상한을 올리면 그 폭주가 비례해 비싸진다」다. 덧붙여 둘 다 출력 토큰의 약 2/3가 사고 구간이다
  # (67% · 64% — 서버 로그 `output_token_ids`의 `</think>` 위치). **이 값은 여기서 안 바꾼다** — 선택지(타임아웃·
  # 역할별 상한·후보 단위 실패 처리)는 이슈 #261에 있다. `qwen3.6-35b-a3b`(26.2 tok/s)는 ≈7,860토큰까지
  # 들어간다(계산값). 원천은 `docs/experiments/harness/2026-09-24-roster-smoke-atom.md`다
  # (⏵ 2026-10-14 — 그 전까지 이 줄은 `config/models.yaml`의 `seccoderx-8b` 위 머리 문단을
  #  가리켰고, 그 키가 로스터에서 내려오며 항목이 없어져 보고서를 직접 적는다).
  # ⏵ 2026-09-26 — Auditor가 `qwen3.8-27b`로 바뀌어 위 26.2 tok/s·≈7,860토큰은 옛 모델의 값이다. 새 모델은
  # 외부 보고 4.5 tok/s라 4,096토큰도 ≈910 s(계산값)다. 그래서 그 모델 항목이 `request_timeout_s`를,
  # 아래 `output_max_by_role`이 Auditor 상한을 선언했다(사고를 켰다).
  # 같은 스모크(비교표 밖)에서 **한 번에 성공한 출력으로 2,878토큰이 관측됐다** — `seccoderx-8b`
  # `scout_boundary`(`cand_0023`), 사고 포함(trace `model_call`). 아래 2,863도 `gpt-oss-20b`의 추론+본문
  # 합이라(2026-09-12 문단) 둘 다 이 상한이 자르는 출력 전체로 잰 수다 — 같은 축에서 2,878이 크다.
  # 그 축으로 세면 아래 두 자리의 수가 바뀐다(계산값) — 「2026-09-12 —
  # 「관측 최대 2,424」가 깨졌다」 문단의 「2,863 · 여유 1,233 · 1.43배」가 「2,878 · 1,218 · 1.42배」가 되고, 2026-09-12
  # 결론의 「예산 판단에 쓰는 것은 둘 중 큰 2,863 … 1,233이 남는다」가 「2,878 … 1,218」이 된다. ⚠ 그 좌석에서는
  # 4,096보다 300초가 먼저 온다. 그 호출이 214.4 s였으니 타임아웃까지 남은 출력은 ≈1,140토큰이다(계산값).
  # ⏵ 2026-09-29 — 위 2026-09-24 문단의 「300초 벽」은 `seccoderx-8b`·Qwen3-14B가 요청 타임아웃을 선언하기
  #   전의 서술이다. 지금 두 키는 1,200 · 1,800 s를 선언하고(`config/models.yaml`, 계산값 — 미실측), 4,096을
  #   다 쓰는 데 걸리는 ≈308 · ≈506 s(순차 기준)가 그 안에 든다. 그래서 순차 요청에서는 두 키도 상한이 먼저
  #   오고, 「폭주 비용은 상한에 비례한다」가 다시 선다. 「그때 run 전체가 선다」도 #274(2026-09-25)부터는
  #   아니다 — 서버가 생성 중이던 타임아웃이면 그 후보만 버리고, 셋 연달아일 때 선다.
  #   ⏵ 2026-10-15 — 위 「두 키」·「1,200 · 1,800 s」·「≈308 · ≈506 s」는 `seccoderx-8b`가 로스터에 있던 때의 서술이다
  #   (1,200 s와 ≈308 s는 그 키의 몫이다). Scout 셋이 `qwen3-14b` 하나라 지금 키는 하나이고 1,800 s(`config/models.yaml`
  #   의 그 키 `request_timeout_s`, 계산값 — 미실측)이며 4,096을 다 쓰는 ≈506 s(순차 기준)가 그 안에 든다.
  #
  # **폭주 자체는 이 값으로 안 막힌다.** 8,192에서도 상한까지 갔다(16,139행 EOF, 이슈 #79).
