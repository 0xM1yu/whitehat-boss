  #   #432). 최저 16.03 ÷ 8.74 = 1.83배(계산값). ⚠ 긴 입력 효과는 못
  #   가른다 — 입력 22.4k 호출 17.22에서 37.9k 호출 16.61로 3.5% 낮은 한 쌍이 있으나 출력 길이가 섞여 있어
