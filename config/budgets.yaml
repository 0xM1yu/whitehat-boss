# run 단위 예산과 정책 임계값 (engineering-guide.md §8.5)
#
# 하드코딩 금지 — 임계값·예산·모델은 전부 여기서 온다. 노드는 이 값을 직접 비교하지 않고
# RoutingPolicy를 거친다(src/orchestrator/policy.py).
#
# evaluation.md §2.3 공정성 규칙: 모든 조건은 동일 예산에서 실행한다. 조건 간 차이는
# 프로필과 단계 활성화만이므로 thresholds·sampling·seed는 프로필과 무관하게 공통이다.
# 실제로 쓰인 값은 RunRecord.thresholds에 박제된다(evaluation.md §6).

budgets:
  default:
    input_tokens: 4000000
    output_tokens: 400000
    gpu_seconds: 7200
    # 컨테이너 도구(semgrep·clang-tidy·build·asan)의 run 전체 상한. GPU 예산과 나눈
    # 이유는 그 도구들이 GPU를 쓰지 않기 때문이다(schemas/run.py `Budget.tool_seconds`).
    #
    # **이 값은 잠정치다. 실대상 측정이 아니다.** 지금 가진 수치는 2026-08-17에 잰
    # 8,492 ms(x86_64/docker)와 4,491 ms(aarch64/podman)뿐인데 둘 다 대상이
    # `tests/fixtures/target`(파일 두 개짜리 장난감 parser.c)이다. 실제 저장소는 파일이
    # 서너 자릿수 많으므로 그 값에서 상한을 유도하면 **지어낸 근거**가 된다
    # (model-serving.md §5·bench.py 모듈 docstring의 같은 규칙: 지어낸 값은 미측정을
    # production으로 통과시킨다).
    #
    # **근거를 만드는 측정은 zlib 급 실대상 1회 run이다**(이슈 #65). 그전까지
    # 이 값의 목적은 폭주 차단 하나이고, 정상 run이 걸리지 않도록 넉넉히 둔다.
    tool_seconds: 1800

  dev_fake:
    # Fake 어댑터는 GPU를 쓰지 않는다. 예산 소진 경로(stopped_after)를 테스트에서
    # 태울 수 있도록 일부러 작게 잡는다.
    input_tokens: 200000
    output_tokens: 20000
    gpu_seconds: 0
    # Fake 런타임의 도구 시간은 애초에 청구되지 않는다(`RunContext.call_tool`) — 잴
    # 컨테이너가 없고, 그 시간은 하네스가 자기를 잰 값이다. 0은 "상한 없음"이라는 기존
    # 관용구다(`BudgetLedger._overrun`).
    tool_seconds: 0

thresholds:
  # 4단계 Scout 승격 기준 (architecture.md §3). 초기값이며 실측 후 확정 — 이슈 #91.
  scout_threshold: 0.5

  # Progressive Context Expansion 상한 (knowledge-base.md §5, 초기값 3) — 이슈 #92.
  # 초과하면 후보를 폐기하지 않고 queued로 둔다.
  capsule_expansion_max: 3

  # queued 후보의 재평가 횟수 상한. 새 Evidence가 들어올 때마다 무한히 재평가하면
  # 토큰이 샌다. 초과 시에도 폐기하지 않고 queued를 유지하며 사유 코드만 남긴다.
  requeue_max: 2

  # 7단계 Critic에 올릴 상위 Finding 수. Critic은 가장 비싼 단계이므로 상한이 있어야 한다
  # (architecture.md §3 "상위 Finding만").
  critic_top_n: 8

  # 한 run이 4단계(Scout)에 올릴 target 수 상한 (W2).
  #
  # 후보 단위가 파일에서 심볼로 바뀌면서 필요해졌다. zlib은 분석 대상 artifact 32건이
  # 함수 수백 개가 된다. 초과분은 **버리지 않고** trace의 `target_skipped`에
  # `over_candidate_max`로 남기고, 건수는 run 경고와 report.md에도 올린다 — 안 만들어진
  # 후보가 흔적 없이 사라지면 정적 신호를 게이트가 아니라 순서로 쓰기로 한 결정((a′))이
  # 뜻을 잃는다.
  #
  # **이 값은 잠정치다. 실측이 아니다.** 후보 1건당 토큰·시간을 한 번도 재지 않았고,
  # 그 측정의 입력이 이 변경 뒤의 zlib 급 실대상 1회 run이다. 지금 가진 것은 파일 단위
  # 후보 32건짜리 run뿐이라 거기서 상한을 유도하면 **지어낸 근거**가 된다
  # (위 `tool_seconds`가 #65에 대해 쓰는 논법과 같다).
  #
  # 256을 고른 유일한 이유는 **(이슈 #71로 제거된) `queue_maxsize`가 쓰던 값**을 재사용해 새
  # 숫자를 지어내지 않기 위해서였다 — **근거가 아니라 관례다.** 그전까지 이 값의 목적은
  # 폭주 차단 하나다.
  candidate_max: 256

  # 구조화 출력 파싱 실패 시 재요청 횟수 (agent-contracts.md §1의 token_budget.retries).
  # 한도를 넘기면 후보를 queued로 두고 schema_parse_failed로 기록한다. 이 값을 올리면
  # "스키마 파싱 실패율"(evaluation.md §5.1)의 분자·분모가 함께 커지므로(재시도가 늘면
  # 시도 수 `attempts`가 는다) 조건 간 비교에서 고정해야 한다. **재시도를 늘리면 실패율이
  # 낮아진다는 옛 직관은 새 정의에서 성립하지 않는다** — 분자가 '일어난 실패'라 오히려 는다(#83).
  schema_retries: 1

  # 모델 게이트웨이 요청 하나의 **출력 토큰 상한**. `openai_compat._request_payload`가
  # `"max_tokens"`로 싣는다.
  #
  # ⚠ ~~팀 2x2 스펙 고정값은 8,192이고 이 값은 거기서 벗어난다 (2026-08-28)~~
  # → **2026-09-01 팀 2×2 전량 폐기로 이 제약은 소멸했다.** 그때는 스펙이 묶은 값을
  # 한 사람이 바꾸는 것이라 절차 문제였고, 지금은 아니다. 근거는 아래 "왜 4,096인가"에
  # 있고, 되돌릴 자리는 여전히 아래 한 줄이며 캡슐 예산 주석의 역산 숫자만 함께 고치면 된다.
  #
  # **이 값이 없으면 상한도 없다.** 지금까지 payload에 `max_tokens`가 없었고, 그러면 서버는
  # `--max-model-len`까지 생성할 수 있다. 2026-08-27 ATOM에서 30B가 실제로 폭주해 클라이언트
  # 타임아웃(300초)이 났다 — `openai_compat._TIMEOUT_S`가 걸리는 자리다. 상한의 목적은
  # 그 폭주 차단이지 정상 응답을 자르는 것이 아니다: 8/27 track_a run의 `model_call`
  # `output_tokens` **최대**가 auditor 2,424(성공 호출 — `run_20260827_0002` seq=1707,
  # `ok=true`)다. 평균(≈189)이 아니라 **관측 최대**가 상한을 정한다 — 2,000이었으면 그
  # 성공 호출이 잘려 파싱 실패로 뒤집혔을 값이다.
  #
  # **왜 4,096인가 (2026-08-28, 8,192에서 내림).** 근거는 헤드룸이 아니라 **폭주가 먹는
  # 시간**이다. 헤드룸만 보면 8,192가 낫다(2,424의 3.4배 대 1.7배).
  #
  #   `run_20260828_0002`는 869초를 돌았는데 그중 **792.6초(91.2%)가 실패한 model_call
  #   5건**이다. 서빙 로그의 생성 속도가 63 tok/s이므로 상한까지 폭주하면 1회에
  #   `8192 ÷ 63 ≈ 130초`이고 `schema_retries: 1`이라 실패 하나가 2회를 태운다 — critic
  #   하나가 실제로 288,959 ms를 먹었다. **run 시간의 지배 항이 폭주이고 그 항이 상한에
  #   정비례한다.** 4,096이면 그대로 절반이 된다.
  #
  # **타임아웃은 부차적 근거다. 계산을 조심해야 한다.** `_TIMEOUT_S = 300`은 `_post`의
  # `urlopen` **호출 하나당**이고 `model_call.wall_ms`는 재시도까지 감싼 값이라, 288,959 ms를
  # 300초와 직접 비교하면 안 된다(시도 하나는 약 144초였다). 시도 하나가 300초를 넘으려면
  # 8,192에서는 생성이 27.3 tok/s 아래로, 4,096에서는 13.7 tok/s 아래로 떨어져야 한다 —
  # 관측 63 tok/s 대비 여유가 2.3배에서 4.6배가 된다. 출력 상한을 넣게 만든 300,005 ms는 상한이 **아예
  # 없어** 한 시도가 `--max-model-len`까지 간 경우이고, 8,192가 실린 뒤로는 출력 길이만으로
  # 그 벽에 닿지 않는다.
  #
  # **폭주 자체는 이 값으로 안 막힌다.** 8,192에서도 상한까지 갔다(16,139행 EOF, 이슈 #79).
  # 상한이 정하는 것은 "폭주가 얼마나 비싼가"이고, 그 비용이 상한에 비례한다.
  #
  # **대가를 적어 둔다: 여유가 3.4배에서 1.7배로 준다.** 2,424보다 큰 정상 응답이 나오면
  # 잘려 파싱 실패가 된다 — 이슈 #79의 (c)가 지목한 "정상 응답이 잘리는 경우"이고, 그때는 역할별
  # 상한이 다음 수다.
  #
  # **2026-09-12 — 「관측 최대 2,424」가 깨졌다.** 이 문단은 *"지금까지 관측된 성공 출력이
  # 2,424를 넘은 적은 없다"*로 닫고 있었는데, ATOM에서 gpt-oss-20b Critic을
  # `DecisionDraft`로 18시행 돌린 실측의 `completion_tokens`가 **min 549 · median 1,051 ·
  # max 2,863**이다. **2,863은 성공한 출력이다** — `finish_reason=length` 0/18 · JSON 유효
  # 18/18이다. 그러므로 여유는 이 문단이 적은 **1.7배가 아니라 1.43배**(4,096 − 2,863 =
  # 1,233)다.
  #
  # ⚠ **2,863의 원천은 아직 이 저장소에 없다.** 그것을 실은
  # `docs/experiments/harness/2026-09-12-critic-decisiondraft-budget-atom.md`가 PR #182와
  # 함께 들어오고, 그전까지 이 수는 **`git grep`으로 이 주석과 `agent-contracts.md`
  # 두 자리밖에 못 여는 상태다**. 뒤집히는 쪽인 2,424는 그렇지 않다 —
  # `run_20260827_0002`의 auditor 호출 하나이고
  # `docs/experiments/harness/2026-08-29-prompt-v2-smoke-atom.md` §"출력 상한"이 그 run ID를
  # 들고 있다. **비대칭을 적어 두는 이유**: 이슈 #157이 정확히 이 결함 클래스다(실재하지
  # 않는 출처를 근거로 인용한 자리). 보고서가 머지되면 이 문단을 그 파일 링크로 바꾼다 —
  # 같은 메모가 `docs/agent-contracts.md` §1의 `output_max` 인용에도 있고 **둘 다 고쳐야
  # 한 건이 끝난다.** CI는 못 잡는다(형식만 본다).
  #
  # ⚠ **"상한에 닿았다"는 아직 아니다.** 위 18시행은 절단 0건이고, 프롬프트가 578토큰
  # (`expanded` 캡슐이 아니다) · 스키마도 `DecisionDraft`다. 이 주석이 말할 수 있는 것은
  # **여유가 좁아졌다**까지이고, 절단이 실제로 나는지는 `expanded` 캡슐 실측이 답한다.
  #
  # **자리는 아래 `output_max_by_role`이 들고, 이 PR은 값을 안 정했다.** 어느 역할에
  # 얼마를 주는지는 그 실측이 정한다 — 선언이 없는 역할은 위 4,096 그대로다.
  #
  # **2026-09-12 — 그 실측이 돌았고 답은 「값을 안 정한다」다.** `expanded` 캡슐이 아니라
  # **실제 Critic 프롬프트**로 쟀다(`run_20260912_0001`의 Finding에서 재구성). 셋이 나왔다.
  #
  #   (1) **Critic 프롬프트는 작다** — 서버가 센 `prompt_tokens`가 **646~654**다.
  #       `nodes/critic._ask_model`이 `build_facts`에 `capsule=`·`source=`를 안 넘기므로
  #       캡슐도 대상 원문도 안 실린다. 위 문단의 "`expanded` 캡슐 실측"은 이 경로를
  #       가리키지 않는다.
  #   (2) **`completion_tokens`가 재는 것은 답변이 아니다** — gpt-oss-20b의 출력은 추론과
  #       본문으로 갈리고 **본문은 76~126토큰**이다(서버 `/tokenize`로 각각 셌다). 추론이
  #       `reasoning_effort: high`에서 484~16,381 · `medium` 69~227 · `low` 12~23이다.
  #       **그러므로 이 주석이 위에서 든 2,863도 「긴 답변」이 아니다.** ⚠ 그 수를 소급해
  #       분해하지는 않는다 — 그 실험이 둘을 안 갈랐다.
  #   (3) **하네스 실제 설정에서 안 잘린다** — `max_tokens 4096` · `high` · `Decision` ·
  #       실 프롬프트 **16콜에서 `finish=length` 0건**이고 비폭주 최대가 1,508이다(여유 2.7배).
  #
  # 그래서 **`output_max_by_role`은 비워 둔다.** 값을 넣을 이유가 실측에 없고, 넣는 순간
  # 「역할별 상한에 위쪽 한계가 없다」는 미해결 항목이 물린다. 폭주는 확률적이며(실
  # 프롬프트 `high` 3/32) **상한을 올리면 그 폭주가 비례해 비싸진다** — 같은 폭주가
  # 4,096에서 93초, 16,384에서 **382초**다. 위 8,192→4,096 문단과 같은 논법이다.
  # 원천: docs/experiments/harness/2026-09-12-critic-gptoss-token-accounting-atom.md §3.3·§3.4.
  #
  # **입력 여유(24,576 → 28,672)는 근거로 세지 않는다.** 정상 프롬프트는
  # `run_20260828_0002`에서 최대 1,798 토큰이라 어느 쪽에서도 안 걸린다. 8,192가 입력을
  # 깎아 target 3건을 400으로 떨어뜨린 것은 이 값 때문이 아니라 재시도가 실패 응답
  # 원문을 되싣던 결함(PR #49로 해소) 때문이었고, 그쪽은 별도로 닫힌다.
  #
  # `sampling`이 아니라 여기 있는 것은 `Thresholds.flatten()`이 `RunRecord.thresholds`로
  # 실어 주기 때문이다 — 조건 간 비교에서 고정돼야 하는 값이고 실제로 쓰인 값이 남아야 하며
  # (evaluation.md §6), `dict[str, float]`라 키를 늘려도 기존 manifest 로드가 안 죽는다.
  # `schema_retries`가 이미 같은 이유로 여기 있다. **`Sampling`도 검토했다** — 그쪽 docstring이
  # 자기를 "게이트웨이 요청 파라미터"로 정의해 `max_tokens`가 들어맞지만, 스키마 필드가 늘어
  # 기본값 처리가 필요하고 기존 manifest 호환이 깨진다. 일관성·호환 쪽을 골라 현행 유지.
  output_max: 4096

  # 캡슐 레벨별 토큰 상한 (knowledge-base.md §4). 키는 CapsuleLevel 열거형 값과 같다.
  capsule_budget_tokens:
    # **#96 부분 완화 — 예산 축소 (2026-08-25 회의 결정).** `estimate_tokens = len//4`가
    # 실서빙 실측(2.224 chars/token, `run_20260821_0007`)보다 ~1.8배 과소다.
    #
    # ⚠ **이 값은 `--max-model-len`을 보장하지 못한다. 부분 완화이지 천장이 아니다.**
    #   예산이 묶는 것은 `related`·그래프 섹션·보조 섹션뿐이고 **프롬프트에서 가장 큰
    #   덩어리인 대상 원문은 안 묶는다.** `target_function` 섹션은 본문 없이 토큰 수만 들고
    #   (`_sections_for`의 `min(cost, remaining)`), 실제 원문은 노드가 `ctx.read_source()`로
    #   따로 읽어 `{{SOURCE}}`와 사실 블록에 싣는다 — `nodes/scout.py`의 `describe_sections`
    #   docstring이 "`target_function`(원문은 `{{SOURCE}}`가 싣는다)"이라고 적어 뒀다.
    #   2026-08-21 zlib run이 `cand_0033`에서 HTTP 400으로 죽은 원인인
    #   `contrib/minizip/unzip.c`(67,662 B)는 `estimate_tokens`로 16,915라 **24,000에도
    #   18,000에도 안 걸린다.** 그 경로는 이 손잡이로 닫히지 않는다.
    #
    # 그래서 값을 천장에서 역산하지 않는다. 천장을 겨냥하려면 #67의 2배 계상과 출력분이
    # 들어가야 하는데 — (32768 − output_max) / 1.798 / 2 — 그렇게 잡아도 원문이 안 묶이므로
    # 여전히 보장이 아니다. 18,000은 `related`가 먹을 수 있는 자리를 계상 기준 6,000 줄이는
    # 값이고, 그것이 이 변경의 전부다.
    #
    # **정정(2026-08-28): 이 식이 쓰던 `output_max 2000`은 하네스에 없던 값이었다.**
    # 2,000은 `docs/agent-contracts.md` §1의 실행 계약 **예시**(`token_budget.output_max`)이고
    # config에는 그 키가 없었다 — payload에 `max_tokens` 자체가 없었으므로 실제 상한은
    # 2,000이 아니라 `--max-model-len`이었다. 지금은 위 `thresholds.output_max`가 진짜로
    # 실린다. 그 값(2026-08-28부터 4,096)으로 다시 계산하면
    # (32768 − 4096) / 1.798 / 2 ≈ **8,000**이다.
    # **그래도 18,000을 안 내린다** — 위 문단대로 이 손잡이는 천장을 겨냥하지 않고, 원문이
    # 안 묶이는 한 어떤 값도 보장이 아니다. 식은 규모 감각용이지 근거가 아니다.
    #
    # ⚠ **정본은 여전히 (b) 실 토크나이저 교체다** — 회의 결정은 (c) 축소를 먼저 넣고 그
    #   다음 (b)였다. 토크나이저가 들어오면 계상이 실측으로 바뀌어 이 보수값은 원복할 수
    #   있다. 원문을 실제로 묶는 일은 프롬프트 조립부에 가야 하고 별개 PR이다(#96).
    #   32K 천장 가정이라 auditor가 ≤8K로 서빙되면 더 낮춰야 한다.
    # light/focused도 같은 한계를 공유한다(원문 제외 기준 4000→~7,190 · 8000→~14,400).
    light: 4000
    expanded: 18000
    focused: 8000

# 모델 게이트웨이 요청 파라미터. 조건 간 비교에서 고정해야 하므로 RunRecord에 남는다
# (engineering-guide.md §5).
sampling:
  temperature: 0.2
  top_p: 0.95

# 기본 seed. CLI가 --seed로 덮어쓸 수 있고, 실제로 쓰인 값이 RunRecord.seed에 기록된다.
seed: 20260901
