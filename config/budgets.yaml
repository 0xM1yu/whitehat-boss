  capsule_budget_tokens:
    # **#96 부분 완화 — 예산 축소 (2026-08-25 회의 결정).** `estimate_tokens = len//4`가
    # 실서빙 실측(2.224 chars/token, `run_20260821_0007`)보다 ~1.8배 과소다.
