# run 단위 예산과 정책 임계값 (engineering-guide.md §8.5)
#
# 하드코딩 금지 — 임계값·예산·모델은 전부 여기서 온다. 노드는 이 값을 직접 비교하지 않고
# RoutingPolicy를 거친다(src/orchestrator/policy.py).
#
# evaluation.md §2.3 공정성 규칙: 모든 조건은 동일 예산에서 실행한다. 조건 간 차이는
# 프로필과 단계 활성화만이므로 thresholds·sampling·seed는 프로필과 무관하게 공통이다.
# 실제로 쓰인 값은 RunRecord.thresholds에 박제된다(evaluation.md §6).

budgets:
  default:
    input_tokens: 4000000
    output_tokens: 400000
    gpu_seconds: 7200
    # 컨테이너 도구(semgrep·clang-tidy·build·asan)의 run 전체 상한. GPU 예산과 나눈
    # 이유는 그 도구들이 GPU를 쓰지 않기 때문이다(schemas/run.py `Budget.tool_seconds`).
    #
    # **이 값은 잠정치다. 실대상 측정이 아니다.** 지금 가진 수치는 2026-08-17에 잰
    # 8,492 ms(x86_64/docker)와 4,491 ms(aarch64/podman)뿐인데 둘 다 대상이
    # `tests/fixtures/target`(파일 두 개짜리 장난감 parser.c)이다. 실제 저장소는 파일이
    # 서너 자릿수 많으므로 그 값에서 상한을 유도하면 **지어낸 근거**가 된다
    # (model-serving.md §5·bench.py 모듈 docstring의 같은 규칙: 지어낸 값은 미측정을
    # production으로 통과시킨다).
    #
    # **근거를 만드는 측정은 zlib 급 실대상 1회 run이다**(open-questions D15). 그전까지
    # 이 값의 목적은 폭주 차단 하나이고, 정상 run이 걸리지 않도록 넉넉히 둔다.
    tool_seconds: 1800

  dev_fake:
    # Fake 어댑터는 GPU를 쓰지 않는다. 예산 소진 경로(stopped_after)를 테스트에서
    # 태울 수 있도록 일부러 작게 잡는다.
    input_tokens: 200000
    output_tokens: 20000
    gpu_seconds: 0
    # Fake 런타임의 도구 시간은 애초에 청구되지 않는다(`RunContext.call_tool`) — 잴
    # 컨테이너가 없고, 그 시간은 하네스가 자기를 잰 값이다. 0은 "상한 없음"이라는 기존
    # 관용구다(`BudgetLedger._overrun`).
    tool_seconds: 0

thresholds:
  # 4단계 Scout 승격 기준 (architecture.md §3). 초기값이며 실측 후 확정 — open-questions D2.
  scout_threshold: 0.5

  # Progressive Context Expansion 상한 (knowledge-base.md §5, 초기값 3) — open-questions D3.
  # 초과하면 후보를 폐기하지 않고 queued로 둔다.
  capsule_expansion_max: 3

  # queued 후보의 재평가 횟수 상한. 새 Evidence가 들어올 때마다 무한히 재평가하면
  # 토큰이 샌다. 초과 시에도 폐기하지 않고 queued를 유지하며 사유 코드만 남긴다.
  requeue_max: 2

  # 7단계 Critic에 올릴 상위 Finding 수. Critic은 가장 비싼 단계이므로 상한이 있어야 한다
  # (architecture.md §3 "상위 Finding만").
  critic_top_n: 8

  # bounded in-process queue 크기 (engineering-guide.md §1).
  #
  # **후보 경로는 이 값을 소비하지 않는다.** `WorkQueue`를 import 하는 것은 지금
  # `tests/test_state_machine.py`뿐이고 러너의 target 순회는 평범한 리스트다. 후보 수의
  # 상한은 아래 `candidate_max`가 따로 든다 — 이 키의 뜻을 조용히 넓히지 않는다.
  queue_maxsize: 256

  # 한 run이 4단계(Scout)에 올릴 target 수 상한 (W2).
  #
  # 후보 단위가 파일에서 심볼로 바뀌면서 필요해졌다. zlib은 분석 대상 artifact 32건이
  # 함수 수백 개가 된다. 초과분은 **버리지 않고** trace의 `target_skipped`에
  # `over_candidate_max`로 남기고, 건수는 run 경고와 report.md에도 올린다 — 안 만들어진
  # 후보가 흔적 없이 사라지면 정적 신호를 게이트가 아니라 순서로 쓰기로 한 결정((a′))이
  # 뜻을 잃는다.
  #
  # **이 값은 잠정치다. 실측이 아니다.** 후보 1건당 토큰·시간을 한 번도 재지 않았고,
  # 그 측정의 입력이 이 변경 뒤의 zlib 급 실대상 1회 run이다. 지금 가진 것은 파일 단위
  # 후보 32건짜리 run뿐이라 거기서 상한을 유도하면 **지어낸 근거**가 된다
  # (위 `tool_seconds`가 D15에 대해 쓰는 논법과 같다).
  #
  # 256을 고른 유일한 이유는 `queue_maxsize`가 in-process 작업 항목 수에 대해 이미 쓰고
  # 있는 수라 새 숫자를 지어내지 않기 위해서다 — **근거가 아니라 관례다.** 그전까지 이
  # 값의 목적은 폭주 차단 하나다.
  candidate_max: 256

  # 구조화 출력 파싱 실패 시 재요청 횟수 (agent-contracts.md §1의 token_budget.retries).
  # 한도를 넘기면 후보를 queued로 두고 schema_parse_failed로 기록한다. 이 값을 올리면
  # "스키마 파싱 실패율"(evaluation.md §5.1)이 낮아지므로 조건 간 비교에서 고정해야 한다.
  schema_retries: 1

  # 캡슐 레벨별 토큰 상한 (knowledge-base.md §4). 키는 CapsuleLevel 열거형 값과 같다.
  capsule_budget_tokens:
    # **D21 stopgap — 예산 축소 (2026-08-25 회의 결정).** `estimate_tokens = len//4`가 실서빙 실측
    # (2.224 chars/token, run_20260821_0007)보다 ~1.8배 과소라, 선언 예산이 실제
    # 프롬프트에서 `--max-model-len`을 넘어 잘린다. 최악 배율에서 32,768에 맞춰 `expanded`를
    # 낮춘다: 32768 × 2.224/4 ≈ 18,200.
    #
    # ⚠ **임시(stopgap)다 — 회의 결정: (c) 이 예산 축소를 먼저 넣고, 그 후 `estimate_tokens`를
    #   실 토크나이저로 교체한다(정본).** 토크나이저가 들어오면 계상이 실측으로 바뀌어 이
    #   보수값은 원복할 수 있다. 32K 천장 가정이라 auditor가 ≤8K로 서빙되면 더 낮춰야 한다.
    #   산문↔JSON 중복(D17)·한국어 프롬프트는 별개 축(크기)이고 토크나이저 뒤 실측으로 판단.
    # light/focused는 실측상 이미 상한 아래다(4000→~7,190 · 8000→~14,400).
    light: 4000
    expanded: 18000
    focused: 8000

# 모델 게이트웨이 요청 파라미터. 조건 간 비교에서 고정해야 하므로 RunRecord에 남는다
# (engineering-guide.md §5).
sampling:
  temperature: 0.2
  top_p: 0.95

# 기본 seed. CLI가 --seed로 덮어쓸 수 있고, 실제로 쓰인 값이 RunRecord.seed에 기록된다.
seed: 20260901
