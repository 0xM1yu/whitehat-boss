    #   덩어리인 대상 원문은 안 묶는다.** `target_function` 섹션은 본문 없이 토큰 수만 들고
    #   (`_sections_for`의 `min(cost, remaining)`), 실제 원문은 노드가 `ctx.read_source()`로
    #   (`input: slice` 프롬프트의 슬라이스 타깃 Scout는 `ctx.read_slice()`로) 따로 읽어 `{{SOURCE}}`와 사실 블록에 싣는다 —
    #   `nodes/scout.py`의 `describe_sections` docstring이 "`target_function`(원문은 `{{SOURCE}}`가
    #   싣는다)"이라고 적어 뒀다.
    #   2026-08-21 zlib run이 `cand_0033`에서 HTTP 400으로 죽은 원인인
    #   `contrib/minizip/unzip.c`(67,662 B)는 `estimate_tokens`로 16,915라 **24,000에도
    #   18,000에도 안 걸린다.** 그 경로는 이 손잡이로 닫히지 않는다.
    #
    # 그래서 값을 천장에서 역산하지 않는다. 천장을 겨냥하려면 #67의 2배 계상과 출력분이
    # 들어가야 하는데 — (32768 − output_max) / 1.798 / 2 — 그렇게 잡아도 원문이 안 묶이므로
    # 여전히 보장이 아니다. 18,000은 `related`가 먹을 수 있는 자리를 계상 기준 6,000 줄이는
    # 값이고, 그것이 이 변경의 전부다.
    #
    # **정정(2026-08-28): 이 식이 쓰던 `output_max 2000`은 하네스에 없던 값이었다.**
    # 2,000은 `docs/agent-contracts.md` §1의 실행 계약 **예시**(`token_budget.output_max`)이고
    # config에는 그 키가 없었다 — payload에 `max_tokens` 자체가 없었으므로 실제 상한은
    # 2,000이 아니라 `--max-model-len`이었다. 지금은 위 `thresholds.output_max`가 진짜로
    # 실린다. 그 값(2026-08-28부터 4,096)으로 다시 계산하면
    # (32768 − 4096) / 1.798 / 2 ≈ **8,000**이다.
    # **그래도 18,000을 안 내린다** — 위 문단대로 이 손잡이는 천장을 겨냥하지 않고, 원문이
    # 안 묶이는 한 어떤 값도 보장이 아니다. 식은 규모 감각용이지 근거가 아니다.
    #
    # ⚠ **정본은 여전히 (b) 실 토크나이저 교체다** — 회의 결정은 (c) 축소를 먼저 넣고 그
    #   다음 (b)였다. 토크나이저가 들어오면 계상이 실측으로 바뀌어 이 보수값은 원복할 수
    #   있다. 원문을 실제로 묶는 일은 프롬프트 조립부에 가야 하고 별개 PR이다(#96 — 별건
    #   미착수, 추적 이슈 없음. #96은 2026-10-12 닫았다).
    #   32K 천장 가정이라 auditor가 ≤8K로 서빙되면 더 낮춰야 한다.
    # light/focused도 같은 한계를 공유한다(원문 제외 기준 4000→~7,190 · 8000→~14,400).
    light: 4000
    expanded: 18000
    focused: 8000

