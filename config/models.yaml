    endpoint: "http://127.0.0.1:8004/v1"
    context_limit: 32768
    quantization: "fp16"
    license: "Apache-2.0"
    checksum: "sha256:2f0df70974121b6286d288c6b8639b576c4157fc7499fff717984cce3ab72323"
    source: "hf://Qwen/Qwen3-Embedding-0.6B@97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
    family: "qwen"
    prompt_template_version: "v1"
    fallback: null
    benchmark:
      measured_at: null
      measured_on: null
      tok_s_single: 0
      tok_s_batch32: 0
      mem_gb_ctx8k: 0
      # `tok_s_batch32`가 어떤 캐시 상태에서 나온 값인가 (이슈 #128).
      # null은 미판독, 0.0은 "캐시를 끄고 쟀다"라는 실측이다 — 둘은 다르다.
      prefix_hit_ratio_batch32: null

