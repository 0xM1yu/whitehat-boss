  devstral-small-2-24b:
    # Mistral 계열 24B. **자리의 정본은 PROJECT-CONTEXT.md §1이다** — 2026-09-09 확정 로스터에서
    # 이 모델은 `scout_boundary`(CWE-119·125·787·190)이고, 아래 서술이 전제하던 Critic 자리가
    # 아니다. Primary와 다른 계열이어야 교차 검증의 가치가 나온다는 규칙 자체는 그대로이고
    # (model-serving.md §2), 지금은 `load_config`의 `_check_family_split`이 그것을 강제한다.
    #
    # **2026-09-04 ATOM에서 처음 띄웠다.** 상세는
    # docs/experiments/harness/2026-09-04-five-model-residency-atom.md §7.
    # 그 전까지 이 주석은 "받지도 띄우지도 않았다"고 적고 있었는데 **「띄우지도」가 거짓이 됐다** —
    # 띄운 것이 2026-09-04다. ⚠ **「받지도」는 안 뒤집었다** — 2026-09-04에 조회한 HF 캐시
    # 스냅샷 날짜가 2026-08-25일 뿐이고, 그것이 그날 실험 전인지는 저장소로 못 가른다.
    # 게다가 그 문장이 걸려 있던 대상은 아래 nvfp4 빌드이고 그것은 지금도 안 받았다.
    # 어긋남의 정본 기록은 docs/experiments/README.md 확정 #7이다.
    #
    # **`quantization`이 `nvfp4`였는데 틀린 값이다. 실제는 `fp8`이다.** 근거 셋이 같은 방향이다:
    #   config.json  `quantization_config.quant_method: 'fp8'`
    #   vLLM 기동 로그 `quantization=fp8`
    #   파일 크기     18,921 MiB + 5,678 MiB = 24.0 GiB — 24B × 1바이트다(bf16이면 약 48 GiB).
    # portability.md §5 #1이 이 모델을 `nvfp4`로 세고 있던 것도 여기서 왔다.
    #
    # **멀티모달이다 — dense 텍스트 24B로만 읽으면 안 된다.** config.json의
    # `architectures: ['Mistral3ForConditionalGeneration']` · `model_type: 'mistral3'`이고
    # `modules_to_not_convert`에 `model.vision_tower`·`model.multi_modal_projector`가 있다.
    # vLLM은 `Resolved architecture: PixtralForConditionalGeneration`으로 해석했다.
    #
    # **기동에 전용 로더 인자가 필요하다** — 스냅샷에 `consolidated-*.safetensors`·`params.json`·
    # `tekken.json`만 있고 HF transformers 포맷 파일이 없다(mistral 네이티브):
    #
    #   --tokenizer-mode mistral --config-format mistral --load-format mistral
    #
    # 인자를 모르면 수치가 나빠지는 것이 아니라 **서버가 안 뜬다**(qwen3-4b의 fp8 항목과 같은
    # 종류의 함정이다). 환경변수는 그날 전 기동 공통으로 `VLLM_USE_DEEP_GEMM=0`이 걸려 있었다.
    #
    # 메모리 실측(같은 보고서 §7. vLLM 기동 로그의 자기 회계다):
    #   util 0.45  가중치+non-torch 26.8 GiB · KV 26.3 · nvidia-smi 53,330 MiB
    #   util 0.30  가중치+non-torch 25.48 GiB · KV 9.67
    #   로딩 24.12 GiB / 173.2초, 전체 콜드 약 330초
    #
    # **`source`·`checksum`을 2026-09-04에 채웠다.** 이 항목이 최초 커밋부터 비워 두던 자리다.
    # manifest는 `config/checksums/devstral-small-2-24b.txt`(파일 8개)이고 registry의 이 값은
    # **그 파일 전체의 sha256**이다(`tools/model_checksum.py`).
    #
    # **서버를 내린 뒤에 만들었다.** 떠 있는 동안 24 GiB를 읽으면 페이지 캐시가 차서 돌고 있는
    # 다른 서버가 CUDA OOM으로 죽는다(같은 보고서 §4.3) — 순서가 제약이었다.
    #
    # ⚠ **채워진 것은 「어느 파일로 돌았나」이지 「비교표에 들어간다」가 아니다.** 이 모델의
    # `benchmark`는 여전히 전부 0이고(미실측), model-serving.md §5에 따라 production 프로필에
    # 넣지 않는다. 그리고 2026-09-04 run(`run_20260904_0001`)은 이 값이 채워지기 **전**에
    # 돌았으므로 그 run의 `RunRecord.model_checksums`에는 0이 남아 있다.
    # 그 run의 보고서는 docs/experiments/harness/2026-09-04-pipeline-zlib-serving-atom.md다
    # — PR #166으로 2026-09-10에 들어왔다. **그전에는 저장소에 없어 이 인용을 따라갈 데가
    # 없었고**, 그 상태가 결함으로 등재돼 있었다(CLAUDE.md §0 — 출처를 같은 문장에 적는다).
    #
    # **`nvfp4` 빌드는 여전히 안 받았다**(주석이지 값이 아니다):
    #   Firworks/Devstral-Small-2-24B-Instruct-2512-nvfp4 — 이름만 확인. 받지도 띄우지도 않았다
    # NVFP4 양자화 시 반박 정확도 저하 위험(model-serving.md §4, docs/open-questions/R/R2.md)은
    # 그 별도 빌드에 대한 것이고, **여기 값은 그것이 아니다.**
    endpoint: "http://127.0.0.1:8003/v1"
    context_limit: 262144
