  qwen3.6-35b-a3b:
    # 확정 로스터 Auditor. Qwen/Qwen3.6-35B-A3B — MoE 35B total/3B active(256 experts),
    # config.json: Qwen3_5MoeForConditionalGeneration, context 262144.
    # ⚠ **비전-언어 모델이다** — config.json에 vision_config(depth 27·hidden 1152)·
    #   image_token_id 248056·video_token_id 248057이 있고 HF pipeline_tag가 image-text-to-text다
    #   (`Qwen3_5MoeForConditionalGeneration` = 멀티모달 관례, `ForCausalLM` 아님). vLLM 멀티모달
    #   서빙 경로, 「≈2B/param」 추정에 비전 타워 포함, R1·R8 범위가 그만큼 넓어진다(#234 리뷰 MEDIUM-2).
    # torch_dtype는 top-level엔 없고 `text_config.dtype: "bfloat16"`으로 **선언**돼 있다 —
    #   추정이 아니라 실값이다(#234 리뷰 MEDIUM-1). 카드 base 71.9GB(≈2B/param)와 일치.
    # ⚠ 문서상 로딩만·GT 품질 미검증. Auditor 프롬프트가 아직 미확정이라 디스크에 있는 v1로 둔다
    #   (auditor/v3는 #237이 신설 중 — 확정되면 그때 올린다).
    #   ⚠ **2026-09-24 — 「문서상 로딩만」은 지났다.** ATOM에서 실제로 떴다(아래 기동 조건). GT 품질은 여전히
    #   미검증이다. #237은 2026-09-22에 머지돼 `prompts/auditor/v3`가 디스크에 있고, 이 항목은 아직 v1을 고른다.
    #
    # ## 기동 조건 — 하네스가 보내지 않는다 (model-serving.md §5)
    #
    # 2026-09-24 ATOM에서 이 인자로 떴다(`run_20260924_0003` — 머지하지 않는 스모크 브랜치, `checksum`이 0이라
    # 비교표 밖). 원문은 `seccoderx-8b` 위 머리 문단이 가리키는 보고서 §9다.
    #
    #   VLLM_USE_DEEP_GEMM=0 VLLM_USE_FLASHINFER_SAMPLER=0 VLLM_HOST_IP=127.0.0.1 \
    #   NCCL_SOCKET_IFNAME=lo GLOO_SOCKET_IFNAME=lo \
    #   vllm serve Qwen/Qwen3.6-35B-A3B --revision 995ad96eacd98c81ed38be0c5b274b04031597b0 \
    #     --served-model-name qwen3.6-35b-a3b --host 127.0.0.1 --port 8008 --max-model-len 24576 \
    #     --gpu-memory-utilization 0.64 --max-num-seqs 2 --enforce-eager \
    #     --structured-outputs-config.backend xgrammar \
    #     --structured-outputs-config.disable_any_whitespace true
    #
    #   축약이라 그대로 복붙하면 안 된다 — 빠진 것은 `seccoderx-8b` 항목의 같은 문단이 든다.
    #
    # - **이 인자로 띄우면 Auditor가 사고 없이 답한다.** 이 모델의 채팅 템플릿은 `enable_thinking`이 false가
    #   아니면 생성 프롬프트 끝에 `<think>`를 연다. 하네스는 `chat_template_kwargs`를 안 보낸다. 그런데
    #   parser가 없으면 vLLM이 구조화 출력 문법을 첫 토큰부터 건다(`seccoderx-8b` 항목의 `reasoning_ended =
    #   None`). 그래서 모델이 사고하지 못하고 곧장 JSON을 낸다. 응답 41건(auditor 37시도 · critic 4)에 이 모델
    #   어휘의 `<think>`·`</think>`(id 248068·248069)가 0건이고 첫 글자가 전부 `{`다(서버 로그). 그렇게 해서
    #   auditor 36/36이 `Finding`을 통과했다. ⚠ **사고 없는 Auditor가 판정 품질에 무엇을 하는지는 안 쟀다.**
    # - **같은 설정(`output_max` 4,096 · `chat_template_kwargs` 없음)에서 `--reasoning-parser deepseek_r1`을
    #   걸었더니 7/7이 실패했다**(`run_20260924_0002`, 같은 날 먼저 띄운 판).
    #   - parser가 있으면 문법이 사고가 끝난 뒤에야 걸린다. 그런데 사고가 4,096토큰 안에 끝나지 않았다.
    #   - 호출마다 `output_tokens`가 8,192(= 2시도 × 상한)다.
    #   - 실패 사유는 본문 `None` 6건 · 잘린 JSON 1건이다. 시도 단위로는 `None` 12/14 · 잘린 JSON 2/14다
    #     (trace `error_detail`과 재시도 프롬프트 로그).
    #   - `deepseek_r1` parser는 `</think>`가 없으면 출력 전부를 사고로 넘긴다(vLLM 0.27.1
    #     `reasoning/basic_parsers.py`). 그래서 본문이 빈다.
    #   ⚠ 그 판은 인자 셋이 **한꺼번에** 달랐다 — parser가 있었고 `xgrammar`·`disable_any_whitespace`가 없었다.
    #   그 판의 서버 로그는 뒤 기동이 같은 파일을 덮어써 없다. **다른 두 길은 안 쟀다.**
    #   - 사고를 끄는 판 — 템플릿이 사고를 닫는다(`enable_thinking: false`). 서버 인자
    #     `--default-chat-template-kwargs '{"enable_thinking": false}'`로 하네스 변경 없이 된다(vLLM 0.27.1
    #     `entrypoints/openai/cli_args.py`).
    #   - 사고를 쓰되 길이를 묶는 판 — 요청의 `thinking_token_budget`(토큰 수)에 닿으면 vLLM이 `</think>`를
    #     강제로 넣는다. `--reasoning-parser`가 있어야 받는다(0.27.1 `v1/engine/input_processor.py`). 하네스는
    #     이 필드를 안 보낸다.
    #   ⚠ **등급으로는 못 고른다.** 이 템플릿이 읽는 사고 변수는 `enable_thinking`(과 이력용
    #   `preserve_thinking`)뿐이다. vLLM의 `reasoning_effort`는 이 템플릿에서 `enable_thinking = (값 !=
    #   "none")`로만 번역돼 low·medium·high가 같다. 게다가 이 registry의 `reasoning_effort`는
    #   `low|medium|high`만 받는다(`src/config.py`).
    # - **`disable_any_whitespace true`를 건다.** 옛 Auditor(`qwen3-coder-30b-a3b`)에서 필수로 잰 인자다(위 그
    #   항목, 이슈 #172). parser 없이 이 인자만 빼 보지는 않았다. 재시도 1건은 공백이 아니라 **숫자 폭주**였다 —
    #   `repro_spec.steps`의 명령 인자 안에 `9`가 3,808자 이어져 첫 시도가 4,096에서 잘렸다
    #   (`finish_reason: length`). 두 번째 시도는 382토큰으로 끝났다(서버 로그). 이 인자는 그 폭주를 못 막는다.
    # - 속도: 단일 요청 생성 26.2 tok/s다(서버 로그 10초 창 중앙값, 81창). 창의 절반에 프리필이 섞여 있고,
    #   순수 디코드 42창만 보면 26.6이다. 그래서 `output_max` 4,096은 ≈156 s다(계산값). auditor 호출 wall은
    #   중앙값 16.2 s · 최대 171.0 s였다(trace `model_call`).
    # - 메모리(서버 로그): 가중치 65.53 GiB(로드 234 s) · 가중치+non-torch 68.6 GiB · util 0.64에서 KV 6.25 GiB
    #   (282,168 tok — 24,576 길이에 11.48×). 기동 명령부터 서버가 `Starting vLLM server`를 찍기까지 313 s
    #   (기동 스크립트 로그의 시각 → 서버 로그의 시각).
    #   떠 있는 동안 장비 `MemAvailable` 최저값이 36.0 GiB였다(감시자 로그) — **Scout 풀(`seccoderx-8b` +
    #   Qwen3-14B)과 함께 올리지 못한다**. 그 풀만 올린 동안의 최저값이 49.1 GiB였고, 거기에 이 모델의
    #   util 몫 76.6 GiB가 더해지면 장비를 넘는다(계산값).
    endpoint: "http://127.0.0.1:8008/v1"
    context_limit: 262144
    quantization: "bf16"
