    # 12는 서버 동시 8에서 「스트림당 ≥12 tok/s」라는 가정이고 안 쟀다. 조사의 이 행은 아래 두 Scout 키와
    # ⏵ 2026-10-12 — 「안 쟀다」는 낡았다: `run_20261011_0001`(vast · 순차)의 Critic 호출 1이 58,156 토큰(두 시도 합)을
