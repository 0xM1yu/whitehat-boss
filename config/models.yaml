    # 안 잰 가정이고, 이 값은 동시 8이 아니라 순차 1의 값이라 그 가정을 대신하지 않는다.
    # 달리 여유 배수(× 1.3)를 안 적었다.
    # 지금(4,096 · 순차)은 기본 300 s로도 든다 — 2026-09-12 토큰 회계 보고서
