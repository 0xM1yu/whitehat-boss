    #   (282,168 tok — 24,576 길이에 11.48×). 기동 명령부터 서버가 `Starting vLLM server`를 찍기까지 313 s
    #   (기동 스크립트 로그의 시각 → 서버 로그의 시각).
    #   떠 있는 동안 장비 `MemAvailable` 최저값이 36.0 GiB였다(감시자 로그) — **Scout 풀(`seccoderx-8b` +
    #   Qwen3-14B)과 함께 올리지 못한다**. 그 풀만 올린 동안의 최저값이 49.1 GiB였고, 거기에 이 모델의
