      measured_on: "atom"
      tok_s_single: 35.78
      tok_s_batch32: 388.46
      mem_gb_ctx8k: 0
      # `tok_s_batch32`가 어떤 캐시 상태에서 나온 값인가 (이슈 #128).
      # null은 미판독, 0.0은 "캐시를 끄고 쟀다"라는 실측이다 — 둘은 다르다.
      prefix_hit_ratio_batch32: 0.9981

  qwen3-coder-30b-a3b:
    # 30.5B total / 3.3B active MoE. 좁은 대역폭에서 총 파라미터 대비 유리(model-serving.md §2).
    #
    # ## 기동 조건 — 하네스가 보내지 않는다 (model-serving.md §5)
    #
    # 아래는 `vllm serve`를 치는 사람의 값이다. `ModelEntry`는 이 값들을 담지 않는다
    # (`extra="forbid"` — `src/config.py`가 그 배제를 정본으로 적는다).
    #
    #   PATH=<venv>/bin:/usr/local/cuda/bin:$PATH VLLM_USE_DEEP_GEMM=0 \
    #   vllm serve <스냅샷 경로> --port 8002 --served-model-name qwen3-coder-30b-a3b \
    #     --max-model-len 32768 --gpu-memory-utilization 0.30 \
    #     --structured-outputs-config.backend xgrammar \
    #     --structured-outputs-config.disable_any_whitespace true
    #
    # - **`disable_any_whitespace true`가 필수다** — 2026-09-11 ATOM 실측(이슈 #172).
    #   `Finding`의 `path`·`evidence_refs`를 스키마 `required`로 올리면 모델이 그 둘을 채우지만
    #   (`stock`에서 20/20 비던 것 → `required` 팔은 성공한 10/10에서 채움) **공백 폭주**가
    #   따라온다: 유효 JSON이 이 옵션 `false`에서 **5/15**(조건 A·B·D), `true`에서 **5/5**다.
    #   꼬리 공백이 12,849~13,199자였고 전부 `output_tokens == max_tokens`였다.
    #   ⚠ **`backend xgrammar`만으로는 재발한다** — 귀속은 `disable_any_whitespace` 단독이다.
    #   ⚠ **비율로 읽지 마라 — n=5다.** 같은 인자의 조건 A·B가 2/5와 0/5를 냈다. 읽을 것은
    #     *"조건 C만 전 팔 5/5"*이고, 한 프롬프트·한 모델·한 역할의 결과다.
    #   ⚠ 위 수는 그 보고서 **§3.1 표에서 재계산**한 것이다 — §1 요약의 「13/13」·「5/20」은
    #     그 표에서 재구성되지 않는다(원천 JSON이 ATOM에 있어 여기서 못 가른다).
    # - **`PATH`가 인자의 일부다** — 빼면 기동이 막힌다(그 보고서 §4의 첫 벽).
    #   ⚠ 원문은 venv의 `vllm`을 **절대 경로로** 부른다(`<venv>/bin/vllm serve`). 위 축약은
    #     `PATH` 접두에 기대므로, 확실히 하려면 원문처럼 절대 경로를 쓴다.
    # - **인자를 줬다고 실렸다고 읽지 않는다.** 기동 로그에서 확인한다:
    #   `grep -o "StructuredOutputsConfig([^)]*)" <로그> | head -1`
    # - 전체 원문(스냅샷 경로·`setsid nohup`·로그 리다이렉트·readiness 루프 포함)은
    #   `docs/experiments/harness/2026-09-11-d67-required-schema-atom.md` §9다. 위는 그 축약이다.
    #
    # **아래 값은 2026-09-04 ATOM 실측이고, 그 원천은
    # docs/experiments/harness/2026-09-04-five-model-residency-atom.md §9다** — 그 절의
    # `--apply` 판이 `tok_s_single 53.4` · `tok_s_batch32 66.42` ·
    # `prefix_hit_ratio_batch32 0.5673`으로 이 블록에 적힌 것과 같다. 명령은
    # `cli bench --profile local_balanced_hybrid --device atom --roles scout auditor
    # --concurrency 8 16 32 --apply`였고 8001·8002·8004·8005 넷이 동시에 뜬 상태였다.
    # ⚠ **그 보고서는 #142가 들여온다** — 위 `qwen3-8b` 블록과 같은 사유로 링크로 걸지 않는다.
    # 2026-09-02 재측정(아래 #128 문단의 근거)은
    # docs/experiments/harness/2026-09-02-bench-concurrency-atom.md,
    # 첫 측정은 2026-08-25이고 docs/experiments/harness/2026-08-25-serving-nvfp4-atom.md §4~§5다.
    #
    # **아래 두 수치는 성격이 다르다. 같은 신뢰도로 읽으면 안 된다.**
    #
    # `tok_s_single`은 2026-09-02 캐시 ON 세 판에서 52.96 / 53.06 / 52.36으로 산포
    # 1.34%였고(계산값), 2026-09-04 판이 **53.4**로 그 폭 안에 들어온다 — 지금 필드에
    # 있는 값이 그것이다. **캐시를 끄면 21.96으로 2.4배 떨어진다** — 이 값도 캐시가 사고 있었다.
    #
    # **`tok_s_batch32`는 몇 번째 판이냐에 달려 있다 (이슈 #128).** 같은 서버·같은 인자로
    # 돌린 세 판이 59.45 / 68.64 / 107.32로 **1.81배** 갈렸고, 원인은 산포가 아니라 prefix
    # cache 적중률이다(0.5142 / 0.7776 / 0.8577). 동시성 8·16·32 각각에서 세 판을 적중률로
    # 정렬하면 tok/s 정렬과 같고 **아홉 칸에 역전이 0건**이다. `bench`의 `variant`가
    # **한 판 안에서만** 본문을 흔들어서(`bench.py:432`), seed가 같은 다음 판은 자기 자신을
    # 캐시에서 읽는다. **그래서 이 필드는 오래 0이었다 — 미실측이 아니라 판단이었다**
    # (CLAUDE.md §0). 당시 `--apply`가 쓴 68.64는 적중률 0.7776짜리 데워진 값이었고,
    # `benchmark`에 **캐시 온도를 적을 칸이 없어서** 값을 넣으면 다음 사람이 조건 없는
    # 처리량으로 읽었다 — 그것이 0으로 되돌린 이유다(#127).
    #
    # **그 칸이 생겨서 이제 적는다.** #133이 `prefix_hit_ratio_batch32`를 넣어 값과 캐시
    # 상태가 같은 레코드에 앉는다(#128의 (b) 채택). 지금 값 **66.42는 적중률 0.5673**이다.
    #
    # ⚠ **66.42를 아래 운영 범위(39.64~59.45)와 같은 축에 놓지 마라.** 두 가지가 다르다 —
    # ① 캐시 ON이라 그 범위의 상한 위에 있고, ② 그 범위는 `b1_single`에서 이 모델 **혼자**
    # 떠 있을 때 잰 곡선인데 66.42는 **네 서버가 동시에 상주한** 상태에서 나왔다.
    # 배치 크기 예산의 근거로 쓸 것은 여전히 아래 4판 캐시 OFF 곡선이다.
    #
    # **`tok_s_single`은 왜 0이 아닌가.** 그쪽은 세 판의 적중률이 전부 0.9996으로 같아서
    # (동시성 1은 즉시 포화한다) 같은 조건이 재현되고 산포가 1.34%다. batch32는 적중률
    # 자체가 판마다 달라 **재현되는 조건이 없었다** — 그 차이가 한쪽만 0으로 두었던
    # 이유이고, 옆 칸의 적중률이 그 조건을 적게 되면서 없어진 이유다.
    #
    # **캐시를 끄고 잰 하한선이 있다** — `--no-enable-prefix-caching`으로 다시 띄운 4판이
    # 21.96 / 35.23 / 39.77 / 39.64(동시성 1/8/16/32)다. 그러니 **운영 값은 39.64(공유 0)와
    # 59.45(1판, 본문 일부 공유) 사이**이고 68.64는 그 위다. 배치 크기 예산의 근거로 쓸
    # 것은 그 4판 곡선이다 — **이득 1.81배이고 동시성 16에서 포화한다.**
    #
    # **옛 주석의 「배치가 단일보다 느리다(54.83 → 38.93)」는 반증됐다.** 그 38.93은
    # `tok_s = produced / elapsed`인데 **실패한 호출의 벽시계가 분모에 들어간** 값이었다.
    # 재측정은 두 판 네 수준(1·8·16·32) 전부 실패 0건이고 둘 다 batch32 > single이다.
    # **그렇다고 「배칭 이득이 얼마다」를 대신 적을 수는 없다** — 단일 대비 최대 배율이
    # 1판 1.18배(동시성 8), 2판 2.42배(동시성 16)로 갈린다(계산값).
    # `qwen3-4b`의 3.2배와 비교하려면 그 폭부터 좁혀야 한다.
    #
    # **`mem_gb_ctx8k`는 0으로 남긴다 — 지어내지 않는다.** `nvidia-smi --query-gpu`가
    # 이 장비에서 `[N/A]`를 낸다(GB10은 통합메모리라 별도 VRAM 카운터가 없다).
    # **쿼리를 적는 이유**: `--query-compute-apps`는 이 장비에서도 프로세스별 값을 준다
    # (2026-09-03 실측 54,716 MiB). 그러나 그것은 **카드 점유가 아니라 PID별**이고
    # context 8K에 고정된 값도 아니라 이 필드를 바로 채우지 못한다 — 아래 보고서 §3.4. `bench --apply`도 이
    # 필드만 `skipped`로 두고 건드리지 않았다. **값을 채우면 `Benchmark.is_measured`가 0
    # 여부로 판정하므로 안 잰 모델이 production 프로필에 오르는 길이 열린다**
    # (model-serving.md §3의 같은 규칙). 재는 방법은 보고서 §7에 적혀 있다.
    endpoint: "http://127.0.0.1:8002/v1"
    context_limit: 262144
    quantization: "nvfp4"
    license: "Apache-2.0"
    checksum: "sha256:69c4c69eb5fe52d59f2c4fe015986d76495f2f2674aabf7c087e0f6307e00e44"
    source: "hf://NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4@3b554c28e968128990ef4ac2d25ca757bf4ce048"
    family: "qwen"
