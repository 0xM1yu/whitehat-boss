  qwen3-8b:
    # 2026-08-25 ATOM에서는 **기동만** 했다(추론 없음). 상세는
    # docs/experiments/harness/2026-08-25-serving-nvfp4-atom.md §3.
    # 처리량은 그 뒤 2026-09-04에 쟀다 — 아래 benchmark 문단.
    #
    # `quantization`이 `fp4`였는데 **틀린 값이다.** 체크포인트가 선언하는 것은 NVFP4이고
    # (기동 로그: `Detected ModelOpt NVFP4 checkpoint (quant_algo=NVFP4)`,
    # `quantization=modelopt_fp4`) `fp4`는 이 registry의 다른 어느 모델도 쓰지 않는 값이다.
    # docs/portability.md §5 #1이 이 모델을 `fp4`로 세고 있었던 것도 여기서 왔다.
    #
    # **2026-09-04 ATOM 실측으로 처리량이 채워졌다** — 이 모델의 첫 처리량 측정이다.
    # `cli bench --profile local_balanced_hybrid --device atom --roles scout auditor
    # --concurrency 8 16 32 --apply`, 8001·8002·8004·8005 넷이 동시에 뜬 상태.
    #
    # **`tok_s_batch32` 388.46은 캐시 ON에서 나왔다** — 옆 필드의 적중률 0.9981이 그
    # 근거다. 같은 축의 캐시 OFF 값은 재지 않았으므로 이 수를 캐시 OFF 값과 나란히
    # 놓지 마라(#128이 auditor에서 1.81배 갈림을 보인 것과 같은 함정이다).
    #
    # **`mem_gb_ctx8k`는 여전히 0이다** — `nvidia-smi --query-gpu`가 통합메모리 장비에서
    # `[N/A]`를 준다. 그래서 이 모델은 `unmeasured_models()`에서 빠지되
    # `partially_measured_models()`에 들어가고, production 프로필에서는 **여전히
    # ERROR다**(cli.py `_check_benchmarks` — 부분 측정도 막는다). model-serving.md §5의
    # 게이트는 열리지 않았다.
    #
    # **아래 세 값의 원천은
    # docs/experiments/harness/2026-09-04-five-model-residency-atom.md §9다** — 그 절의
    # `--apply` 판이 `tok_s_single 35.78` · `tok_s_batch32 388.46` ·
    # `prefix_hit_ratio_batch32 0.9981`로 이 블록에 적힌 것과 같고, 동시성 1/8/16/32의
    # tok/s·적중률 원표와 실패 0건도 거기 있다.
    #
    # ⚠ **그 파일은 #142가 들여온다** — 이 주석이 그 PR보다 먼저 도는 순간이 있다. 경로로만
    # 적고 마크다운 링크로 바꾸지 않는다: 링크 검사(`test_internal_links_point_at_a_real_file`)는
    # `*.md`만 수집해 YAML을 안 보지만, #142 전에는 링크가 읽는 사람에게 끊어진 포인터다.
    endpoint: "http://127.0.0.1:8001/v1"
    context_limit: 131072
