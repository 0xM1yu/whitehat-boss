    license: "Apache-2.0"
    checksum: "sha256:38fa6aacb2da61c5c3eba2e4f636a0f37acaeb1bcdb3cb3e93c3f15f5615f09f"
    source: "hf://nvidia/Qwen3-8B-NVFP4@ccd10a893cbca613259517c3efe08e151ddf2b8e"
    family: "qwen"
    prompt_template_version: "v1"
    fallback: "qwen3-4b"
    benchmark:
