    #   "none")`로만 번역돼 low·medium·high가 같다. 게다가 이 registry의 `reasoning_effort`는
    #   `low|medium|high`만 받는다(`src/config.py`).
    # - **`disable_any_whitespace true`를 건다.** 옛 Auditor(`qwen3-coder-30b-a3b`)에서 필수로 잰 인자다(그
    #   항목은 2026-09-24에 지웠다 — 원천은 이슈 #172). parser 없이 이 인자만 빼 보지는 않았다. 재시도 1건은 공백이 아니라 **숫자 폭주**였다 —
    #   `repro_spec.steps`의 명령 인자 안에 `9`가 3,808자 이어져 첫 시도가 4,096에서 잘렸다
    #   (`finish_reason: length`). 두 번째 시도는 382토큰으로 끝났다(서버 로그). 이 인자는 그 폭주를 못 막는다.
    # - 속도: 단일 요청 생성 26.2 tok/s다(서버 로그 10초 창 중앙값, 81창). 창의 절반에 프리필이 섞여 있고,
    #   순수 디코드 42창만 보면 26.6이다. 그래서 `output_max` 4,096은 ≈156 s다(계산값). auditor 호출 wall은
    #   중앙값 16.2 s · 최대 171.0 s였다(trace `model_call`).
